<script>
/* ═══════════════════════════════════════════════════════════════════════════
   v0.14 — Speed-to-lead leads list. See header comment for the blueprint.
   ═══════════════════════════════════════════════════════════════════════════ */

const VERSION = 'pc-0.3';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── deterministic PRNG so the 2,400 seed is stable across reloads ── */
function mulberry32(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ── clock: overridable so tests can freeze it ── */
let NOW_OVERRIDE = null;
function clock(){ return NOW_OVERRIDE != null ? NOW_OVERRIDE : Date.now(); }
const BOOT = Date.now();
const MIN = 60*1000, HR = 60*MIN, DAY = 24*HR;

/* ── reference data ── */
const SOURCES = {
  instagram:{label:'Instagram'}, facebook:{label:'Facebook'}, website:{label:'Website form'},
  katie:{label:'Katie'}, phone:{label:'Phone'}, walkin:{label:'Walk-in'},
  referral:{label:'Referral'}, unknown:{label:'Unknown source'},
};
const PROCEDURES = ['Rhinoplasty','Breast augmentation','Breast lift','Tummy tuck','Liposuction','Facelift','Lip filler','Botox','Eyelid surgery','Mummy makeover','Laser hair removal','Skin resurfacing','Brow lift','Gynecomastia','Mole removal'];
/* Procedure sub-types, grouped along common aesthetic-industry lines (ASPS-style:
   face / breast / body / non-surgical). Shown as subfolders in the Procedure
   filter. Every PROCEDURES entry must appear in exactly one group. */
const PROCEDURE_GROUPS = [
  { key:'face',        label:'Face',         items:['Rhinoplasty','Facelift','Eyelid surgery','Brow lift'] },
  { key:'breast',      label:'Breast',       items:['Breast augmentation','Breast lift','Gynecomastia'] },
  { key:'body',        label:'Body',         items:['Tummy tuck','Liposuction','Mummy makeover'] },
  { key:'injectables', label:'Injectables',  items:['Botox','Lip filler'] },
  { key:'skin',        label:'Skin & laser', items:['Laser hair removal','Skin resurfacing','Mole removal'] },
];
/* rough deal size per procedure (USD — Belcara Health is US-based) — drives the per-lead estimated value so
   high-value enquiries stand out. Multi-procedure enquiries sum. */
const PROCEDURE_VALUE = {
  'Rhinoplasty':7500,'Breast augmentation':9000,'Breast lift':8500,'Tummy tuck':9500,
  'Liposuction':6000,'Facelift':12000,'Lip filler':350,'Botox':300,'Eyelid surgery':5000,
  'Mummy makeover':15000,'Laser hair removal':900,'Skin resurfacing':1500,'Brow lift':6500,
  'Gynecomastia':7000,'Mole removal':500,
};
function fmtMoney(v){ return v ? '$'+Number(v).toLocaleString('en-US') : '—'; }
/* Stages mirror inbox.html exactly (Discover→Long-term) — same vocabulary AND
   same chip colours — so a person's stage reads identically across both tools. */
const STAGES = ['discover','consult','decide','preop','surgery','recover','longterm'];
const STAGE_META = {
  discover:{label:'Discover',  cls:'sp-discover'},
  consult: {label:'Consult',   cls:'sp-consult'},
  decide:  {label:'Decide',    cls:'sp-decide'},
  preop:   {label:'Pre-op',    cls:'sp-preop'},
  surgery: {label:'Surgery',   cls:'sp-surgery'},
  recover: {label:'Recover',   cls:'sp-recover'},
  longterm:{label:'Long-term', cls:'sp-longterm'},
};
const STAGE_LABEL = Object.fromEntries(Object.entries(STAGE_META).map(([k,v]) => [k, v.label]));
function stageChip(l){ const s = STAGE_META[l.stage] || STAGE_META.discover; return `<span class="stage-chip ${s.cls}">${esc(s.label)}</span>`; }
const STATUS_LABEL = {uncontacted:'Uncontacted',in_progress:'In progress',replied:'Replied',snoozed:'Snoozed',closed:'Closed'};
const FIRST=['Emma','Sofia','Laura','Priya','Yuki','Mei','Beatrice','Camille','Charlotte','Ava','Mia','Olivia','Isla','Freya','Nadia','Hannah','Zoe','Lucia','Maya','Chloe','Ruby','Grace','Léa','Anna','Sara','Elena','Nora','Ida','清','Aisha','Fatima','Yasmin','Daniela','Marta','Ingrid','Sophie','Jessica','Jennifer','Megan','Holly','Paige','Tara','Vera','Lena','Romy','Bea','Noor','Lily','Eva','Klara'];
const LAST=['Lindqvist','Andersen','Müller','Nair','Tanaka','Kowalski','Johansson','Olsen','Webb','Reeves','Costa','Khan','Brooks','Park','Mehta','Sjöberg','Rossi','Chen','Vance','Holloway','Pearson','Nguyen','Schmidt','Dubois','Romano','Ahmed','Kaur','Walsh','Petrova','Larsen','Bauer','Fischer','Ivanova','Silva','Moreau','Hansen','Berg','Novak','Haas','Vogel'];

/* ── data-quality codes ── */
const DEFECTS = {
  name_handle:'Name is an Instagram handle, not verified',
  name_partial:'Name looks incomplete',
  name_junk:'Name looks like junk input',
  phone_missing:'No phone number on file',
  phone_partial:'Phone number looks incomplete',
  email_bounced:'Email bounced recently',
  email_missing:'No email on file',
  duplicate:'Possible duplicate of another lead',
  no_consent:'No SMS marketing consent on file',
  interest_blank:'No stated interest',
  source_unknown:'Source could not be determined',
  spam:'Looks like spam',
};

/* ── seed ~2,400 leads deterministically ── */
const TOTAL_SEED = 2400;
let LEADS = [];
let NEXT_ID = 1;

function buildSeed(){
  const rnd = mulberry32(20260519);
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  const chance = p => rnd() < p;
  const out = [];

  /* 9 featured leads map to real inbox threads, placed hot/cooling so the
     demo's clickable rows land on actual conversations in inbox.html. */
  const featured = [
    {inboxPatientId:3,  first:'Charlotte', last:'Webb',       source:'phone',     interest:'Facelift',            ageMs:18*DAY, chan:'sms', status:'replied', stage:'recover'},
    {inboxPatientId:0,  first:'Emma',      last:'Lindqvist',  source:'instagram', interest:'Rhinoplasty',         ageMs:4*MIN,  chan:'wa',  stage:'discover'},
    {inboxPatientId:9,  first:'Yuki',      last:'Tanaka',     source:'referral',  interest:'Eyelid surgery',      ageMs:9*MIN,  chan:'em',  stage:'consult'},
    {inboxPatientId:2,  first:'Laura',     last:'Müller',     source:'instagram', interest:'Tummy tuck',          ageMs:26*MIN, chan:'sms', stage:'discover', interests:['Tummy tuck','Breast augmentation']},
    {inboxPatientId:5,  first:'Priya',     last:'Nair',       source:'referral',  interest:'Liposuction',         ageMs:48*MIN, chan:'em',  stage:'consult', prefersCall:true},
    {inboxPatientId:1,  first:'Sofie',     last:'Andersen',   source:'referral',  interest:'Breast augmentation', ageMs:3*HR,   chan:'em',  status:'replied',     stage:'preop'},
    {inboxPatientId:12, first:'Mei',       last:'Kowalski',   source:'facebook',  interest:'Laser hair removal',  ageMs:3*DAY,  chan:'em',  status:'in_progress', stage:'decide',   interests:['Laser hair removal','Lip filler']},
    {inboxPatientId:13, first:'Beatrice',  last:'Johansson',  source:'referral',  interest:'Rhinoplasty',         ageMs:5*DAY,  chan:'wa',  status:'replied',     stage:'surgery'},
    {inboxPatientId:14, first:'Camille',   last:'Olsen',      source:'instagram', interest:'Lip filler',          ageMs:30*DAY, chan:'em',  status:'replied',     stage:'longterm'},
  ];
  for (const f of featured){
    out.push(makeLead(rnd, {
      name:`${f.first} ${f.last}`, nameQuality:'ok', source:f.source, interest:f.interest, interests:f.interests||[f.interest],
      arrivedAt: BOOT - f.ageMs, status: f.status || 'uncontacted', stage: f.stage,
      inboxPatientId:f.inboxPatientId, preferredChannel:f.chan, prefersCall:f.prefersCall||false,
      phone:'+1 410 555 '+String(1000+Math.floor(rnd()*8999)), phoneValid:true,
      email:`${f.first.toLowerCase()}.${f.last.toLowerCase().replace(/[^a-z]/g,'')}@gmail.com`, emailStatus:'ok',
      smsConsent:true, clean:true,
    }));
  }

  for (let i = out.length; i < TOTAL_SEED; i++){
    /* age distribution: a few hot, some cooling, many slow/stale, lots contacted */
    const r = rnd();
    let ageMs;
    /* Hot is kept RARE and precious — a clinic with a healthy speed-to-lead
       habit should have only a handful of just-arrived uncontacted leads at
       once. Too many red gutters becomes the alarm the founder rejected. */
    if (r < 0.0016) ageMs = rnd()*5*MIN;             // hot     (~4)
    else if (r < 0.007) ageMs = 5*MIN + rnd()*55*MIN; // cooling (~13)
    else if (r < 0.06) ageMs = HR + rnd()*23*HR;      // slow    (~130)
    else if (r < 0.20) ageMs = DAY + rnd()*40*DAY;    // stale-eligible (~335)
    else ageMs = rnd()*45*DAY;                        // contacted-eligible
    out.push(makeLead(rnd, {arrivedAt: BOOT - ageMs}));
  }

  /* Demo thread depth: assign each uncontacted person a thread length by their
     initial position in the speed-to-lead list, so the top rows carry rich,
     scrollable conversations and most new enquiries are a single message.
     (Top lead ~25, next ~15, rest of the top 5 >10, then tapering to 1.) */
  out.filter(l => l.status === 'uncontacted')
    .sort((a,b) => (leadScore(b,BOOT) - leadScore(a,BOOT)) || (a.arrivedAt - b.arrivedAt))   // deepest threads on the top-scored leads
    .forEach((l,i) => {
      l.threadLen = i===0 ? 25 : i===1 ? 15 : i<5 ? (13-(i-2)) : i<12 ? (10-(i-5)) : (1 + (threadHash(l.id) % 2));
    });

  /* Complications: a few post-op/clinical alerts the coordinator must handle
     fast — flagged on established (surgery/recover/long-term) patients. */
  out.filter(l => ['surgery','recover','longterm'].includes(l.stage)).slice(0,3).forEach(l => l.complication = true);

  /* Multiplayer: a couple of leads are already being worked by OTHER coordinators
     in the clinic — their rows carry the red assignment wash + a claim tag, and
     opening one shows "<name> is currently working on this lead" with a Continue.
     Featured, near-the-top leads so the demo lands on them. (Post-seed flags —
     no PRNG draws.) */
  const CLAIMED_BY = { 'Yuki Tanaka':'Sarah Kim', 'Laura Müller':'Dave Lansing' };
  out.forEach(l => { if (CLAIMED_BY[l.name]) l.claimedBy = CLAIMED_BY[l.name]; });
  return out;
}

function makeLead(rnd, over){
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  const chance = p => rnd() < p;
  let first = pick(FIRST), last = pick(LAST);
  let name = `${first} ${last}`, nameQuality = 'ok';
  let source = pick(Object.keys(SOURCES).filter(s=>s!=='unknown'));
  let interest = pick(PROCEDURES);
  // ~22% of people enquire about more than one procedure (e.g. a mummy makeover
  // combo). interest stays the PRIMARY; interests carries the full list.
  let interests = [interest];
  if (chance(0.22)){
    const more = PROCEDURES.filter(p => !interests.includes(p));
    interests.push(more[Math.floor(rnd()*more.length)]);
    if (chance(0.22)){ const more2 = PROCEDURES.filter(p => !interests.includes(p)); interests.push(more2[Math.floor(rnd()*more2.length)]); }
  }
  let phone = '+1 '+pick(['410','305','646','312','617'])+' 555 '+String(1000+Math.floor(rnd()*8999));
  let phoneValid = true;
  let email = `${first.toLowerCase()}.${last.toLowerCase().replace(/[^a-z]/g,'')}@`+pick(['gmail.com','outlook.com','yahoo.com','icloud.com']);
  let emailStatus = 'ok';
  let smsConsent = chance(0.85);
  let status = 'uncontacted';
  let stage = 'discover';
  let duplicateOf = null, isSpam = false;
  const defects = [];

  if (!over || !over.clean){
    /* dirty-data injection (~20% defect rate spread across fields) */
    if (chance(0.10)){ // name issues
      if (chance(0.5)){ name = '@'+first.toLowerCase()+(chance(0.5)?'_':'')+Math.floor(rnd()*99); nameQuality='handle'; defects.push('name_handle'); }
      else if (chance(0.5)){ name = first; nameQuality='partial'; defects.push('name_partial'); }
      else { name = pick(['asdf','test test','aaa','...','—']); nameQuality='junk'; defects.push('name_junk'); }
    }
    if (chance(0.15)){ if (chance(0.5)){ phone=null; phoneValid=false; defects.push('phone_missing'); } else { phone=phone.slice(0,10); phoneValid=false; defects.push('phone_partial'); } }
    if (chance(0.10)){ if (chance(0.6)){ emailStatus='bounced'; defects.push('email_bounced'); } else { email=null; emailStatus='missing'; defects.push('email_missing'); } }
    if (chance(0.18)){ interest=''; interests=[]; defects.push('interest_blank'); }
    if (chance(0.05)){ source='unknown'; defects.push('source_unknown'); }
    if (!smsConsent) defects.push('no_consent');
    if (chance(0.015)){ isSpam=true; name=pick(['asdf','Test test','xxxx']); nameQuality='junk'; defects.push('spam'); }
  } else {
    if (!smsConsent) defects.push('no_consent');
  }

  /* status / stage from age, unless overridden */
  const arrivedAt = over && over.arrivedAt != null ? over.arrivedAt : (BOOT - rnd()*45*DAY);
  const age = BOOT - arrivedAt;
  if (over && over.status){ status = over.status; }
  else if (age > 3*DAY && chance(0.7)){ status = pick(['replied','in_progress','closed','snoozed']); }
  else if (age > DAY && chance(0.35)){ status = pick(['in_progress','replied','snoozed']); }
  // pre-patient leads skew early: most are Discover, a contacted few progress.
  if (status === 'replied' || status === 'closed') stage = pick(['consult','consult','decide','decide','preop']);
  else if (status === 'in_progress') stage = pick(['discover','consult','consult','decide']);
  else if (status === 'snoozed') stage = pick(['discover','consult']);
  else if (chance(0.12)) stage = 'consult'; // a few uncontacted have already booked a consult

  const contacted = (status !== 'uncontacted');
  const lead = Object.assign({
    id: NEXT_ID++,
    inboxPatientId: null,
    name, nameQuality,
    arrivedAt,
    status,
    firstOutboundAt: contacted ? arrivedAt + Math.floor(rnd()*6*HR) : null,
    lastTouchAt: contacted ? arrivedAt + Math.floor(rnd()*12*HR) : null,
    source, interest, interests, stage,
    /* preferred channel tracks the source so messaging suggestions read
       naturally (an Instagram lead → Instagram/WhatsApp, a phone lead → call).
       This is what makes most suggested actions messages, not calls. */
    preferredChannel: ({instagram:'wa', facebook:'wa', website:'em', katie:'wa', referral:'wa', walkin:'sms', phone:'sms', unknown:'em'}[source]) || pick(['wa','em']),
    phone, phoneValid,
    email, emailStatus,
    smsConsent,
    duplicateOf, isSpam,
    defects,
    setup: buildSetup(rnd, status),
    automation: buildAutomation(rnd, status, defects),
  }, over || {});
  // recompute defects if overridden cleanly
  if (over && over.clean){ lead.defects = lead.smsConsent ? [] : ['no_consent']; }
  // estimated value from the final interest set (+ deterministic ±10% by id, so
  // we don't perturb the PRNG sequence). Blank-interest leads show no value.
  lead.value = (lead.interests || []).reduce((s,p) => s + (PROCEDURE_VALUE[p] || 0), 0);
  if (lead.value){ const j = 0.9 + ((threadHash(lead.id) % 21) / 21) * 0.2; lead.value = Math.round(lead.value * j / 50) * 50; }
  return lead;
}

/* Coherent journey progress for a lead's setup — each step implies the prior
   (appointment → health declaration → consents → silhouette), so the Status
   column and the suggested next action never disagree. Makes exactly 3 rnd()
   draws (same as the old setup) so the seed sequence is unchanged. */
function buildSetup(rnd, status){
  const accountCreated = rnd() < 0.5;
  const r2 = rnd(), r3 = rnd();
  let prog = 0; // 0 none · 1 appointment · 2 health declaration · 3 consents · 4 silhouette
  if (status !== 'uncontacted'){
    const booked = r3 < (status === 'replied' || status === 'closed' ? 0.85 : 0.4);
    if (booked) prog = r2 < 0.30 ? 1 : r2 < 0.60 ? 2 : r2 < 0.82 ? 3 : 4;
  }
  return { accountCreated, consultBooked: prog>=1, formsReturned: prog>=2, consentsSigned: prog>=3, silhouetteShared: prog>=4 };
}
function buildAutomation(rnd, status, defects){
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  // most auto-sends succeed; failures correlate with dirty data
  let state = 'done', delivery = [{channel:'em',status:'delivered'}];
  const tflags = [];
  if (defects.includes('email_bounced')){ delivery=[{channel:'em',status:'bounced'}]; state='failed'; }
  if (defects.includes('no_consent')){ tflags.push('no_consent_held'); state = state==='failed'?'failed':'blocked'; delivery.push({channel:'sms',status:'held'}); }
  if (rnd() < 0.04){ tflags.push('placeholder_unresolved'); state='failed'; }
  if (rnd() < 0.03){ tflags.push('link_blocked'); state='failed'; }
  if (status==='uncontacted' && rnd()<0.3) state='queued';
  return { lastEvent: pick(['Enquiry acknowledgement','Welcome email + SMS','Day-3 nudge','Re-engagement touch','Booking reminder']), state, at: Date.now()-Math.floor(rnd()*3*DAY), delivery, templateFlags:tflags };
}

/* ── pure: urgency tier ── */
function urgencyTier(lead, now){
  now = now || clock();
  if (lead.status !== 'uncontacted' || lead.firstOutboundAt) return 'contacted';
  const age = now - lead.arrivedAt;
  if (age <= 5*MIN) return 'hot';
  if (age <= 60*MIN) return 'cooling';
  if (age <= 24*HR) return 'slow';
  return 'stale';
}
const TIER_RANK = { hot:0, cooling:1, slow:2, stale:3, contacted:4 };

/* ── pure: derived defect list (capped display handled in render) ── */
function defectsOf(lead){ return (lead.defects||[]).map(code => ({code, label: DEFECTS[code] || code})); }

/* ── channel verbs/labels. ig/fb are platform DMs (no SMS consent needed);
   wa/sms are SMS-class and gated on marketing consent (Belcara P0). ── */
const CHANNEL_VERB  = { ig:'Reply on Instagram', fb:'Reply on Messenger', wa:'Send WhatsApp', sms:'Send SMS', em:'Send email', call:'Call now' };
const CHANNEL_LABEL = { ig:'Instagram', fb:'Messenger', wa:'WhatsApp', sms:'SMS', em:'Email', call:'phone' };
const MESSAGE_CHANNELS = ['ig','fb','wa','sms','em'];

/* pure: pick the channel a coordinator should contact this lead on. People
   reply where they came from, so source drives the default; we fall back
   through reachable channels and gate SMS-class transports on consent.
   Result is mostly MESSAGES — calls only where messaging isn't viable. */
function suggestedChannel(lead){
  const canCall  = !!(lead.phone && lead.phoneValid);
  // some people simply respond better to a call — honour that first
  if (lead.prefersCall && canCall) return 'call';
  const canSms   = canCall && lead.smsConsent;          // SMS + WhatsApp
  const canEmail = !!(lead.email && lead.emailStatus === 'ok');
  const order = {
    instagram: ['ig','em','wa','call'],
    facebook:  ['fb','em','wa','call'],
    website:   ['em','wa','sms','call'],
    katie:     ['wa','em','sms','call'],
    referral:  ['wa','em','call','sms'],
    walkin:    ['sms','call','em'],
    phone:     ['call','sms','em'],
    unknown:   ['em','wa','call'],
  }[lead.source] || ['em','wa','call'];
  const reachable = ch =>
    ch === 'ig'  ? lead.source === 'instagram' :
    ch === 'fb'  ? lead.source === 'facebook'  :
    ch === 'wa'  ? canSms :
    ch === 'sms' ? canSms :
    ch === 'em'  ? canEmail :
    ch === 'call'? canCall : false;
  for (const ch of order){ if (reachable(ch)) return ch; }
  if (canCall) return 'call';
  return null;
}

function firstName(l){ return (l.name||'there').split(/[\s_]/)[0].replace(/^@/,'') || 'there'; }
function interestsOf(l){ return (l.interests && l.interests.length) ? l.interests : (l.interest ? [l.interest] : []); }
/* "tummy tuck and breast augmentation" / "your treatment" — for message + thread copy */
function interestPhrase(l){ const a = interestsOf(l).map(s=>s.toLowerCase()); return a.length===0 ? 'your treatment' : a.length===1 ? a[0] : a.slice(0,-1).join(', ')+' and '+a[a.length-1]; }

/* ── patient-journey TASKS: recommended next steps that are neither a message
   nor a call. They surface once a person is engaged, matched to where they are
   in the journey. Prototype side-effects live in completeTask(). ── */
const TASK_META = {
  consult:    { label:'Book appointment',            desc:'They’re ready to come in — set up their appointment.',                                              verb:'Book appointment' },
  forms:      { label:'Send health declaration',     desc:'Send the health-declaration link so the surgeon can review their history before the appointment.',   verb:'Send declaration' },
  consents:   { label:'Send consent forms',          desc:'Send the consent forms to review and sign ahead of their procedure.',                                verb:'Send consents' },
  silhouette: { label:'Share Silhouette simulation', desc:'Share a personalised 3D Silhouette simulation so they can picture the result and decide.',           verb:'Open Silhouette' },
};
function nextPatientTask(lead){
  if (lead.status === 'uncontacted') return null;   // first contact is a message, not a task
  // Pre-op onward, the consult + paperwork are already behind them (per the stage
  // meanings) — don't suggest booking a consult or sending forms for those people.
  if (['preop','surgery','recover','longterm'].includes(lead.stage)) return null;
  const s = lead.setup || {};
  const T = k => ({ kind:'task', task:k, label:TASK_META[k].label });
  if (!s.consultBooked)                        return T('consult');    // Book appointment
  if (!s.formsReturned && !s.declarationSent)  return T('forms');      // Health declaration
  if (!s.consentsSigned)                       return T('consents');   // Consents
  if (lead.stage === 'decide' && !s.silhouetteShared) return T('silhouette');
  return null;
}
/* the patient's current journey status. The three paperwork/simulation steps
   (health declaration, consents, Silhouette) collapse into one bucket, "Action
   needed" — the detail pane still surfaces the SPECIFIC next task (nextPatientTask).
   Five statuses total once overlays are applied: New · Complication · Book
   appointment · Appointment booked · Action needed. */
function patientStatus(lead){
  const s = lead.setup || {};
  if (s.formsReturned || s.declarationSent || s.consentsSigned || s.silhouetteShared)
    return { key:'action', label:'Action needed' };
  if (s.consultBooked) return { key:'appointment', label:'Appointment booked' };
  return { key:'todo', label:'Book appointment' };
}
/* ── ONE source of truth for "status" ──
   The Status column, the top Status filter, and the detail pane all read this,
   so what you see, what you filter, and what the record says are identical.
   Overlays (complication, new inquiry) outrank the journey milestone. */
function leadStatus(lead, now){
  now = now || clock();
  if (lead.complication) return { key:'complication', label:'Complication', kind:'complication' };
  if (lead.status === 'uncontacted' && (now - lead.arrivedAt) < NEW_INQUIRY_MS)
    return { key:'new', label:'New', kind:'new' };
  const st = patientStatus(lead);
  return { key:st.key, label:st.label, kind:'journey' };
}
/* the Status-filter options, in journey order — labels MUST match the chips the
   column renders (leadStatus.label) so the filter is consistent with the view. */
const STATUS_FILTER = [
  { v:'all',          label:'All' },
  { v:'new',          label:'New' },
  { v:'todo',         label:'Book appointment' },
  { v:'appointment',  label:'Appointment booked' },
  { v:'action',       label:'Action needed' },
  { v:'complication', label:'Complication' },
];

/* ── lead score: the behind-the-scenes priority the list is ordered by ──
   The point (founder): DON'T sort purely by time. Sort by how important this
   person is to engage with right now — so a complication or a high-value patient
   with an outstanding task can outrank a newer-but-quieter lead. Time is one
   input, not the sort key.
     • Fresh new inquiries spike to the very top (speed-to-lead — catch them now).
     • Complications ride just under the hottest inquiries (critical, always visible).
     • Journey tasks (book / declaration / consents / silhouette) are ranked by the
       importance of the outstanding step + the patient's value + a little warmth,
       so a valuable overdue booking beats a low-value one regardless of age.
   Result: the top of the list is a diverse, importance-first work queue rather
   than a wall of the newest arrivals. */
function daysSince(lead, now){ return Math.max(0, (now - (lead.lastTouchAt || lead.firstOutboundAt || lead.arrivedAt)) / DAY); }
function leadScore(lead, now){
  now = now || clock();
  if (lead.isSpam) return -1000;                                  // junk sinks
  const st = leadStatus(lead, now);
  const value = Math.min(220, (lead.value || 0) / 90);            // 0..~220 (≈ $20k caps out)
  if (st.kind === 'new'){
    const fresh = 1 - Math.min(1, (now - lead.arrivedAt) / NEW_INQUIRY_MS);  // 1 → 0 over 30 min
    return 780 + 640 * fresh + value * 0.5;                       // just-arrived ≈ 1400 → 30-min ≈ 780+
  }
  if (st.kind === 'complication'){
    return 1120 + value * 0.4 + Math.min(90, daysSince(lead, now) * 9);      // ~1120–1300 — under the hottest, above the rest
  }
  // journey: importance of the outstanding step + value + recency warmth
  const BASE = { action:580, todo:560, appointment:470 };
  const warmth = 80 * Math.max(0, 1 - daysSince(lead, now) / 10); // recent activity → up to +80
  return (BASE[st.key] ?? 450) + value + warmth;                  // ~470–900
}

/* ── pure: suggested next action (coordinator), degrading on dirty data ── */
function suggestedAction(lead){
  if (lead.isSpam) return {label:'Dismiss', kind:'dismiss', ghost:true};

  // a flagged complication is the most important thing in the list — it's a
  // critical task that needs a person now, ahead of any journey step.
  if (lead.complication) return {label:'Respond now', kind:'critical', channel: suggestedChannel(lead) || lead.preferredChannel || 'em'};
  if (lead.status === 'uncontacted'){
    // speed-to-lead: reach out on the smart channel (mostly messages, few calls)
    if (urgencyTier(lead) === 'stale') return {label:'Auto follow-up active', kind:'wait'};
    const ch = suggestedChannel(lead);
    if (!ch) return {label:'No reachable channel', kind:'disabled'};
    return { label: CHANNEL_VERB[ch], kind: ch, channel: ch };
  }
  // engaged — recommend the real journey step (a task) when there is one
  const task = nextPatientTask(lead);
  if (task) return task;
  if (lead.status === 'replied') return {label:'Reply now', kind:'reply', channel:lead.preferredChannel};
  if (lead.status === 'closed')  return {label:'Reopen', kind:'reply', ghost:true, channel:lead.preferredChannel};
  if (lead.status === 'snoozed') return {label:'Resume', kind:'reply', ghost:true, channel:lead.preferredChannel};
  const fch = suggestedChannel(lead) || 'em';
  return { label:'Follow up', kind:fch, channel:fch };
}

/* pure: a generated, personalized first message for the composer. Tone is
   tuned per channel (DM/SMS short; email a touch fuller). `variant` rotates
   the opener so "Regenerate" visibly changes the draft. Sentence case. */
function genMessage(lead, channel, variant){
  variant = variant || 0;
  const first = firstName(lead);
  const proc = (lead.interest || '').toLowerCase();
  const about = proc ? `about ${proc}` : `about getting started`;
  const isReply = lead.status !== 'uncontacted' || (lead.threadLen || 0) > 3;   // they have an ongoing thread
  if (channel === 'em'){
    const emails = isReply ? [
      `Hi ${first},\n\nThanks for getting back to me — lovely to hear from you. I'm happy to help with the next step whenever you're ready; just say the word and I'll take care of it.\n\nWarmly,\nThe Adoreal team`,
      `Hi ${first},\n\nGreat to hear from you again. Let's keep things moving at a pace that suits you — would you like me to line up the next step now?\n\nWarmly,\nThe Adoreal team`,
    ] : [
      `Hi ${first},\n\nThanks so much for reaching out ${about} — I'd love to help you explore it. We can talk you through what's involved, recovery, and pricing with no pressure at all.\n\nWould a quick call this week suit you, or shall I share a few details here first?\n\nWarmly,\nThe Adoreal team`,
      `Hi ${first},\n\nLovely to hear from you ${about}. Every journey starts with a relaxed, no-obligation chat — we'll answer your questions and only move at your pace.\n\nIs there a day this week that works for a short call?\n\nWarmly,\nThe Adoreal team`,
    ];
    return emails[variant % emails.length];
  }
  const dms = isReply ? [
    `Hi ${first}! Thanks for getting back to me 🤍 Happy to help with the next step — shall I set that up for you?`,
    `Hi ${first}! Lovely to hear from you again. Want me to sort the next step now, or is there anything else I can answer first?`,
  ] : [
    `Hi ${first}! Thanks for reaching out ${about} 🤍 I'd love to help. Are you free for a quick chat, or shall I send a couple of times that work for you?`,
    `Hi ${first}! So glad you got in touch ${about}. No pressure at all — would you like me to share a few options, or is now a good moment for a quick call?`,
  ];
  return dms[variant % dms.length];
}

/* pure: the conversation thread. We synthesise a realistic, deterministic
   history — oldest→newest — so the coordinator can scroll back through the whole
   exchange inline (no need to open the inbox just to read context). The most
   recent messages are stage-coherent (they line up with the recommended next
   step); older ones are earlier touch-points mixed with logged calls + system
   sends, like the live thread. Empty for uncontacted people. */
const THREAD_FILL_OUT = [
  `Just following up — are you still keen to explore your options?`,
  `No rush at all, I'm here whenever you're ready 🤍`,
  `Happy to answer any questions in the meantime.`,
  `Wanted to check this didn't get buried — shall we find a time for a quick chat?`,
  `We've got some availability next week if that helps.`,
];
const THREAD_FILL_IN = [
  `Sorry for the slow reply!`,
  `Thanks — still thinking it over.`,
  `Could you remind me roughly on the pricing?`,
  `Yes, still interested 🙂`,
  `It's been a busy few weeks, apologies.`,
];
const THREAD_FILL_LOG = [
  `Auto welcome email + SMS sent`,
  `Day-3 nudge sent automatically`,
  `Called — no answer, left voicemail`,
  `Re-engagement touch-point sent`,
  `Note: asked to be called back after 5pm`,
];
/* the latest, still-unanswered inbound — why this person is in the reply queue */
const THREAD_UNANSWERED = [
  `So — what's the next step? I'm really keen to get booked in.`,
  `Sorry to chase! Do you have any availability this week?`,
  `Could you let me know roughly on cost? Trying to plan ahead 🙂`,
  `Is it possible to speak to someone today?`,
  `Still hoping to hear back — thank you!`,
];
function threadHash(id){ return (Math.imul(id || 1, 2654435761)) >>> 0; }
/* Patient 360 (v0.44) — stage-gated. Beyond Discover = a patient with a full
   record in Adoreal; Discover leads are still inquiries (no 360 yet). */
function isPatient(l){ return l.stage !== 'discover'; }
function patientNo(l){ return 100000 + (threadHash(l.id) % 900000); }   // stable 6-digit patient number
function patient360Url(l){ return `https://my.adoreal.com/patients/${patientNo(l)}`; }
function patientIdLabel(l){ return `PAT ${patientNo(l)}`; }             // the real app's Patient ID format

/* ── AI summary for the MESSY MIDDLE (v0.46, Johan's context idea) ──
   Between Discover and Long-term is where humans carry the journey, so that's
   where a catch-up brief earns its place. The summary is composed from the
   lead's own story (stage, last message, next step, channel), stamped with
   when it was generated; if it's over a day old a Generate button appears. */
const MESSY_MIDDLE = ['consult','decide','preop','surgery','recover'];
function inMessyMiddle(l){ return MESSY_MIDDLE.includes(l.stage); }
function summaryAt(l){ return l.summaryGenAt || l.lastTouchAt || l.firstOutboundAt || l.arrivedAt; }
function aiSummary(l){
  const f = firstName(l), proc = interestsOf(l)[0] || 'their procedure';
  const opener = {
    consult:  `${f} is lining up a consult for ${proc}`,
    decide:   `${f} has had the consult and is weighing the decision on ${proc}`,
    preop:    `${f} is in pre-op preparation for ${proc}`,
    surgery:  `${f} is in the surgery window for ${proc}`,
    recover:  `${f} is recovering from ${proc}`,
  }[l.stage] || `${f} is mid-journey on ${proc}`;
  const bits = [`${opener} (${fmtMoney(l.value)} est.)`];
  const q = lastInboundText(l);
  if (q) bits.push(`Last from ${f}: “${q.length > 90 ? q.slice(0, 87) + '…' : q}”`);
  if (l.complication) bits.push(`A complication is flagged: respond before anything else`);
  else { const t = nextPatientTask(l); if (t) bits.push(`Next step: ${t.label.toLowerCase()}`); }
  bits.push(l.prefersCall ? `${f} responds best to a call` : `Best reach: ${CHANNEL_LABEL[suggestedChannel(l) || l.preferredChannel || 'em']}`);
  // each bit becomes its own sentence; quotes that already end punctuated stay as-is
  return bits.map(s => /[.!?…”]$/.test(s) ? s : s + '.').join(' ');
}
function genSummary(){
  const l = LEADS.find(x => x.id === selectedId); if (!l) return;
  l.summaryGenAt = clock();       // fresh stamp; the text recomposes from live state
  renderDetail(l);
}
function threadTotal(lead){ return 16 + (threadHash(lead.id) % 22); }   // 16..37 messages
/* the most recent, stage-coherent messages (newest last) */
function recentTail(lead){
  const s = lead.setup || {};
  const proc = (interestsOf(lead)[0] || 'your treatment').toLowerCase();
  const m = (dir, text) => ({ dir, text });
  if (lead.stage === 'decide' && s.consultBooked && !s.silhouetteShared)
    return [m('in',`Thank you! I had my consultation and I'm seriously considering going ahead.`),m('out',`That's wonderful to hear. How are you feeling about it so far?`),m('in',`Honestly, I'm just trying to picture what the result might actually look like on me.`),m('out',`Completely understandable — that's the biggest question at this stage.`)];
  if (!s.consultBooked)
    return [m('in',`I'd mainly like to understand the cost and how long recovery takes.`),m('out',`Of course. Pricing is tailored in a consultation, and recovery for ${proc} is usually a week or two. The best next step is a relaxed, no-obligation consult with one of our surgeons.`),m('in',`That sounds good — how do I book one?`)];
  if (!s.formsReturned && !s.declarationSent)
    return [m('in',`Thanks so much — I'm all set for my consultation!`),m('out',`Lovely! Before we meet, we just need your health declaration completed so the surgeon can review your history.`),m('in',`Happy to. Where do I find it?`)];
  return [m('in',`Thank you for the info — that's really helpful.`),m('out',`Any time! Is there anything else I can answer for you?`),m('in',`Not for now — I'll have a think and come back to you.`)];
}
function fullThread(lead){
  const f = firstName(lead), phrase = interestPhrase(lead);
  const srcLabel = (SOURCES[lead.source] || SOURCES.unknown).label;
  const m = (dir, text) => ({ dir, text });
  if (lead.status === 'uncontacted'){
    // they reached out via a channel and we HAVEN'T replied yet — the thread is
    // their unanswered message(s) (most recent at the bottom); the composer below
    // is our reply. This is WHY they're waiting. Length is set per lead
    // (lead.threadLen): the top of the list carries rich, scrollable histories;
    // most new enquiries are a single message. It ALWAYS ends on an unanswered
    // inbound (their latest message).
    const L = Math.max(1, lead.threadLen || 2);
    if (lead.source === 'phone' || lead.source === 'walkin'){
      // no chat bubbles — a logged call/walk-in enquiry
      return L <= 1 ? [m('log', `${srcLabel} enquiry — interested in ${phrase}`)]
                    : [m('log', `Enquiry received via ${srcLabel}`), m('log', `${srcLabel} enquiry — interested in ${phrase}`)];
    }
    const enquiry = m('in', `Hi, I saw your page and I'm interested in ${phrase}.`);
    if (L <= 1) return [enquiry];                                  // brand-new single message
    const out = [ m('log', `Enquiry received via ${srcLabel}`), enquiry ];
    const h = threadHash(lead.id);
    while (out.length < L){
      const i = out.length;
      if (i === L - 1)      out.push(m('in',  THREAD_UNANSWERED[(h + i) % THREAD_UNANSWERED.length]));  // ends unanswered
      else if (i % 6 === 5) out.push(m('log', THREAD_FILL_LOG[(h + i) % THREAD_FILL_LOG.length]));
      else if (i % 2 === 0) out.push(m('out', THREAD_FILL_OUT[(h + i * 3) % THREAD_FILL_OUT.length]));
      else                  out.push(m('in',  THREAD_FILL_IN[(h + i * 5) % THREAD_FILL_IN.length]));
    }
    return out;
  }
  const head = [
    m('log', `Enquiry received via ${srcLabel}`),
    m('in',  `Hi, I saw your page and I'm interested in ${phrase}.`),
    m('out', `Hi ${f}! Thanks for reaching out 🤍 I'd love to help — what would you like to know?`),
  ];
  const tail = recentTail(lead);
  const total = Math.max(head.length + tail.length, threadTotal(lead));
  const fillerN = total - head.length - tail.length;
  const h = threadHash(lead.id);
  const filler = [];
  for (let i = 0; i < fillerN; i++){
    if (i % 4 === 3)      filler.push(m('log', THREAD_FILL_LOG[(h + i) % THREAD_FILL_LOG.length]));
    else if (i % 2 === 0) filler.push(m('out', THREAD_FILL_OUT[(h + i * 3) % THREAD_FILL_OUT.length]));
    else                  filler.push(m('in',  THREAD_FILL_IN[(h + i * 5) % THREAD_FILL_IN.length]));
  }
  return [...head, ...filler, ...tail];
}
function buildThread(lead){ return fullThread(lead); }   // alias for the test surface

/* ── inbox deep-link ── */
function inboxHref(lead, chan){
  if (lead.inboxPatientId == null) return 'inbox.html';
  const c = chan || lead.preferredChannel || 'wa';
  return `inbox.html?patient=${lead.inboxPatientId}&chan=${c}`;
}
function actionHref(lead, act){
  if (act.kind === 'call') return lead.inboxPatientId!=null ? `inbox.html?patient=${lead.inboxPatientId}&action=log-call` : 'inbox.html';
  // message channels (ig/fb/wa/sms/em) — open the inbox on that channel
  if (MESSAGE_CHANNELS.includes(act.kind)) return inboxHref(lead, act.kind);
  if (act.kind === 'reply') return inboxHref(lead, act.channel);
  // Onboarding conversion verbs + Support diagnostic verbs both hand off to
  // the inbox (Support read-only). Without this they rendered dead buttons.
  if (act.kind === 'convert') return inboxHref(lead);
  if (act.kind === 'diag') return lead.inboxPatientId!=null ? `inbox.html?patient=${lead.inboxPatientId}&chan=${lead.preferredChannel||'em'}` : 'inbox.html';
  return null;
}

/* ── formatting ── */
function fmtTimer(lead, now){
  now = now || clock();
  if (lead.status !== 'uncontacted' || lead.firstOutboundAt){
    const t = lead.lastTouchAt || lead.firstOutboundAt || lead.arrivedAt;
    // Only say "replied" when they actually replied; otherwise "contacted".
    const verb = lead.status === 'replied' ? 'replied ' : 'contacted ';
    return { contacted:true, text: verb + fmtShort(now - t) };
  }
  const age = now - lead.arrivedAt;
  if (age <= 5*MIN){ const m=Math.floor(age/MIN), s=Math.floor((age%MIN)/1000); return {contacted:false, text:`${m}m ${String(s).padStart(2,'0')}s`}; }
  return { contacted:false, text: fmtShort(age) };
}
function fmtShort(ms){
  if (ms < MIN) return '<1m';
  if (ms < HR) return Math.floor(ms/MIN)+'m';
  if (ms < DAY) { const h=Math.floor(ms/HR), m=Math.floor((ms%HR)/MIN); return m?`${h}h ${m}m`:`${h}h`; }
  return Math.floor(ms/DAY)+'d';
}
function maskPhone(p){ if(!p) return null; const d=p.replace(/[^\d]/g,''); return p.length>9 ? p.slice(0,9)+' ··· '+d.slice(-2) : p+' …'; }
function initialsOf(lead){ const n=(lead.name||'').replace(/^@/,''); const parts=n.split(/[\s_.]+/).filter(Boolean); if(!parts.length) return '?'; return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase(); }

/* ── state ── */
let role = 'coordinator';   // lmspc fork: locked — no role switching in this file
let filters = { search:'', status:'all', stage:'all', procedure:'all', bucket:null };
let filtersPopoverOpen = false;
const filtersCollapsed = { status:true, stage:true, procedure:true };
const NEW_INQUIRY_MS = 30 * 60 * 1000;   // "New inquiry" = uncontacted + arrived within 30 min
/* Infinite scroll (v0.35): no pages. The list renders the first `shown` rows and
   grows by `pageSize` when you scroll near the bottom — a user reaches a specific
   patient via search/filters, not page numbers. */
let pageSize = 50;          // batch size per scroll-load (kept on __lms for tests)
let shown = pageSize;       // how many of the sorted/filtered rows are rendered
let realtimeOn = true;
let LEAD_INDEX = new Map();  // id → lead, for O(1) lookups in the 1s tick

/* ── column template (grid-template-columns) ── */
/* Track count MUST equal the number of grid children rowHtml emits:
   last-contacted · person(+status chip) · stage · interest · value · › */
const COLS = {
  coordinator: '96px 1.7fr 104px 1fr 92px 34px',
};

/* ── filtering + sorting (operates on full LEADS) ── */
function passesFilters(lead){
  const f = filters;
  if (f.status !== 'all' && leadStatus(lead).key !== f.status) return false;   // matches the status chip by the name
  if (f.stage !== 'all' && lead.stage !== f.stage) return false;               // matches the Stage column
  if (f.procedure !== 'all'){                                                  // a specific procedure OR a whole subfolder
    const ints = interestsOf(lead);
    if (f.procedure.startsWith('group:')){
      const g = PROCEDURE_GROUPS.find(x => x.key === f.procedure.slice(6));
      if (!g || !ints.some(p => g.items.includes(p))) return false;
    } else if (!ints.includes(f.procedure)) return false;
  }
  // context-line quick buckets (uncontacted / new inquiries / complications)
  if (f.bucket === 'uncontacted' && lead.status !== 'uncontacted') return false;
  if (f.bucket === 'new' && !(lead.status === 'uncontacted' && (clock() - lead.arrivedAt) < NEW_INQUIRY_MS)) return false;
  if (f.bucket === 'complications' && !lead.complication) return false;
  if (f.search){
    const q = f.search.toLowerCase();
    const hay = [lead.name, lead.phone, lead.email, lead.interest].map(x=>String(x||'').toLowerCase()).join(' ');
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortedFiltered(){
  const now = clock();
  // Always ordered by lead score (importance) with a diverse top — the founder
  // confirmed it's always priority, so the "Sort by" control was removed (v0.45).
  const sorted = LEADS.filter(passesFilters).sort((a,b)=>{
    const d = leadScore(b,now) - leadScore(a,now);
    return d || (a.arrivedAt - b.arrivedAt);       // stable tiebreak: longest-waiting first
  });
  return diversifyTop(sorted, now);
}
/* Founder ask: "at least 1 of each status should show on the top." A pure score
   sort clusters the loudest statuses (fresh inquiries + complications) and pushes
   quieter ones (silhouette, booked) far down. So after scoring, if any status the
   list contains is missing from the first screen, pull its highest-scoring member
   up into the header — the top then showcases one of every status, still led by
   the top-scored lead. A single-status filter has nothing to diversify → no-op. */
const DIVERSE_TOP_N = 12;
function diversifyTop(sorted, now){
  if (sorted.length < 8) return sorted;
  const key = l => leadStatus(l, now).key;
  const inTop = new Set(sorted.slice(0, DIVERSE_TOP_N).map(key));
  const allKeys = new Set(sorted.map(key));
  const missing = new Set([...allKeys].filter(k => !inTop.has(k)));
  if (!missing.size) return sorted;
  const promoted = [], rest = [];
  for (const l of sorted){                          // sorted is score-desc → first of a status is its champion
    const k = key(l);
    if (missing.has(k)){ promoted.push(l); missing.delete(k); }
    else rest.push(l);
  }
  const head = rest.slice(0, DIVERSE_TOP_N - promoted.length);   // keep rows[0] = top-scored lead
  return [...head, ...promoted, ...rest.slice(DIVERSE_TOP_N - promoted.length)];
}

/* ── render: the whole view ── */
function render(){
  document.body.dataset.role = role;   // always 'coordinator' in this fork — drives the --cols grid
  document.documentElement.style.setProperty('--cols', COLS[role]);
  renderContext();
  renderList();
  syncSelection();   // keep/establish the auto-selected lead in the detail pane
}

function renderContext(){
  const now = clock();
  const total = LEADS.length;
  const uncontacted = LEADS.filter(l => l.status==='uncontacted' && !l.firstOutboundAt).length;
  const needNow = LEADS.filter(l => urgencyTier(l,now)==='hot').length;
  const newInq = LEADS.filter(l => l.status==='uncontacted' && !l.firstOutboundAt && (now - l.arrivedAt) < NEW_INQUIRY_MS).length;
  const complications = LEADS.filter(l => l.complication).length;
  const fmtN = n => n.toLocaleString('en-US');
  // Open / New / Complications are clickable quick-filter toggles (underlined
  // when active). Copy: People · Open · New · Complications.
  const seg = (b, label, extra) => `<button class="cs-filter${extra||''}${filters.bucket===b?' active':''}" data-testid="cs-${b}" onclick="setBucket('${b}')">${label}</button>`;
  $('context-summary').innerHTML =
    `<span class="cs-strong">${fmtN(total)}</span> People` +
    `<span class="cs-sep">·</span>${seg('uncontacted', fmtN(uncontacted)+' Open')}` +
    `<span class="cs-sep">·</span>${seg('new', fmtN(newInq)+' New')}` +
    `<span class="cs-sep">·</span>${seg('complications', complications+' Complications', complications ? ' cs-alert' : '')}`;
  // pending dropdown mirrors the same source of truth
  $('pending-count').textContent = fmtN(uncontacted);
  $('pending-overdue').textContent = needNow;
  $('pending-dot').classList.toggle('has-pending', needNow > 0);
  updateFilterFunnel();
}

/* money-lens helpers (adopted from Johan's Journey OS): group heads price their
   queue and show how long the oldest has waited. Computed, never typed. */
const sumVal = a => a.reduce((s,l) => s + (l.value||0), 0);
const fmtK = v => v >= 1e6 ? '$' + (v/1e6).toFixed(1).replace(/\.0$/,'') + 'M'
             : v >= 1000 ? '$' + (v >= 100000 ? '' + Math.round(v/1000) : (v/1000).toFixed(1).replace(/\.0$/,'')) + 'k'
             : '$' + Math.round(v);
const waitOf = (l, now) => now - (l.lastTouchAt || l.firstOutboundAt || l.arrivedAt);

function renderList(){
  const rows = sortedFiltered();
  const totalRows = rows.length;
  const now = clock();

  // "Needs you now" (adopted from Johan's cockpit): the red statuses — fresh
  // inquiries waiting on a first reply + complications — sit under their own
  // sticky head with the money at stake; everyone else is the pipeline.
  const needsNow = rows.filter(l => { const k = leadStatus(l, now).kind; return k === 'new' || k === 'complication'; });
  const pipeline = rows.filter(l => { const k = leadStatus(l, now).kind; return k !== 'new' && k !== 'complication'; });
  const pipeShown = Math.max(0, shown - needsNow.length);
  const pipeSlice = pipeline.slice(0, pipeShown);

  const oldest = needsNow.length ? Math.max(...needsNow.map(l => waitOf(l, now))) : 0;
  const nnHint = needsNow.length
    ? `<b class="ghh-red">${fmtK(sumVal(needsNow))}</b> waiting · oldest ${esc(fmtShort(oldest))}`
    : '';
  const pipeHint = pipeline.length ? `${fmtK(sumVal(pipeline))} in play` : '';

  let h = '';
  if (totalRows === 0){
    h = `<div style="padding:40px;text-align:center;color:var(--g6)">No leads match these filters.</div>`;
  } else {
    h += `<div class="group-head gh-red" data-testid="group-needs-now">Needs you now <span class="gh-count">· ${needsNow.length}</span><span class="gh-hint">${nnHint}</span></div>`;
    h += needsNow.map(l => rowHtml(l, now)).join('') || `<div class="list-more">Nothing needs you. Enjoy it.</div>`;
    h += `<div class="group-head" data-testid="group-pipeline">Pipeline <span class="gh-count">· ${fmtNum(pipeline.length)}</span><span class="gh-hint">${pipeHint}</span></div>`;
    h += pipeSlice.map(l => rowHtml(l, now)).join('') || `<div class="list-more">No one else matches these filters.</div>`;
    if (pipeline.length > pipeSlice.length)
      h += `<div class="list-more" data-testid="list-more">Loading more as you scroll · ${fmtNum(needsNow.length + pipeSlice.length)} of ${fmtNum(totalRows)}</div>`;
  }
  $('leads-body').innerHTML = h;
  $('leads-body').querySelectorAll('.lead-row').forEach(r => {
    r.addEventListener('click', e => {
      if (e.target.closest('a,button,select')) return;
      selectLead(parseInt(r.dataset.leadId,10));
    });
  });
}
const fmtNum = n => n.toLocaleString('en-US');
/* infinite scroll: near the bottom → render another batch (scroll position is
   preserved because rows are only ever appended) */
function onListScroll(){
  const b = $('leads-body'); if (!b) return;
  if (b.scrollHeight - b.scrollTop - b.clientHeight > 300) return;
  if (shown >= sortedFiltered().length) return;
  shown += pageSize;
  renderList();
}
/* filters/search/sort/role changed → start the window over from the top */
function resetListWindow(){
  shown = pageSize;
  const b = $('leads-body'); if (b) b.scrollTop = 0;
}

/* The Status column content, by kind:
   • complication → red flag + "Complication" + a quiet time
   • new          → the prominent live ticking timer (seconds; pops per minute)
   • journey      → a quiet time + the patient's current milestone chip */
/* who sent the most recent message — drives the first column's us/them dot.
   'them' = they reached out last, the ball is in OUR court (red); 'us' = we
   reached out last, waiting on them (green). */
function lastContactBy(lead){
  return (lead.status === 'uncontacted' || lead.status === 'replied') ? 'them' : 'us';
}
/* First column (no title): time since last contact + a green(us)/red(them) dot.
   Just-arrived inbound (< 5 min) ticks live seconds; everyone else is quiet. */
function lastContactCell(l, now){
  const by = lastContactBy(l);
  // minute-level everywhere (founder: the seconds ticker was too much) — fresh
  // inbound (<5 min) keeps the red emphasis, but the clock reads "2m", not "2m 13s".
  const fresh = l.status === 'uncontacted' && (now - l.arrivedAt) < 5*MIN;
  const timeHtml = `<span class="lc-time${fresh ? ' live' : ''}" data-timer data-testid="lead-urgency-timer">${esc(fmtShort(now - (l.lastTouchAt || l.firstOutboundAt || l.arrivedAt)))}</span>`;
  const title = by === 'us' ? 'You messaged them last' : 'They messaged you last — awaiting your reply';
  return `<span class="lc-ico lc-${by}" title="${title}">${by === 'us' ? LC_ICON_US : LC_ICON_THEM}</span>${timeHtml}`;
}
function rowHtml(l, now){
  const tier = urgencyTier(l, now);

  // First column (no title): last-contacted time + us/them dot.
  const st = leadStatus(l, now);
  const statusKind = st.kind;
  const timerCell = lastContactCell(l, now);

  // Status now rides as a chip beside the name (like the defect chips below it).
  const statusChip = `<span class="lead-status-tag status-${st.key}" data-testid="lead-status-chip">${st.kind==='complication'?FLAG_ICON:''}${esc(st.label)}</span>`;

  // a colleague is on this lead → compact claim tag ("DL Dave L.") beside the status
  const claimTag = l.claimedBy
    ? `<span class="claim-tag" data-testid="claim-tag" title="${esc(l.claimedBy)} is currently working on this lead"><span class="claim-av">${esc(l.claimedBy.split(/\s+/).map(w=>w[0]).join('').toUpperCase())}</span>${esc(l.claimedBy.split(/\s+/)[0])} ${esc((l.claimedBy.split(/\s+/)[1]||'')[0]||'')}.</span>`
    : '';

  // v0.42: the phone/email sub-line is gone from the row — duplicative; the
  // number lives (clickable) in the detail pane on the right. Rows are one line.
  const ints = interestsOf(l);
  const interestCell = `<span class="lead-interest${ints.length?'':' blank'}" data-testid="lead-interest" title="${esc(ints.join(', '))}">${ints.length ? esc(ints[0]) + (ints.length>1?`<span class="int-more">+${ints.length-1}</span>`:'') : '—'}</span>`;

  // v0.43: the row's Suggested-action column is gone — the next action is implied
  // and shown prominently in the detail pane; it added noise to the list.

  // estimated deal size — the coordinator prioritises by it
  const valueCell = `<span class="lead-value${l.value?'':' none'}" data-testid="lead-value">${fmtMoney(l.value)}</span>`;

  // middle cells (Status + per-row Reply dropped — both repeated identically and
  // added no signal; the row click opens the reply pane)
  const stageCell = `<span class="lead-stage" data-testid="stage-cell">${stageChip(l)}</span>`;
  const midCells = stageCell + interestCell + valueCell;

  return `
  <div class="lead-row${l.id===selectedId?' selected':''}" data-lead-id="${l.id}" data-testid="lead-row" data-urgency="${tier}" data-status="${statusKind}" data-claimed="${l.claimedBy?'1':'0'}" data-critical="${l.complication?'1':'0'}" data-dirty="${l.defects.length?'1':'0'}">
    <span class="lead-gutter">${timerCell}</span>

      <span class="lead-av${l.nameQuality==='junk'?' dim':''}">${esc(initialsOf(l))}</span>
      <span class="lead-person-main">
        <span class="lead-name-row">
          <span class="lead-name${l.nameQuality!=='ok'?' dirty':''}" data-testid="lead-name">${esc(l.name||'Unknown')}</span>
          ${statusChip}${claimTag}
        </span>
      </span>
    </span>
    ${midCells}
    <span class="lead-end"><button class="lead-more" onclick="event.stopPropagation();selectLead(${l.id})" aria-label="Open conversation">›</button></span>
  </div>`;
}

/* ── realtime ── */
/* ── connection status ──
   The permanent green "Live" is gone. Healthy = show nothing. If the feed goes
   down: a red error state. When it recovers: "Live" shows for a moment, then
   dissolves away (opacity transition → cleared). */
let connState = 'ok';
let connFadeTimer = null;
function setConnState(s){
  connState = s;
  const el = $('realtime-toggle'); if (!el) return;
  clearTimeout(connFadeTimer);
  el.dataset.state = s;
  if (s === 'down'){
    el.innerHTML = '<span class="conn-dot down"></span>Connection lost — reconnecting…';
    el.classList.add('show');
  } else if (s === 'restored'){
    el.innerHTML = '<span class="conn-dot live"></span>Live';
    el.classList.add('show');
    // hold "Live" briefly, then dissolve
    connFadeTimer = setTimeout(() => {
      el.classList.remove('show');                       // opacity 1 → 0 (0.5s)
      connFadeTimer = setTimeout(() => { if (connState !== 'down'){ el.innerHTML = ''; el.dataset.state = 'ok'; connState = 'ok'; } }, 600);
    }, 2200);
  } else { // 'ok' — quiet
    el.classList.remove('show');
    el.innerHTML = '';
  }
}
/* Demo/testable blip: feed drops (arrivals pause), then recovers a few seconds
   later — exercising down → restored → dissolve. Never fires under a frozen clock. */
function simulateConnectionBlip(downMs){
  if (NOW_OVERRIDE != null) return;
  setConnState('down');
  realtimeOn = false; clearTimeout(arrivalTimer);
  setTimeout(() => { realtimeOn = true; scheduleArrival(); setConnState('restored'); }, downMs || 3500);
}
/* rare demo blips so the founder can SEE the error → recover → dissolve arc */
function scheduleConnDemo(){
  if (NOW_OVERRIDE != null) return;
  setTimeout(() => { simulateConnectionBlip(); scheduleConnDemo(); }, 45000 + Math.random()*240000);
}
let arrivalTimer = null, arrivalsSoFar = 0;
function scheduleArrival(){
  clearTimeout(arrivalTimer);
  if (!realtimeOn || NOW_OVERRIDE != null) return;
  // first arrival ~5s; opening burst 12–20s for the first ~2min; then back off ~45s
  let delay;
  if (arrivalsSoFar === 0) delay = 5000;
  else if (arrivalsSoFar < 8) delay = 12000 + Math.random()*8000;
  else delay = 40000 + Math.random()*15000;
  arrivalTimer = setTimeout(() => { spawnArrival(); arrivalsSoFar++; scheduleArrival(); }, delay);
}
function spawnArrival(){
  const rnd = Math.random;
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  const dirty = rnd() < 0.2;  // match the ~20% seed defect rate — quality shouldn't appear to decay live
  const first = pick(FIRST), last = pick(LAST);
  const lead = makeLead(mulberry32(Math.floor(rnd()*1e9)), {
    arrivedAt: Date.now(), status:'uncontacted', clean: !dirty,
    name: dirty && rnd()<0.5 ? '@'+first.toLowerCase()+Math.floor(rnd()*99) : `${first} ${last}`,
    nameQuality: dirty && rnd()<0.5 ? 'handle':'ok',
    source: pick(['instagram','facebook','website','katie','phone','referral']),
  });
  LEADS.unshift(lead);
  LEAD_INDEX.set(lead.id, lead);
  // The arrival toast (bottom-left) is the only notification — the old "N new
  // leads — show" pill is gone (it pushed the whole list down when it appeared).
  showToast(`New lead — ${lead.name} via ${(SOURCES[lead.source]||{}).label} · just now`, lead.id);
  const atTop = ($('leads-body') ? $('leads-body').scrollTop < 80 : true);
  if (atTop && passesFilters(lead)){
    // at the top of the list: slot the arrival in with a gentle flash
    renderList();
    const el = $('leads-body').querySelector(`.lead-row[data-lead-id="${lead.id}"]`);
    if (el){ el.style.animation = 'none'; el.style.background = 'var(--p2)'; setTimeout(()=>{ el.style.transition='background 2.5s ease'; el.style.background=''; }, 30); }
  }
  // scrolled down: don't touch the list (no jump) — the lead surfaces on the
  // next natural re-render (scroll-load, filter change, selection).
  renderContext();
}

let toastTimer2=null;

/* ── live timer tick ── */
let tickTimer = null;
function startTick(){ clearInterval(tickTimer); if (NOW_OVERRIDE != null) return; tickTimer = setInterval(tick, 1000); }
function tick(){
  const now = clock();
  // update only rendered rows' timers + tier (cheap: <= pageSize nodes).
  // O(1) id lookup via LEAD_INDEX so the per-second tick stays flat as the
  // dataset grows past 2,400 with realtime arrivals.
  $('leads-body').querySelectorAll('.lead-row').forEach(r => {
    const l = LEAD_INDEX.get(parseInt(r.dataset.leadId,10));
    if (!l) return;
    const tier = urgencyTier(l, now);
    if (r.dataset.urgency !== tier) r.dataset.urgency = tier;
    const timerEl = r.querySelector('[data-timer]');
    if (!timerEl) return;
    // minute-level everywhere — the text only changes when a minute rolls over
    timerEl.textContent = fmtShort(now - (l.lastTouchAt || l.firstOutboundAt || l.arrivedAt));
  });
  renderContext();
}

/* Reachable channels for the channel switcher in the composer. */
function reachableChannels(l){
  const out = [];
  if (l.source==='instagram') out.push('ig');
  if (l.source==='facebook')  out.push('fb');
  if (l.phone && l.phoneValid && l.smsConsent){ out.push('wa'); out.push('sms'); }
  if (l.email && l.emailStatus==='ok') out.push('em');
  if (l.phone && l.phoneValid) out.push('call');
  return [...new Set(out)];
}

/* reset the composer to the lead's suggested channel + a fresh draft */
function initComposer(l){
  detailMode = 'auto'; bookingOpen = false; bookingSlot = 0;
  const act = suggestedAction(l);
  // tasks / wait / disabled have no composer — the detail pane shows a task card or note
  if (act.kind === 'task' || act.kind === 'wait' || act.kind === 'disabled' || act.kind === 'dismiss'){
    composerChan = null; composerDraft = ''; regenCount = 0; return;
  }
  let want = act.channel || (act.kind === 'call' ? 'call' : (MESSAGE_CHANNELS.includes(act.kind) ? act.kind : 'em'));
  if (want !== 'call'){
    // never open the composer on an unreachable channel (e.g. a WhatsApp
    // preferred-channel for someone with no SMS consent) — clamp to a reachable one
    const reach = reachableChannels(l).filter(c => c !== 'call');
    if (!reach.includes(want)) want = (reach.includes(suggestedChannel(l)) ? suggestedChannel(l) : reach[0]) || 'call';
  }
  composerChan = want;
  regenCount = 0;
  composerDraft = composerChan === 'call' ? '' : genMessage(l, composerChan, regenCount);
}
function highlightSelected(){

/* subtle inbox hand-off (header link) — the in-pane scroll is the primary way to

/* most recent inbound message — what the person last said (drives the reply
   header + the "why this action" rationale) */
function lastInboundText(l){
  const all = fullThread(l);
  for (let i = all.length - 1; i >= 0; i--){ if (all[i].dir === 'in') return all[i].text; }
  return '';

/* one message → HTML. Patient/clinic are bubbles; logged calls + system touch-
   points are quiet centred lines. */
const THREAD_LOG_ICO = '<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.6" fill="currentColor"/></svg>';
function threadMsgHtml(x){
  if (x.dir === 'log') return `<div class="th-msg log"><span class="th-log"><span class="th-logico">${THREAD_LOG_ICO}</span>${esc(x.text)}</span></div>`;

/* render the last `shown` messages (oldest→newest); a top control loads more */
function threadBubbles(l, shown){
  const all = fullThread(l);
  const start = Math.max(0, all.length - shown);
  const top = start === 0 ? `<div class="th-start">Start of conversation</div>`
                          : `<button type="button" class="th-loadmore" onclick="loadEarlierThread()">Load earlier messages</button>`;
  return top + all.slice(start).map(threadMsgHtml).join('');
}
/* load an older page of messages (button or scroll-up), keeping the view anchored */
function loadEarlierThread(){
  const l = LEADS.find(x => x.id === selectedId); if (!l) return;
  const sc = document.getElementById('thread-scroll'); if (!sc) return;
  const all = fullThread(l);
  if (threadShown >= all.length) return;
  const prevH = sc.scrollHeight;
  threadShown = Math.min(all.length, threadShown + 5);   // load 5 more per scroll-up / click
  sc.innerHTML = threadBubbles(l, threadShown);
  sc.scrollTop = sc.scrollHeight - prevH;

/* the conversation thread — shows the most recent messages; older load by
   scrolling up or via the button (no "open full conversation" required) */
function threadHtml(l){

  const all = fullThread(l).concat((l.activity || []).map(a => ({ dir:'log', text:a.text })));
  if (!all.length) return '';
  if (threadLeadId !== l.id || !threadShown){ threadLeadId = l.id; threadShown = Math.min(all.length, 5); }
  // header channel = the channel the conversation is actually on (matches the
  // composer pill), not the abstract preferredChannel

  return `<div class="thread" data-testid="thread">

/* after the detail pane renders, pin the thread to the newest message and lazy-

/* prototype side-effect of acting on a task: confirm + advance the journey one
   step, then re-render the same lead so the NEXT step surfaces. */
function completeTask(task){
  const l = LEADS.find(x => x.id === selectedId); if (!l) return;
  const f = firstName(l);
  const chan = CHANNEL_LABEL[l.preferredChannel] || 'message';
  l.setup = l.setup || {};
  if (task === 'consult'){ l.setup.consultBooked = true; showToast(`Appointment booked for ${f} · invite sent`); logActivity(l, 'Appointment booked'); }
  else if (task === 'forms'){ l.setup.declarationSent = true; showToast(`Health declaration sent to ${f} via ${chan}`); logActivity(l, `Health declaration sent via ${chan}`); }
  else if (task === 'consents'){ l.setup.consentsSigned = true; showToast(`Consent forms sent to ${f} via ${chan}`); logActivity(l, `Consent forms sent via ${chan}`); }
  else if (task === 'silhouette'){ l.setup.silhouetteShared = true; showToast(`Silhouette simulation shared with ${f}`); logActivity(l, 'Silhouette simulation shared'); }
  if (l.status === 'uncontacted'){ l.status = 'in_progress'; if (!l.firstOutboundAt) l.firstOutboundAt = clock(); }
  l.lastTouchAt = clock();
  renderList(); renderContext();
  initComposer(l); renderDetail(l);   // stay on this lead; surface the next step
}

/* switch the detail action zone: 'message' opens the composer on a reachable

function setDetailMode(m){
  const l = LEADS.find(x => x.id === selectedId); if (!l) return;
  bookingOpen = (m === 'book');
  if (m === 'call'){ composerChan = 'call'; }
  else if (m === 'message'){
    const reach = reachableChannels(l).filter(c => c !== 'call');
    let ch = reach.includes(suggestedChannel(l)) ? suggestedChannel(l) : reach[0];
    if (!ch || ch === 'call') ch = reach[0] || 'em';
    composerChan = ch; regenCount = 0; composerDraft = genMessage(l, ch, 0);
  }
  detailMode = (m === 'book') ? 'auto' : m;   // booking is a sub-mode; cancel returns to the suggested step
  renderDetail(l);
}

function quickBarHtml(l, primaryKind){

/* three near-future appointment slots to offer, deterministic per lead + clock */
function apptSlots(l){
  const base = clock(), dayMs = 24*HR, h = threadHash(l.id);
  const mk = (addDays, hour, min) => { const d = new Date(base + addDays*dayMs); d.setHours(hour, min, 0, 0); return { ts:d.getTime(), label: fmtSlot(d) }; };
  return [ mk(2 + (h % 2), 10, 0), mk(4 + (h % 3), 14, 30), mk(7, 9, 0) ];
}
function fmtSlot(d){
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let h=d.getHours(), m=d.getMinutes(), ap=h<12?'am':'pm', hr=h%12||12;
  return `${days[d.getDay()]} ${d.getDate()} ${mon[d.getMonth()]}, ${hr}${m?':'+String(m).padStart(2,'0'):''}${ap}`;
}
function bookingCardHtml(l){
  const slots = apptSlots(l);
  const chips = slots.map((s,i)=>`<button class="slot-chip${i===bookingSlot?' sel':''}" data-testid="slot-${i}" onclick="pickSlot(${i})">${esc(s.label)}</button>`).join('');
  return `<div class="task-card booking" data-testid="booking-card">
    <span class="tc-ico">${TASK_ICON.consult}</span>
    <div class="tc-body">
      <div class="tc-title">Book ${esc(firstName(l))}’s appointment</div>
      <div class="tc-desc">Pick a time to offer — we’ll send the invite and move ${esc(firstName(l))} to “Appointment booked”.</div>
      <div class="slot-row" data-testid="slot-row">${chips}</div>
      <div class="tc-actions">
        <button class="sa-btn" data-testid="booking-confirm" onclick="confirmBooking()">Confirm booking</button>
        <button class="sa-btn ghost" data-testid="booking-cancel" onclick="cancelBooking()">Cancel</button>
      </div>
    </div>
  </div>`;
}
function pickSlot(i){ bookingSlot = i; const l = LEADS.find(x=>x.id===selectedId); if (l) renderDetail(l); }
function cancelBooking(){ bookingOpen = false; const l = LEADS.find(x=>x.id===selectedId); if (l) renderDetail(l); }
function confirmBooking(){
  const l = LEADS.find(x=>x.id===selectedId); if (!l) return;
  const slot = apptSlots(l)[bookingSlot] || apptSlots(l)[0];
  l.setup = l.setup || {}; l.setup.consultBooked = true; l.apptLabel = slot.label;
  if (l.status === 'uncontacted'){ l.status = 'in_progress'; if (!l.firstOutboundAt) l.firstOutboundAt = clock(); }
  l.lastTouchAt = clock();
  logActivity(l, `Appointment booked — ${slot.label}`);
  showToast(`Appointment booked for ${firstName(l)} · ${slot.label}`);
  renderList(); renderContext();
  initComposer(l); renderDetail(l);   // status advances to "Appointment booked"; next step surfaces
}

/* ── Editable Lead details (v0.48) ──
   Every data field under "Lead details" is inline-editable, and required fields
   that are empty are highlighted as MISSING — leads arrive incomplete, so the
   proto surfaces the gaps and lets you fill them. Status / Stage / the wait
   timer stay read-only (system-derived, per the reliability principle). */
const PENCIL = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11 2.5l2.5 2.5-8 8H3v-2.5l8-8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';
function computeValue(l){ return interestsOf(l).reduce((s,p) => s + (PROCEDURE_VALUE[p] || 0), 0); }

/* ── field validation (pc-0.3) ───────────────────────────────────────────────
   A lead detail can't be saved with a malformed value — saveField runs these and
   keeps the editor open with an inline reason. Phone is a proper international
   input: a flag + dial-code country picker, national-number length enforced per
   country. Email needs a real domain + dot-suffix; value must be a sane number. */
const TEL_COUNTRIES = [
  { iso:'US', name:'United States',        dial:'1',   flag:'🇺🇸', len:10, group:[3,3,4],     ex:'2015550123' },
  { iso:'GB', name:'United Kingdom',       dial:'44',  flag:'🇬🇧', len:10, group:[4,6],       ex:'7400123456' },
  { iso:'IE', name:'Ireland',              dial:'353', flag:'🇮🇪', len:9,  group:[2,3,4],     ex:'851234567'  },
  { iso:'CA', name:'Canada',               dial:'1',   flag:'🇨🇦', len:10, group:[3,3,4],     ex:'5062345678' },
  { iso:'AU', name:'Australia',            dial:'61',  flag:'🇦🇺', len:9,  group:[3,3,3],     ex:'412345678'  },
  { iso:'AE', name:'United Arab Emirates', dial:'971', flag:'🇦🇪', len:9,  group:[2,3,4],     ex:'501234567'  },
  { iso:'FR', name:'France',               dial:'33',  flag:'🇫🇷', len:9,  group:[1,2,2,2,2], ex:'612345678'  },
  { iso:'DE', name:'Germany',              dial:'49',  flag:'🇩🇪', len:10, group:[3,3,4],     ex:'1512345678' },
  { iso:'ES', name:'Spain',                dial:'34',  flag:'🇪🇸', len:9,  group:[3,3,3],     ex:'612345678'  },
  { iso:'NL', name:'Netherlands',          dial:'31',  flag:'🇳🇱', len:9,  group:[1,4,4],     ex:'612345678'  },
];
const TEL_DEFAULT = 'US';   // Belcara is US-based
function telCountry(iso){ return TEL_COUNTRIES.find(c => c.iso === iso) || TEL_COUNTRIES.find(c => c.iso === TEL_DEFAULT); }
/* parse a stored "+1 410 555 1234" → { iso, national(digits only) } */
function telParse(raw){
  const digits = String(raw || '').replace(/\D/g, '');
  if (!digits) return { iso:TEL_DEFAULT, national:'' };
  let best = null;
  for (const c of TEL_COUNTRIES) if (digits.startsWith(c.dial) && (!best || c.dial.length > best.dial.length)) best = c;
  if (!best) return { iso:TEL_DEFAULT, national:digits };   // no code stored → treat all as national
  return { iso:best.iso, national:digits.slice(best.dial.length) };
}
/* space-group national digits per the country's pattern (e.g. 7400 123456) */
function telGroup(national, iso){
  const d = String(national || '').replace(/\D/g, ''), c = telCountry(iso), out = [];
  let i = 0;
  for (const n of c.group){ if (i >= d.length) break; out.push(d.slice(i, i + n)); i += n; }
  if (i < d.length) out.push(d.slice(i));
  return out.join(' ');
}
function telDisplay(raw){ const { iso, national } = telParse(raw); return '+' + telCountry(iso).dial + ' ' + telGroup(national, iso); }
function telFlag(raw){ return telCountry(telParse(raw).iso).flag; }
/* validate a national number for a country */
function telValidate(iso, national){
  const c = telCountry(iso), d = String(national || '').replace(/\D/g, '');
  if (!d) return { ok:false, msg:'Add a phone number' };
  if (d.length < c.len) return { ok:false, msg:`Too short — ${c.name} numbers are ${c.len} digits` };
  if (d.length > c.len) return { ok:false, msg:`Too long — ${c.name} numbers are ${c.len} digits` };
  return { ok:true };
}
/* email: local@domain.tld — a real dot-suffix (.com, .co.uk…), no spaces */
function validateEmail(v){
  v = String(v || '').trim();
  if (!v) return { ok:false, msg:'Add an email address' };
  if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v)) return { ok:false, msg:'Enter a valid email, e.g. name@clinic.com' };
  return { ok:true, clean:v };
}
/* est. value: optional, but if set must be a non-negative whole number, capped */
function validateValue(v){
  const s = String(v == null ? '' : v).trim();
  if (s === '') return { ok:true, clean:0 };
  const n = Number(s.replace(/[$,\s]/g, ''));   // tolerate $ and thousands separators; keep the sign
  if (!isFinite(n))  return { ok:false, msg:'Enter a number' };
  if (n < 0)         return { ok:false, msg:'Enter a positive amount' };
  if (n > 1000000)   return { ok:false, msg:'That looks too high — cap is $1,000,000' };
  return { ok:true, clean:Math.round(n) };
}

const LEAD_FIELDS = [
  { key:'source',    label:'Source',      type:'select', required:true,
    opts:() => Object.keys(SOURCES).map(k => ({ v:k, label:SOURCES[k].label })),
    get:l => l.source, set:(l,v) => { l.source = v; },

  { key:'procedure', label:'Procedure',   type:'select', required:true,

    get:l => l.interest || '', set:(l,v) => { l.interest = v; l.interests = v ? [v] : []; l.value = computeValue(l); },
    display:l => interestsOf(l).join(', ') || '—', missing:l => interestsOf(l).length === 0 },
  { key:'value',     label:'Est. value',  type:'money', required:false, validate:validateValue,
    get:l => l.value || 0, set:(l,v) => { l.value = Math.max(0, Math.round(+v || 0)); },
    display:l => fmtMoney(l.value), missing:l => !l.value },
  { key:'phone',     label:'Phone',       type:'tel', required:true,
    get:l => l.phone || '', set:(l,v) => { v = v.trim(); l.phone = v || null; l.phoneValid = !!v; },
    display:l => l.phone || '', missing:l => !l.phone || !l.phoneValid },
  { key:'email',     label:'Email',       type:'email', required:true, validate:validateEmail,
    get:l => l.email || '', set:(l,v) => { v = v.trim(); l.email = v || null; l.emailStatus = v ? 'ok' : 'missing'; },
    display:l => l.email ? esc(l.email) + (l.emailStatus === 'bounced' ? ' <span class="kv-flag">bounced</span>' : '') : '',
    displayRaw:true, missing:l => !l.email },

];
let editField = null;    // key of the field currently in edit mode, or null
let telDraftIso = TEL_DEFAULT;   // country selected in the open phone editor
function reconcileDefects(l){
  const managed = ['phone_missing','phone_partial','email_missing','email_bounced','interest_blank','source_unknown','no_consent'];
  const keep = (l.defects || []).filter(d => !managed.includes(d));
  const add = [];
  if (!l.phone) add.push('phone_missing'); else if (!l.phoneValid) add.push('phone_partial');
  if (!l.email) add.push('email_missing'); else if (l.emailStatus === 'bounced') add.push('email_bounced');
  if (interestsOf(l).length === 0) add.push('interest_blank');
  if (l.source === 'unknown') add.push('source_unknown');
  if (!l.smsConsent) add.push('no_consent');
  l.defects = keep.concat(add);
}
function missingCount(l){ return LEAD_FIELDS.filter(f => f.required && f.missing(l)).length; }
function fieldEditorHtml(l, f){

/* international phone editor: flag + dial-code picker + national-number input */
function telEditorHtml(l){

    </span>

function telToggleMenu(e){ if (e) e.stopPropagation(); const m = $('tel-menu'); if (m) m.hidden = !m.hidden; }
function telPick(iso){
  telDraftIso = iso;
  const c = telCountry(iso);

  const dial = $('tel-dial'); if (dial) dial.textContent = '+' + c.dial;

    inp.setAttribute('placeholder', telGroup(c.ex, iso));

/* live validation as you type: reformat phone, show/hide the inline reason */
function onFieldInput(){
  const f = LEAD_FIELDS.find(x => x.key === editField); if (!f) return;
  const inp = $('kv-input'); if (!inp) return;

    const c = telCountry(telDraftIso);

function setFieldError(msg){

}
function fieldRowHtml(l, f){

function startEditField(key){

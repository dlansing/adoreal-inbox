function cancelEditField(){ editField = null; const l = LEADS.find(x => x.id === selectedId); if (l) renderDetail(l); }
function saveField(key){
  const l = LEADS.find(x => x.id === selectedId); if (!l) return;
  const f = LEAD_FIELDS.find(x => x.key === key), inp = $('kv-input'); if (!f || !inp) return;

  if (f.type === 'tel'){
    const res = telValidate(telDraftIso, inp.value);
    if (!res.ok){ setFieldError(res.msg); inp.focus(); return; }   // blocked — keep editing
    const c = telCountry(telDraftIso);
    f.set(l, '+' + c.dial + ' ' + telGroup(inp.value, telDraftIso));
    l.phoneValid = true;
  } else if (f.validate){
    const res = f.validate(inp.value);
    if (!res.ok){ setFieldError(res.msg); inp.focus(); return; }   // blocked — keep editing
    f.set(l, res.clean != null ? res.clean : inp.value);
  } else {
    f.set(l, inp.value);
  }

  reconcileDefects(l); editField = null;
  showToast(`${f.label} updated for ${firstName(l)}`);
  renderList(); renderContext(); renderDetail(l);
}
function toggleField(key){
  const l = LEADS.find(x => x.id === selectedId); if (!l) return;
  const f = LEAD_FIELDS.find(x => x.key === key); if (!f || f.type !== 'toggle') return;
  f.set(l, !f.get(l)); reconcileDefects(l);
  showToast(`${f.label} updated for ${firstName(l)}`);
  renderList(); renderContext(); renderDetail(l);
}

function renderDetail(l){
  const src = SOURCES[l.source] || SOURCES.unknown;
  const tier = urgencyTier(l);
  const tm = fmtTimer(l);
  $('d-av').textContent = initialsOf(l);
  $('d-name').textContent = l.name || 'Unknown';
  $('d-sub').textContent = `${leadStatus(l).label} · ${tm.text} · ${src.label}`;
  // Patient 360 link — stage-gated. A Discover lead is still an inquiry (no
  // patient record yet); once they're beyond Discover they're a patient, and
  // this swaps you out to their full record in Adoreal. Wired for real later.
  $('d-360').innerHTML = isPatient(l)
    ? `<a class="d-360-btn" href="${patient360Url(l)}" target="_blank" rel="noopener" data-testid="view-details" title="Opens the full patient record · my.adoreal.com/patients/${patientNo(l)}">View details <span class="d-360-arrow">↗</span></a>`
    : '';
  // Patient ID — same gate, the real app's format (PAT 650323), same number
  // the 360 URL carries.
  const pid = $('d-patid');
  if (isPatient(l)){ pid.style.display = ''; pid.innerHTML = `<span class="patid-chip" data-testid="detail-patid">${esc(patientIdLabel(l))}</span>`; }
  else { pid.style.display = 'none'; pid.innerHTML = ''; }
  const defs = defectsOf(l);
  let body = '';

  if (l.claimedBy){
    // a colleague is on this lead — gate the action zone behind a clear notice
    // ("<name> is currently working on this lead") with the option to continue.
    body += claimGateHtml(l);
  } else {
    const act = suggestedAction(l);
    const replyVerb = l.status === 'uncontacted' ? ((l.threadLen || 0) > 3 ? 'Send reply' : 'Send') : 'Send reply';
    // AI summary — messy middle only (between Discover and Long-term), where the
    // extra context earns its place. Timestamped; Generate appears when >1 day old.
    if (inMessyMiddle(l)){
      const age = Math.max(0, clock() - summaryAt(l));
      const stale = age > DAY;
      body += `<div class="ai-sum" data-testid="ai-summary">
        <div class="ai-sum-head">
          <span class="ai-sum-title">AI summary</span>
          <span class="ai-sum-time" data-testid="ai-summary-time">${l.summaryGenAt ? 'updated ' : ''}${esc(fmtShort(age))} ago</span>
          ${stale ? `<button class="ai-sum-gen" data-testid="ai-summary-generate" onclick="genSummary()">Generate</button>` : ''}
        </div>
        <div class="ai-sum-text">${esc(aiSummary(l))}</div>
      </div>`;
    }
    body += threadHtml(l);
    // PRIMARY action card. 'auto' shows the suggested next step for this status;
    // the quick actions below let you switch to book / call / message. Beyond
    // sending a message you can complete the real journey task, log a call, or
    // clear a complication — whatever this person's status actually needs.
    let primaryKind = 'other';
    if (bookingOpen){ body += bookingCardHtml(l); primaryKind = 'book'; }
    else if (detailMode === 'call' || (detailMode === 'auto' && act.kind === 'call')){ body += callCardHtml(l); primaryKind = 'call'; }
    else if (detailMode === 'message'){ body += composerHtml(l, replyVerb); primaryKind = 'message'; }
    else if (detailMode === 'auto' && act.kind === 'critical'){ body += criticalCardHtml(l); primaryKind = 'critical'; }
    else if (detailMode === 'auto' && act.kind === 'task'){ body += taskCardHtml(l, act); primaryKind = act.task === 'consult' ? 'book' : 'task'; }
    else if (composerChan && composerChan !== 'call'){ body += composerHtml(l, replyVerb); primaryKind = 'message'; }
    else if (composerChan === 'call'){ body += callCardHtml(l); primaryKind = 'call'; }
    else { body += `<div class="detail-sent">${esc(act.label)}</div>`; primaryKind = 'other'; }
    // the critical card is self-contained (call / message / resolve); everything
    // else gets the contextual "Or …" quick-action bar.
    if (primaryKind !== 'critical') body += quickBarHtml(l, primaryKind);
  }

  // shared: key facts — Status leads (same value the column + filter use), then
  // the time (relabelled so "Waiting" no longer collides with the Status idea).
  const dst = leadStatus(l);
  // Lead details — Status / Stage / wait timer are system-derived (read-only);
  // everything below is inline-editable, with missing required fields flagged.
  const missN = missingCount(l);
  body += `<div class="sec-title ld-head">Lead details${missN ? `<span class="ld-missing" data-testid="ld-missing">${missN} missing</span>` : ''}</div><div class="kv" data-testid="lead-fields">
    <span class="kv-k">Status</span><span class="kv-v"><span class="lead-status-tag status-${dst.key}" data-testid="detail-status">${dst.kind==='complication'?FLAG_ICON:''}${esc(dst.label)}</span></span>
    <span class="kv-k">${tm.contacted ? 'Last contact' : 'Awaiting reply'}</span><span class="kv-v">${esc(tm.text)}</span>
    <span class="kv-k">Stage</span><span class="kv-v">${stageChip(l)}</span>
    ${LEAD_FIELDS.map(f => fieldRowHtml(l, f)).join('')}
  </div>`;

  // shared: data quality
  body += `<div class="sec-title">Data quality</div><div class="dq-list" data-testid="dq-list">`;
  body += defs.length ? defs.map(d => `<div class="dq-item"><span class="dq-dot"></span>${esc(d.label)}</div>`).join('')
                      : `<div class="dq-item clean">No issues detected on this lead.</div>`;
  body += `</div>`;


  $('detail-body').innerHTML = body;
  wireThreadScroll(l);   // pin thread to newest + enable scroll-up lazy load
}

function setComposerChan(ch){
  const l = LEADS.find(x => x.id === selectedId); if (!l) return;
  composerChan = ch;
  regenCount = 0;
  composerDraft = ch === 'call' ? '' : genMessage(l, ch, regenCount);
  renderDetail(l);
}
function regenMessage(){
  const l = LEADS.find(x => x.id === selectedId); if (!l) return;
  regenCount++;
  composerDraft = genMessage(l, composerChan, regenCount);
  const ta = $('composer-text'); if (ta) ta.value = composerDraft;
}
function sendGenerated(){
  const l = LEADS.find(x => x.id === selectedId); if (!l) return;
  const label = CHANNEL_LABEL[composerChan] || 'message';
  const first = firstName(l);
  const wasUncontacted = l.status === 'uncontacted';
  // simulate the send: the lead is now in conversation and drops out of "hot"
  l.status = 'in_progress'; if (!l.firstOutboundAt) l.firstOutboundAt = clock(); l.lastTouchAt = clock();
  showToast(`${wasUncontacted ? 'Sent' : 'Reply sent'} via ${label} to ${first} · in conversation`);
  renderList(); renderContext();
  if (window.innerWidth < 1024){ closeDetail(); selectedId = null; return; }
  // desktop: advance to the next lead that still needs a human — the speed loop
  const rows = sortedFiltered();
  const next = rows.find(x => x.status === 'uncontacted') || rows[0];
  if (next) selectLead(next.id); else { selectedId = null; renderDetailEmpty(); }
}

/* ── pending dropdown / version / nav stubs (chrome) ── */
function togglePendingMenu(e){ e&&e.stopPropagation(); const m=$('pending-menu'),b=$('pending-btn'); const o=m.classList.toggle('open'); b.setAttribute('aria-expanded',o?'true':'false'); }
function closePendingMenu(){ $('pending-menu').classList.remove('open'); $('pending-btn').setAttribute('aria-expanded','false'); }
document.addEventListener('click', e => { const m=$('pending-menu'); if(m&&m.classList.contains('open')&&!e.target.closest('.pending-anchor')) closePendingMenu(); });
let toastTimer=null;
function showVersion(){ $('version-toast-num').textContent='v'+VERSION; $('version-toast').classList.add('visible'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('version-toast').classList.remove('visible'),2400); }
function stubNav(name){ alert(`${name} — lives in the broader Adoreal product. Stubbed in the LMS prototype.`); }

/* ── boot ── */
LEADS = buildSeed();
LEAD_INDEX = new Map(LEADS.map(l => [l.id, l]));
document.addEventListener('DOMContentLoaded', () => {
  $('version-toast-num').textContent = 'v'+VERSION;
  render();
  $('leads-body').addEventListener('scroll', onListScroll);   // infinite scroll: load 50 more near the bottom
  startTick();
  scheduleArrival();
  scheduleConnDemo();   // occasional connection blips: error state → "Live" flash → dissolve
  document.addEventListener('keydown', e => { if (e.key==='Escape'){ closeDetail(); closePendingMenu(); closeFiltersPopover(); closeCallModal(); } });
});

/* ── test surface ── */
window.__lms = {
  VERSION,
  SOURCES, PROCEDURES, STAGES, DEFECTS,
  urgencyTier, suggestedAction, suggestedChannel, nextPatientTask, patientStatus, leadStatus, leadScore, lastContactBy, isPatient, patient360Url, patientIdLabel, inMessyMiddle, aiSummary, missingCount, LEAD_FIELDS, reconcileDefects, buildThread, genMessage, defectsOf, fmtTimer,
  TEL_COUNTRIES, telParse, telValidate, telDisplay, telFlag, validateEmail, validateValue,
  PROCEDURE_GROUPS, setConnState, simulateConnectionBlip,
  get role(){ return role; },   // role is locked to 'coordinator' in this fork — no setter
  get leads(){ return LEADS; },
  get selectedId(){ return selectedId; }, selectLead, sendGenerated, setComposerChan,
  get pageSize(){ return pageSize; }, get shown(){ return shown; },
  sortedFiltered,
  /* freeze the clock + stop intervals + arrivals for deterministic tests */
  freezeForTest(fixedNow){
    NOW_OVERRIDE = fixedNow != null ? fixedNow : BOOT;
    realtimeOn = false; clearTimeout(arrivalTimer); clearInterval(tickTimer);
    setConnState('ok');   // indicator is quiet when healthy (and in frozen tests)
    render();
  },
  spawnArrival,   // tests can trigger a deterministic-ish arrival
  tick,                          // run one realtime tick against the current rows
  get now(){ return clock(); },  // current (frozen) clock value
  setNow(t){ NOW_OVERRIDE = t; },// advance the (frozen) clock WITHOUT re-rendering rows — for pop tests
};
</script>

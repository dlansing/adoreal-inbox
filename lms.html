<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  adoreal. — Lead Management System (LMS) prototype  ·  v0.20 (2026-06-25)

  v0.20 — Detail-pane conversation + channel selector + procedure filter:
    • Conversation is scroll-to-load: shows the most recent messages and pages in
      OLDER ones on scroll-up (or a "Load earlier messages" button). Dropped the
      prominent "Open full conversation" button — the in-pane scroll is the way;
      a subtle "Open in inbox ↗" stays in the thread header.
    • WHY this action: every recommendation is grounded in the person's most
      recent message — the reply composer shows "Replying to <name>: <last msg>",
      and the task card shows the quoted last message + a one-line rationale.
    • Channel selector copied from inbox.html: the "Sending via X" label is gone;
      it's now a pill + caret you click to pick the transport (chan-selector /
      compose-chan / chan-dropdown). The composer channel is always a REACHABLE
      one (a no-consent WhatsApp preference clamps to email/DM).
    • New PROCEDURE filter (multi-interest aware) alongside urgency/status/source.

  v0.19 — Stage-chip consistency with the canonical 7-stage table:
    • Stage chips now match the canonical table EXACTLY (background + text) and
      are byte-identical to inbox.html — dropped the extra same-hue border so
      there's no styling beyond the spec (Discover→Long-term; all pairs AA).
    • Used the stage MEANINGS to fix two data inconsistencies: (1) an uncontacted
      person is always Discover ("first interest, before consultation") and a
      late-stage chip (Pre-op→Long-term) never appears on a hot uncontacted row
      — Charlotte (Recover) is now a contacted, established patient, not a 2-min
      hot lead; (2) nextPatientTask() no longer offers "Book consultation" /
      "Send health declaration" to Pre-op-onward people (that's behind them).

  v0.18 — Scrollable thread + multiple interests (founder feedback on v0.17):
    • The conversation is now the CENTREPIECE of the detail pane: a tall,
      scrollable history (oldest→newest) that LAZY-LOADS older messages as the
      coordinator scrolls up — so they can read the whole exchange inline and
      rarely need to open the inbox. The thread mixes patient/clinic messages
      with logged calls + system touch-points ("Called — no answer, left
      voicemail", "Day-3 nudge sent"), like the live thread. (fullThread() +
      wireThreadScroll(); "Open full conversation →" is now a convenience.)
    • People can enquire about MULTIPLE procedures — ~18% now carry 2–3 interests
      (e.g. tummy tuck + breast augmentation). The Interest column shows the
      primary + a "+N" badge; the detail pane lists them all. (interests[] /
      interestsOf(); interest stays the primary for filters + copy.)
    • Honouring "users don't move leads → the data goes stale": stage stays
      system-derived (never a manual drag).
    • Leaner list: dropped the Status column ("Uncontacted" on every visible row)
      and the per-row Reply link (identical on every row; the row click already
      opens the reply pane). Columns are now Waiting · Person · Stage · Interest ·
      Value · Suggested action · ›.
    • Per-lead ESTIMATED VALUE (£, summed across the person's procedures) in the
      list + detail, so high-value enquiries stand out. (PROCEDURE_VALUE.)
    • Pain-points dimension pending — David is sending Johan's 13.

  v0.17 — Thread context + patient-journey tasks (founder feedback on v0.16):
    • The detail pane now shows the **recent conversation** (the last ~4–6
      messages) for anyone already engaged, so you have context before acting —
      then the prominent "Open full conversation →" hands off to the unified
      inbox for the full thread. (buildThread() synthesises a preview whose
      ending lines up with the recommended next step.)
    • Recommended next actions are no longer only message/call. Engaged people
      now surface **patient-journey TASKS** matched to where they are: **Book
      consultation**, **Send health declaration**, **Share Silhouette
      simulation** (nextPatientTask()). They render as a task card with a 1-click
      action that advances the journey one step; the row shows a quiet task hint.
    • Uncontacted people are unchanged: speed-to-lead, messaging-first composer.

  v0.16 — Column tuning on the leads list (founder feedback on v0.15):
    • Kept Waiting + urgency. The urgency timer now "pops" (flashes darker red
      + a quick scale for ~1s) each time a hot/cooling lead's displayed minute
      ticks over, so the eye catches the clock moving in realtime.
    • Dropped the "Person" column label (the column stays; the header word went).
    • Removed Source from the list — it now lives only in the detail pane on the
      right ("it shows on the right which is enough").
    • Replaced Source with STAGE, rendered with the exact inbox stage chips
      (Discover→Long-term, same colours as inbox.html). Lead stages now use the
      same 7-stage vocabulary as the inbox; the 9 featured leads carry the stage
      their inbox thread shows.

  v0.15 — Master/detail + 1-click messaging (founder feedback on v0.14):
    • Two-pane layout: list (left, top ~6 above the fold) + a detail pane
      (right) that's ALWAYS visible on desktop. The top/most-urgent lead is
      AUTO-SELECTED on landing and clearly highlighted; clicking any row
      re-selects. On mobile the pane is a slide-over sheet.
    • The detail pane carries a 1-CLICK COMPOSER: a generated, editable
      message in the smart channel for that lead, a channel switcher, and a
      prominent Send. Sending marks the lead in-conversation, toasts, and (on
      desktop) auto-advances to the next lead who needs a human — a fast
      speed-to-lead loop.
    • Messaging-first suggestions. suggestedChannel() picks the channel by
      SOURCE (Instagram→IG, web→email, phone→call…), so most leads now get a
      message suggestion, not "Call now". Calls are the minority. SMS/WhatsApp
      stay consent-gated (Belcara P0); IG/FB DMs don't need SMS consent.
    • Row action is now a QUIET hint (channel name + icon), not a black button
      on every line — the prominent action lives in the detail pane only.

  v0.14 — TRANSFORMATIONAL PIVOT (founder feedback). Full rewrite.

  The founder killed the multi-view LMS: "altogether too much going on...
  pipeline, analytics, engine — it's bullshit. a powerpoint, not a useful
  tool. let's focus on one view." v0.14 is ONE focused surface:

    A live speed-to-lead leads list. Thousands of people-before-patients,
    paginated, with the longest-waiting actionable lead loud at the top and
    a clock ticking on every uncontacted row. New leads stream in while you
    watch. Dirty data is shown honestly. Three roles read more/less detail
    off the SAME rows.

  Designed via a 4-lens design panel (urgency / dirty-data / roles / focus)
  + synthesis. Blueprint stored in the workflow transcript.

  KILLED: left rail + 5 views (Overview/Tasks/Pipeline/Engine/Analytics),
  kanban, analytics mockups, KPI deck, today-strip.
  KEPT verbatim: top bar, mobile product-nav, pending-tasks dropdown,
  version-gear toast, inbox.html handoff (?patient=&chan=/&action=log-call).

  CORE MECHANICS
    • Urgency tiers from (now − arrivedAt), uncontacted only:
        Hot 0–5m (--red, ticks m+s) · Cooling 5–60m (--yellow) ·
        Slow 1–24h (--p5) · Stale >24h (--g6, muted) · Contacted (--green, calm)
      Full-saturation colour touches ONLY the 4px gutter edge + timer chip.
    • Sort = most urgent first (tier rank, then longest-waiting within tier).
      Deliberate deviation from the panel's "longest waiting" label: a 3-day
      stale lead is re-engagement, not speed-to-lead. Hottest = row 1.
    • ~2,400 seeded leads (deterministic via mulberry32) + realtime arrivals.
      Only the current page (50/row default) is in the DOM — performance.
    • ~20% dirty data: missing/handle names, partial phones, bounced/missing
      email, dupes, no-SMS-consent (Belcara P0), vague interest, unknown
      source, spam. Shown as quiet --g6 signals; red is reserved for urgency.
    • suggestedAction(lead, role) is a pure function that degrades on dirty
      data (no phone → no "Call now"; no consent → never SMS) and switches
      verbs by role.

  ROLES (JS switch, single file, no routing; preserves scroll/filter/page;
  persisted to localStorage):
    • Patient Coordinator (default, protected, lean) — speed-to-lead cockpit.
    • Onboarding Specialist — +Stage +Setup cells, conversion verbs.
    • Adoreal Support — +Engine cell, delivery log + template-safety flags
      in the drawer ("what went wrong"); read-only.

  REALTIME + TESTS
    • Two intervals: 1s timer tick (updates visible chips only) + jittered
      arrival loop (first ~5s, opening burst, then backs off).
    • window.__lms.freezeForTest() pins the clock + stops both intervals so
      Playwright visual baselines are deterministic. Pure functions exposed
      for unit tests.

  Three version-string locations — bump all three each iteration:
    1. Header comment block (this section).
    2. meta tag: adoreal-prototype-version content
    3. <title> with matching · v0.N
  ═══════════════════════════════════════════════════════════════════════════
-->

<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="adoreal-prototype-version" content="0.20"/>
<title>adoreal. — Lead Management System · v0.20</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Mulish:wght@400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

/* ── Design tokens — Figma z2DZzndHRpA5lEG6gHGGdD (see memory) ── */
:root{
  --black:#342F2C; --white:#FFFFFF; --bg:#FEF7F5;
  --nude:#965E47; --nude-pink:#E1A991; --brown:#B1785F; --pink-medium:#F4E7E3;
  --p2:#F4E7E3; --p3:#EFDCD7; --p4:#E7CDC6; --p5:#DFBBB1;
  --g1:#FFFFFF; --g2:#F9F9F9; --g3:#EBEAEA; --g4:#D3D3D3; --g5:#BDBDBD; --g6:#787878; --g7:#6D635D; --g8:#342F2C;
  --text-primary:#202020; --divider:#EBEAEA;
  --red:#CB4137; --red-soft:rgba(203,65,55,.5); --red-wash:rgba(203,65,55,.06);
  --yellow:#F4C569; --yellow-soft:rgba(244,197,105,.5);
  --green:#7AC558; --green-soft:rgba(122,197,88,.5);
  --blue:#5A8DB8; --blue-soft:rgba(90,141,184,.18);
  --r4:4px; --r8:8px; --r12:12px; --r20:20px;
}
html,body{height:100%;font-family:'Proxima Nova','Mulish','Nunito Sans','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--black);font-size:14px;line-height:1.4;overflow:hidden}

/* ══════════════ TOP BAR (verbatim from the canonical shell) ══════════════ */
.aos-topbar{display:flex;align-items:center;gap:32px;padding:0 28px;height:64px;background:var(--white);border-bottom:1px solid var(--p4);flex-shrink:0;position:relative;z-index:50;transition:padding .25s ease,height .25s ease,gap .25s ease}
.aos-wordmark{font-family:'DM Serif Display',Georgia,serif;font-size:24px;color:var(--black);letter-spacing:-.3px;line-height:1;flex-shrink:0;transition:font-size .25s ease}
.aos-search{flex:0 0 320px;max-width:320px;position:relative;display:flex;align-items:center}
.aos-search-icon{position:absolute;left:14px;color:var(--g6);pointer-events:none;display:flex}
.aos-search input{width:100%;height:38px;border:1.5px solid var(--p4);border-radius:var(--r20);background:var(--white);padding:0 14px 0 38px;font-size:13px;color:var(--black);font-family:inherit;outline:none;transition:border-color .15s}
.aos-search input::placeholder{color:var(--g6)}
.aos-nav{display:flex;align-items:center;gap:28px;flex:1;height:100%}
.aos-nav-item{font-size:14px;color:var(--g7);font-weight:300;cursor:default;padding:6px 0;transition:color .15s;letter-spacing:.1px;display:inline-flex;align-items:center;gap:6px;line-height:1;height:100%;text-decoration:none}
.aos-nav-item[href]{cursor:pointer}
@media (hover: hover) { .aos-nav-item:hover{color:var(--black)} }
.aos-nav-item.active{color:var(--nude);font-weight:400}
.aos-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.aos-icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--p4);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--g7);transition:all .15s;font-family:inherit}
@media (hover: hover) { .aos-icon-btn:hover{background:var(--bg);color:var(--black)} }
.version-toast-anchor{position:relative;display:flex;align-items:center}
.version-toast{position:absolute;top:calc(100% + 8px);right:0;background:var(--white);border:1px solid var(--p4);border-radius:12px;padding:8px 14px;box-shadow:0 6px 20px rgba(52,47,44,.12);display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .15s,transform .15s;z-index:1000}
.version-toast.visible{opacity:1;transform:translateY(0);pointer-events:auto}
.version-toast-label{color:var(--g7);font-weight:500}
.version-toast-num{color:var(--brown);font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width: 1024px) { .version-toast{display:none} }
.aos-user{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 10px 4px 4px;border-radius:var(--r20);transition:background .15s}
@media (hover: hover) { .aos-user:hover{background:var(--bg)} }
.aos-user-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--brown),var(--nude));color:var(--white);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.aos-user-name{font-size:13px;color:var(--black);font-weight:500}
.aos-user-caret{color:var(--g7);display:flex}
@media (max-width:1024px) {
  .aos-topbar{padding:0 14px;gap:12px;height:56px;transition:padding .25s ease,height .25s ease}
  .aos-wordmark{font-size:22px}
  .aos-search,.aos-nav{display:none}
  .aos-user-name{display:none}
  .aos-right{margin-left:auto}
}

/* Pending-tasks dropdown (verbatim) */
.pending-anchor{position:relative;display:flex;align-items:center}
.pending-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--yellow);border:2px solid var(--white);display:none}
.pending-dot.has-pending{display:block}
.pending-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:260px;background:var(--white);border:1px solid var(--p4);border-radius:var(--r8);box-shadow:0 6px 24px rgba(52,47,44,.12);padding:8px;z-index:300;display:none}
.pending-menu.open{display:block}
.pending-menu-head{padding:8px 10px 10px;border-bottom:1px solid var(--g3);margin-bottom:6px}
.pending-menu-title{font-size:14px;font-weight:600;color:var(--text-primary);font-variant-numeric:tabular-nums}
.pending-menu-overdue{font-size:12px;color:var(--g7);margin-top:2px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px}
.pending-menu-overdue::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--yellow)}
.pending-menu-action{display:block;width:100%;text-align:left;padding:9px 10px;border:0;border-radius:var(--r4);background:transparent;cursor:pointer;font-family:inherit;font-size:13px;color:var(--text-primary)}
.pending-menu-action:hover{background:var(--bg)}

/* ══════════════ SHELL — single column, no rail ══════════════ */
.shell{height:calc(100vh - 64px);overflow:hidden;display:flex;flex-direction:column}
@media (max-width:1024px){ .shell{height:calc(100vh - 56px)} }
.main{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 32px 0;overflow:hidden}
@media (max-width:820px){ .main{padding:14px 14px 0} }

/* ── Context strip — one calm line + role switcher ── */
.context-strip{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px}
.context-summary{font-size:14px;color:var(--g7);line-height:1.5}
.context-summary .cs-strong{color:var(--text-primary);font-weight:600}
.context-summary .cs-now{color:var(--red);font-weight:600}
.context-summary .cs-sep{color:var(--g4);margin:0 7px}
.role-switcher{display:inline-flex;background:var(--g2);border-radius:var(--r20);padding:3px;flex-shrink:0}
.role-option{height:30px;padding:0 14px;border:0;background:transparent;border-radius:var(--r20);font-family:inherit;font-size:13px;font-weight:500;color:var(--g7);cursor:pointer;transition:all .15s;white-space:nowrap}
.role-option.active{background:var(--white);color:var(--black);box-shadow:0 1px 2px rgba(52,47,44,.08)}
@media (max-width:560px){ .role-option{padding:0 10px;font-size:12px} }

/* ── Filter bar ── */
.filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:12px}
.filter-search{position:relative;flex:0 0 280px;max-width:280px;display:flex;align-items:center}
.filter-search svg{position:absolute;left:13px;color:var(--g6);pointer-events:none}
.filter-search input{width:100%;height:40px;border:1px solid var(--p4);border-radius:var(--r12);background:var(--white);padding:0 12px 0 36px;font-size:14px;color:var(--black);font-family:inherit;outline:none;transition:border-color .15s}
.filter-search input:focus{border-color:var(--nude)}
.filter-search input::placeholder{color:var(--g6)}
.filter-pill{height:40px;padding:0 14px;border:1px solid var(--p4);border-radius:var(--r20);background:var(--white);font-family:inherit;font-size:13px;color:var(--g7);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:all .15s}
.filter-pill:hover{background:var(--p2)}
.filter-pill.active{background:var(--pink-medium);color:var(--black);border-color:var(--p4);font-weight:500}
.filter-pill .fp-clear{display:inline-flex;color:var(--g6)}
.filter-pill select{appearance:none;-webkit-appearance:none;background:transparent;border:0;font-family:inherit;font-size:13px;color:inherit;cursor:pointer;outline:none;padding-right:2px}
.filter-spacer{flex:1}
.filter-clear{font-size:13px;color:var(--nude);background:none;border:0;cursor:pointer;font-family:inherit;padding:0 6px}
.filter-clear:hover{text-decoration:underline}
.realtime-toggle{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px;border:0;background:transparent;font-family:inherit;font-size:13px;color:var(--g7);cursor:pointer;white-space:nowrap}
.realtime-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.realtime-toggle.live .realtime-dot{animation:rtpulse 2s ease-in-out infinite}
.realtime-toggle.paused .realtime-dot{background:var(--g5);animation:none}
@keyframes rtpulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){ .realtime-toggle.live .realtime-dot{animation:none} }
@media (max-width:820px){ .filter-search{flex-basis:100%;max-width:none} }

/* ── New-leads pill (realtime, when not at top of page 1) ── */
.new-leads-pill{align-self:center;margin:0 auto 10px;padding:7px 16px;border-radius:var(--r20);border:1px solid var(--p4);background:var(--white);box-shadow:0 4px 14px rgba(52,47,44,.10);font-size:13px;font-weight:600;color:var(--nude);cursor:pointer;display:none;align-items:center;gap:6px}
.new-leads-pill.show{display:inline-flex}

/* ══════════════ LEADS LIST ══════════════ */
/* v0.15 — master/detail work area: list column + detail pane side by side */
.work-area{flex:1;min-height:0;display:flex;gap:16px}
.leads-col{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.leads-wrap{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--white);border:1px solid var(--p4);border-radius:var(--r8);overflow:hidden}
.leads-head{display:grid;grid-template-columns:var(--cols);align-items:center;gap:12px;padding:11px 16px 11px 20px;border-bottom:1px solid var(--g3);background:var(--g2);flex-shrink:0}
.leads-head span{font-size:12px;font-weight:600;color:var(--g6);letter-spacing:.2px}
.leads-head .lh-right{text-align:right}
.leads-body{flex:1;min-height:0;overflow-y:auto}
.leads-body::-webkit-scrollbar{width:8px}
.leads-body::-webkit-scrollbar-thumb{background:var(--g3);border-radius:4px}

/* row: column set is driven by --cols which setRole() swaps */
.lead-row{display:grid;grid-template-columns:var(--cols);align-items:center;gap:12px;padding:0 16px 0 0;border-bottom:1px solid var(--g3);background:var(--white);cursor:pointer;position:relative;min-height:64px;transition:background .12s}
.lead-row:hover{background:var(--p2)}
.lead-row:last-child{border-bottom:0}
/* selected row — clearly highlighted; this lead is shown in the detail pane */
.lead-row.selected{background:var(--p2)}
.lead-row.selected::after{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--nude)}

/* (1) urgency gutter + timer */
.lead-gutter{align-self:stretch;display:flex;align-items:center;gap:11px;padding-left:16px;position:relative}
.lead-gutter::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.lead-row[data-urgency="hot"]    .lead-gutter::before{background:var(--red)}
.lead-row[data-urgency="cooling"].lead-gutter::before,
.lead-row[data-urgency="cooling"] .lead-gutter::before{background:var(--yellow)}
.lead-row[data-urgency="slow"]   .lead-gutter::before{background:var(--p5)}
.lead-row[data-urgency="stale"]  .lead-gutter::before{background:var(--g5)}
.lead-row[data-urgency="hot"]{background:var(--red-wash)}
.lead-row[data-urgency="hot"]:hover{background:rgba(203,65,55,.10)}
@media (prefers-reduced-motion: no-preference){
  .lead-row[data-urgency="hot"] .lead-gutter::before{animation:gutterpulse 2s ease-in-out infinite}
}
@keyframes gutterpulse{0%,100%{opacity:1}50%{opacity:.55}}
.lead-timer{min-width:54px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--g6);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
/* Hot timer chip: white text on solid --red so it's the loudest readable
   element in the row. (Was two conflicting rules → red-on-red, unreadable.) */
.lead-row[data-urgency="hot"] .lead-timer{background:var(--red);color:#fff;font-weight:700;padding:2px 7px;border-radius:var(--r4)}
.lead-row[data-urgency="stale"] .lead-timer{color:var(--g6)}
.lead-timer.contacted{color:#3D8B27;font-weight:500}
.lead-timer.contacted svg{color:var(--green)}
/* per-minute "pop": when a hot/cooling lead's displayed minute ticks over, the
   timer flashes a darker red and scales for ~1s so it visibly catches the eye
   (founder request). Hot already shows a red chip → it darkens; cooling is plain
   grey text → it briefly flushes red. tick() toggles .pop, removed after 1s. */
@media (prefers-reduced-motion: no-preference){
  .lead-timer.pop{animation:timerpop 1s ease-out}
  .lead-row[data-urgency="hot"] .lead-timer.pop{animation:timerpop-hot 1s ease-out}
}
@keyframes timerpop{0%{}14%{color:#9E261C;transform:scale(1.2)}100%{}}
@keyframes timerpop-hot{0%{}14%{background:#7E1D15;transform:scale(1.14);box-shadow:0 0 0 3px rgba(203,65,55,.32)}100%{}}

/* (2) person */
.lead-person{display:flex;align-items:center;gap:10px;min-width:0}
.lead-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--brown),var(--nude));color:var(--white);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lead-av.dim{background:var(--g4)}
.lead-person-main{min-width:0;display:flex;flex-direction:column;gap:1px}
.lead-name{font-size:14px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-name.dirty{color:var(--g7);font-style:italic;font-weight:500}
.lead-sub{font-size:12px;color:var(--g7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
/* dirty-data signals stay grey — red is reserved for urgency, never data quality */
.lead-sub .bounce-dot{width:6px;height:6px;border-radius:50%;background:var(--g5);flex-shrink:0}
.lead-defect{font-size:11px;color:var(--g6)}
.lead-defect-chip{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:var(--r4);font-size:10px;font-weight:600;background:var(--g2);color:var(--g6);border:1px solid var(--g3);white-space:nowrap}
.lead-defect-chip.consent{background:var(--g2);color:var(--g6);border-color:var(--g3)}
.lead-defect-chip.dupe{background:var(--blue-soft);color:#2A5F88;border-color:transparent}

/* (3) source + (4) interest + (5) status tags */
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r4);font-size:11px;font-weight:500;line-height:1;white-space:nowrap}
.tag-source{background:var(--p2);color:var(--nude)}
.tag-source.unknown{background:var(--g2);color:var(--g6)}
.lead-interest{font-size:13px;color:var(--g7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-interest.blank{color:var(--g5)}
.lead-value{font-size:13px;color:var(--text-primary);font-weight:500;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lead-value.none{color:var(--g5);font-weight:400}
.tag-status{background:var(--g2);color:var(--g7);border:1px solid var(--g3)}
/* stage chip — mirrors the inbox stage palette exactly (Discover→Long-term) so a
   lead's stage reads identically here and in inbox.html, which this view links to. */
/* Canonical 7-stage palette — background + text are the EXACT values from the
   stage table (identical to inbox.html's .sp-* pills). No border: matches the
   table + the inbox's borderless Tag Pill spec. All pairs meet WCAG AA. */
.stage-chip{display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:var(--r4);font-size:11px;font-weight:600;line-height:1;white-space:nowrap}
.stage-chip.sp-discover{background:#FEF8E7;color:#7A5C00}
.stage-chip.sp-consult {background:#6CC9D2;color:#0D4A52}
.stage-chip.sp-decide  {background:#C4B6FF;color:#3A2B7A}
.stage-chip.sp-preop   {background:#FFA96C;color:#6E3300}
.stage-chip.sp-surgery {background:#F4A6B0;color:#7A1F2C}
.stage-chip.sp-recover {background:#F8B8D0;color:#7A2244}
.stage-chip.sp-longterm{background:#B8E0C8;color:#22542F}

/* (6) suggested action — v0.15: in the ROW this is now a QUIET hint, not a
   black button on every line (the founder's "too many Call now" note). The
   prominent Send lives in the detail pane for the selected lead only. */
.lead-action{display:flex;justify-content:flex-start}
.sa-hint{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--g7);white-space:nowrap}
.sa-hint .sa-ico{color:var(--nude);display:inline-flex}
.sa-hint.call .sa-ico{color:var(--blue)}
.sa-hint.muted{color:var(--g5)}
.sa-hint.muted .sa-ico{color:var(--g5)}
/* .sa-btn is the prominent action — used only in the detail pane composer */
.sa-btn{height:30px;padding:0 13px;border-radius:var(--r20);border:1px solid var(--black);background:var(--black);color:var(--white);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.sa-btn:hover{background:var(--nude);border-color:var(--nude)}
.sa-btn.ghost{background:transparent;color:var(--g7);border-color:var(--p4)}
.sa-btn.ghost:hover{background:var(--p2);color:var(--black)}
.sa-wait{font-size:12px;color:var(--g6);white-space:nowrap}
.sa-disabled{font-size:12px;color:var(--g5);white-space:nowrap;font-style:italic}

/* (right) reply + overflow */
.lead-end{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.lead-reply{font-size:13px;color:var(--black);text-decoration:none;white-space:nowrap}
.lead-reply:hover{color:var(--nude);text-decoration:underline}
.lead-reply.disabled{color:var(--g5);pointer-events:none}
.lead-more{width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--g6);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.lead-more:hover{background:var(--g2);color:var(--black)}

/* Stage now shows in every role (it replaced Source). Setup/engine stay role-only. */
.lead-stage{display:flex;align-items:center}
.lead-setup,.lead-engine{display:none}
body[data-role="onboarding"] .lead-setup{display:flex;align-items:center}
body[data-role="support"] .lead-engine{display:flex;align-items:center;min-width:0;overflow:hidden}
.lead-setup{gap:4px}
.setup-dot{width:8px;height:8px;border-radius:50%;background:var(--g3)}
.setup-dot.on{background:var(--green)}
.engine-state{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--g7);min-width:0;max-width:100%}
.engine-state .es-dot{width:7px;height:7px;border-radius:50%;background:var(--g4);flex-shrink:0}
.engine-state .es-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.engine-state.done .es-dot{background:var(--green)}
.engine-state.failed{color:var(--red)} .engine-state.failed .es-dot{background:var(--red)}
.engine-state.blocked .es-dot{background:var(--yellow)}
.engine-state.firing .es-dot{background:var(--green);animation:rtpulse 1.4s ease infinite}

/* ── pagination ── */
.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 4px 16px;flex-shrink:0}
.pagination-summary{font-size:13px;color:var(--g7);font-variant-numeric:tabular-nums}
.pagination-controls{display:flex;align-items:center;gap:6px}
.pg-btn{min-width:32px;height:32px;padding:0 8px;border:1px solid var(--p4);border-radius:var(--r8);background:var(--white);font-family:inherit;font-size:13px;color:var(--text-primary);cursor:pointer;font-variant-numeric:tabular-nums}
.pg-btn:hover:not(:disabled){background:var(--p2)}
.pg-btn.active{background:var(--pink-medium);font-weight:600;border-color:var(--p4)}
.pg-btn:disabled{color:var(--g5);cursor:default}
.pg-ellipsis{color:var(--g5);padding:0 2px}
.pg-size{height:32px;border:1px solid var(--p4);border-radius:var(--r8);background:var(--white);font-family:inherit;font-size:13px;color:var(--text-primary);padding:0 6px;cursor:pointer}

/* ── detail pane — v0.15
   Desktop (≥1024px): a static right column inside .work-area, always
   visible, showing the selected lead + the 1-click composer.
   Mobile (<1024px): a slide-over sheet (the old peek-drawer behaviour). */
.detail-scrim{position:fixed;inset:0;background:rgba(52,47,44,.35);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.detail-scrim.open{opacity:1;pointer-events:auto}
.detail-pane{
  flex:0 0 380px; align-self:stretch;
  background:var(--white);border:1px solid var(--p4);border-radius:var(--r8);
  display:flex;flex-direction:column;overflow:hidden;min-height:0;
}
.detail-head{padding:18px 20px;border-bottom:1px solid var(--g3);display:flex;align-items:flex-start;gap:12px;flex-shrink:0}
.drawer-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--brown),var(--nude));color:var(--white);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.drawer-head-main{flex:1;min-width:0}
.drawer-name{font-size:17px;font-weight:700;color:var(--text-primary);line-height:1.2}
.drawer-sub{font-size:13px;color:var(--g7);margin-top:3px}
.drawer-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--p4);background:var(--white);cursor:pointer;display:none;align-items:center;justify-content:center;color:var(--g7);flex-shrink:0}
.drawer-close:hover{background:var(--p2);color:var(--black)}
.detail-body{flex:1;overflow-y:auto;padding:18px 20px}
.detail-empty{padding:40px 20px;text-align:center;color:var(--g6);font-size:13px}
@media (max-width:1023px){
  .work-area{display:block}                     /* list goes full width */
  .detail-pane{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);border-radius:0;border:0;border-left:1px solid var(--p4);transform:translateX(100%);transition:transform .25s ease;box-shadow:-8px 0 30px rgba(52,47,44,.10);z-index:201}
  .detail-pane.open{transform:translateX(0)}
  .drawer-close{display:flex}
}
.drawer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

/* ── 1-click composer (the crucial bit) ── */
.composer{border:1px solid var(--p4);border-radius:var(--r8);overflow:visible;margin-bottom:18px;position:relative;background:var(--white)}
.composer > textarea:first-child{border-radius:var(--r8) var(--r8) 0 0}
/* "Replying to …" — the most recent inbound message, so it's clear what we're answering */
.reply-to{font-size:12px;color:var(--g7);padding:9px 12px;background:var(--g2);border-bottom:1px solid var(--g3);border-radius:var(--r8) var(--r8) 0 0;line-height:1.45}
.reply-to strong{color:var(--text-primary);font-weight:600}
.composer textarea{width:100%;border:0;outline:0;resize:none;font-family:inherit;font-size:14px;line-height:1.55;color:var(--text-primary);padding:12px;min-height:96px;background:var(--white)}
.composer-foot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--g3);border-radius:0 0 var(--r8) var(--r8);background:var(--white)}
/* ── channel selector (pill + caret dropdown) — copied from inbox.html's compose-chan ── */
.chan-selector{position:relative;display:inline-flex;flex-shrink:0}
.compose-chan{display:inline-flex;align-items:center;gap:7px;padding:0 11px;height:34px;border-radius:var(--r20);font-size:13px;cursor:pointer;border:1px solid var(--p4);font-family:inherit;background:var(--white);color:var(--black);transition:background .15s,border-color .15s;user-select:none}
.compose-chan:hover{background:var(--p2);border-color:var(--nude)}
.compose-chan .chevron{transition:transform .15s;display:inline-flex;color:var(--g7)}
.compose-chan.open .chevron{transform:rotate(180deg)}
.chan-dropdown{display:none;position:absolute;bottom:calc(100% + 6px);left:0;min-width:240px;background:var(--white);border:1px solid var(--p4);border-radius:var(--r8);box-shadow:0 -4px 18px rgba(52,47,44,.16);z-index:1000;overflow:hidden}
.chan-dropdown.open{display:block}
.chan-dd-label{padding:9px 12px 4px;font-size:11px;color:var(--g7)}
.chan-dd-item{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;font-size:13px;color:var(--black);transition:background .12s}
.chan-dd-item:hover{background:var(--p2)}
.chan-dd-item.active{background:var(--p2);font-weight:600}
.chan-dd-item .dd-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chan-dd-item .dd-detail{font-size:12px;color:var(--g7);margin-left:auto;white-space:nowrap}
.cdot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.cdot-wa,.cdot-sms{background:var(--nude)} .cdot-em{background:var(--g7)} .cdot-ig{background:var(--brown)} .cdot-fb{background:var(--g6)} .cdot-call{background:var(--blue)}
.composer-send{height:38px;padding:0 20px;border-radius:var(--r20);border:0;background:var(--black);color:var(--white);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.composer-send:hover{background:var(--nude)}
.composer-send:disabled{background:var(--g4);cursor:default}
.composer-regen{font-size:12px;color:var(--nude);background:none;border:0;cursor:pointer;font-family:inherit}
.composer-regen:hover{text-decoration:underline}
.composer-note{font-size:11px;color:var(--g6);margin-left:auto;text-align:right}
.detail-sent{display:flex;align-items:center;gap:8px;padding:12px;border-radius:var(--r8);background:rgba(122,197,88,.12);border:1px solid var(--green-soft);color:#22542F;font-size:13px;font-weight:500;margin-bottom:18px}

/* ── conversation thread — the centrepiece: a tall, scrollable history that
   loads OLDER messages as the coordinator scrolls up (so they rarely need the
   inbox just to read context). Mixes patient/clinic messages with logged calls
   + system touch-points, like the live thread. ── */
.thread{margin-bottom:16px}
.thread-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.thread-head .th-title{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--g6)}
.thread-head .th-meta{font-size:11px;color:var(--g6);margin-left:auto}
.thread-head .th-inbox{font-size:11px;color:var(--nude);font-weight:600;text-decoration:none;white-space:nowrap}
.thread-head .th-inbox:hover{text-decoration:underline}
/* default shows the most recent ~handful; older load on scroll-up or via the button */
.thread-scroll{display:flex;flex-direction:column;gap:7px;padding:12px;background:var(--g2);border:1px solid var(--g3);border-radius:var(--r8);min-height:150px;max-height:clamp(210px,34vh,360px);overflow-y:auto;overscroll-behavior:contain}
.th-loadmore{align-self:center;margin-bottom:2px;font-size:11px;font-weight:600;color:var(--nude);background:var(--white);border:1px solid var(--p4);border-radius:var(--r20);padding:4px 13px;cursor:pointer;font-family:inherit}
.th-loadmore:hover{background:var(--p2)}
.th-msg{display:flex}
.th-msg.out{justify-content:flex-end}
.th-bubble{max-width:82%;padding:8px 11px;border-radius:14px;font-size:12.5px;line-height:1.45}
.th-msg.in  .th-bubble{background:var(--white);border:1px solid var(--p4);color:var(--text-primary);border-bottom-left-radius:4px}
.th-msg.out .th-bubble{background:var(--pink-medium);color:var(--black);border-bottom-right-radius:4px}
/* logged call / note / system touch-point — centred, quiet, no bubble */
.th-msg.log{justify-content:center}
.th-msg.log .th-log{display:inline-flex;align-items:center;gap:6px;max-width:90%;font-size:11px;color:var(--g6);text-align:center;line-height:1.4}
.th-msg.log .th-log .th-logico{color:var(--g5);flex-shrink:0;display:inline-flex}
.th-start{align-self:center;font-size:11px;color:var(--g5);padding:4px 0 8px}
.th-loading{align-self:center;font-size:11px;color:var(--g6);padding:6px 0}
.thread-foot{display:flex;justify-content:flex-end;margin-top:9px}
/* multi-interest "+N" badge in the list's Interest column */
.int-more{display:inline-flex;align-items:center;height:16px;padding:0 5px;margin-left:4px;border-radius:var(--r4);background:var(--p3);color:var(--nude);font-size:10px;font-weight:600;vertical-align:1px}

/* ── recommended patient-journey task (book consult / health declaration /
   Silhouette) — a next action that isn't a message or a call ── */
.task-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--p4);border-radius:var(--r8);background:var(--p2);margin-bottom:14px}
.task-card .tc-ico{width:30px;height:30px;border-radius:var(--r8);background:var(--white);border:1px solid var(--p4);display:flex;align-items:center;justify-content:center;color:var(--nude);flex-shrink:0}
.task-card .tc-body{flex:1;min-width:0}
.task-card .tc-title{font-size:14px;font-weight:600;color:var(--text-primary)}
.task-card .tc-desc{font-size:12.5px;color:var(--g7);line-height:1.45;margin-top:3px}
.task-card .tc-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px}
/* "why this action" — grounded in the person's most recent message */
.tc-why{margin-top:10px;padding-top:9px;border-top:1px dashed var(--p4);font-size:12px;color:var(--g7);line-height:1.45}
.tc-why .tc-why-msg{display:block;color:var(--text-primary);font-style:italic;margin-bottom:3px}
.sa-hint.task .sa-ico{color:var(--nude)}
.sec-title{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:none;color:var(--g6);margin-bottom:10px}
.dq-list{display:flex;flex-direction:column;gap:7px;margin-bottom:22px}
.dq-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--g7);line-height:1.4}
.dq-item .dq-dot{width:6px;height:6px;border-radius:50%;background:var(--g5);margin-top:6px;flex-shrink:0}
.dq-item.clean{color:var(--g6)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;margin-bottom:22px}
.kv-k{font-size:13px;color:var(--g6)}
.kv-v{font-size:13px;color:var(--text-primary)}
.script-box{background:var(--g2);border:1px solid var(--g3);border-radius:var(--r4);padding:12px;font-size:13px;line-height:1.55;color:var(--text-primary);margin-bottom:22px}
.dlog{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.dlog-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--g7);padding:8px 10px;border:1px solid var(--g3);border-radius:var(--r4)}
.dlog-row .dl-state{margin-left:auto;font-weight:600}
.dlog-row.fail .dl-state{color:var(--red)} .dlog-row.ok .dl-state{color:#3D8B27}
.tflag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r4);font-size:11px;font-weight:500;background:var(--g3);color:var(--g7);margin:0 6px 6px 0}

/* ── mobile bottom product-nav (verbatim) ── */
.product-nav{position:fixed;bottom:0;left:0;right:0;width:100%;height:64px;background:var(--white);border-top:1px solid var(--p4);display:flex;flex-direction:row;z-index:30;padding:0 4px}
.product-nav-item{flex:1 1 0;min-width:0;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;background:transparent;border:0;font-family:inherit;text-decoration:none;color:var(--g7);cursor:pointer;position:relative;transition:color .12s}
.product-nav-item:hover{color:var(--black)}
.product-nav-item.active{color:var(--black)}
.product-nav-item.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:32px;height:2px;background:var(--black);border-radius:1px}
.product-nav-icon{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.product-nav-label{font-size:9px;line-height:1;letter-spacing:.1px;white-space:nowrap}
.product-nav-item.active .product-nav-label{font-weight:600}
.product-nav-badge{position:absolute;top:6px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--nude);color:var(--white);font-size:9px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.product-nav-badge:empty,.product-nav-badge.zero{display:none}
.product-nav{display:none}
@media (max-width:1024px){ .product-nav{display:flex} .main{padding-bottom:0} .shell{height:calc(100vh - 56px - 64px)} }

/* responsive list: drop Interest first, then collapse to two-line rows */
/* iPad / narrow-desktop: tighten every role's tracks so nothing overflows.
   Coordinator drops Interest; Onboarding drops Interest + Setup; Support
   narrows the automation read-out. */
/* iPad / narrow-desktop: tighten every role's tracks so nothing overflows.
   Cells aren't hidden until ≤820px, so track COUNTS stay the same here
   (coordinator 7, onboarding 8, support 6) — only widths shrink. */
@media (max-width:1100px){
  body[data-role="coordinator"]{--cols:84px 1.5fr 100px 0.9fr 82px 130px 30px}
  body[data-role="onboarding"]{--cols:80px 1.3fr 96px 0.8fr 78px 50px 120px 30px}
  body[data-role="support"]{--cols:84px 1.5fr 100px 1fr 130px 30px}
}
@media (max-width:820px){
  .leads-head{display:none}
  .lead-row{grid-template-columns:1fr !important;gap:4px;padding:12px 14px 12px 18px;min-height:0}
  .lead-end{justify-content:flex-start;margin-top:2px}
  .lead-interest,.lead-stage,.lead-setup,.lead-engine,.lead-value{display:none !important}
  .lead-end{display:none !important}
}
</style>

<body data-role="coordinator">

<!-- ══ TOP BAR ══ -->
<div class="aos-topbar" data-testid="topbar">

    <span class="aos-search-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    <input type="text" placeholder="Search Patient" disabled/>
  </div>
  <nav class="aos-nav">

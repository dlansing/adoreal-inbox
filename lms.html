  v0.47 — Stages rulebook (founder, distilled from Johan's Journey OS):
    • New "Stages" section in the onboarding console (before Autonomy): the
      succinct rulebook. One rule above all: a stage is never moved by hand —
      it flips when its boundary event happens, and each stage's exit is the
      next one's entry (Discover = contact made, no appointment booked yet →
      out on first consult booked; Consult → attended; Decide → deposit paid;
      Pre-op → declaration+consents+Silhouette cleared; Surgery → discharged;
      Recover → surgeon sign-off; Long-term never really exits, win-back at 60d
      silent). Lead capture rides on top as the 24/7 layer, not a stage.
    • Johan's stage-nav feel kept: his dot palette per stage + LIVE counts —
      computed from the leads, never typed. Who-leads pills mirror the
      Autonomy trust ramp (Discover + Long-term drafts first; messy middle
      human-led; Surgery/Recover locked). STAGE_RULES + onbStages().

      list); complication = 1120 + value + days-open (rides just under the hottest

      single-status filter has nothing to diversify (no-op).

      carries the ~25-message thread). leadScore exposed on __lms. 72 tests.

      scrollable history (oldest→newest) that LAZY-LOADS older messages as the
      coordinator scrolls up — so they can read the whole exchange inline and
      rarely need to open the inbox. The thread mixes patient/clinic messages
      with logged calls + system touch-points ("Called — no answer, left
      voicemail", "Day-3 nudge sent"), like the live thread. (fullThread() +
      wireThreadScroll(); "Open full conversation →" is now a convenience.)
    • People can enquire about MULTIPLE procedures — ~18% now carry 2–3 interests
      (e.g. tummy tuck + breast augmentation). The Interest column shows the
      primary + a "+N" badge; the detail pane lists them all. (interests[] /
      interestsOf(); interest stays the primary for filters + copy.)
    • Honouring "users don't move leads → the data goes stale": stage stays
      system-derived (never a manual drag).
    • Leaner list: dropped the Status column ("Uncontacted" on every visible row)
      and the per-row Reply link (identical on every row; the row click already
      opens the reply pane). Columns are now Waiting · Person · Stage · Interest ·
      Value · Suggested action · ›.
    • Per-lead ESTIMATED VALUE (£, summed across the person's procedures) in the
      list + detail, so high-value enquiries stand out. (PROCEDURE_VALUE.)
    • Pain-points dimension pending — David is sending Johan's 13.

  v0.17 — Thread context + patient-journey tasks (founder feedback on v0.16):
    • The detail pane now shows the **recent conversation** (the last ~4–6
      messages) for anyone already engaged, so you have context before acting —
      then the prominent "Open full conversation →" hands off to the unified
      inbox for the full thread. (buildThread() synthesises a preview whose
      ending lines up with the recommended next step.)
    • Recommended next actions are no longer only message/call. Engaged people
      now surface **patient-journey TASKS** matched to where they are: **Book
      consultation**, **Send health declaration**, **Share Silhouette
      simulation** (nextPatientTask()). They render as a task card with a 1-click
      action that advances the journey one step; the row shows a quiet task hint.
    • Uncontacted people are unchanged: speed-to-lead, messaging-first composer.

  v0.16 — Column tuning on the leads list (founder feedback on v0.15):
    • Kept Waiting + urgency. The urgency timer now "pops" (flashes darker red
      + a quick scale for ~1s) each time a hot/cooling lead's displayed minute
      ticks over, so the eye catches the clock moving in realtime.
    • Dropped the "Person" column label (the column stays; the header word went).
    • Removed Source from the list — it now lives only in the detail pane on the
      right ("it shows on the right which is enough").
    • Replaced Source with STAGE, rendered with the exact inbox stage chips
      (Discover→Long-term, same colours as inbox.html). Lead stages now use the
      same 7-stage vocabulary as the inbox; the 9 featured leads carry the stage
      their inbox thread shows.

  v0.15 — Master/detail + 1-click messaging (founder feedback on v0.14):
    • Two-pane layout: list (left, top ~6 above the fold) + a detail pane
      (right) that's ALWAYS visible on desktop. The top/most-urgent lead is
      AUTO-SELECTED on landing and clearly highlighted; clicking any row
      re-selects. On mobile the pane is a slide-over sheet.
    • The detail pane carries a 1-CLICK COMPOSER: a generated, editable
      message in the smart channel for that lead, a channel switcher, and a
      prominent Send. Sending marks the lead in-conversation, toasts, and (on
      desktop) auto-advances to the next lead who needs a human — a fast
      speed-to-lead loop.
    • Messaging-first suggestions. suggestedChannel() picks the channel by
      SOURCE (Instagram→IG, web→email, phone→call…), so most leads now get a
      message suggestion, not "Call now". Calls are the minority. SMS/WhatsApp
      stay consent-gated (Belcara P0); IG/FB DMs don't need SMS consent.
    • Row action is now a QUIET hint (channel name + icon), not a black button
      on every line — the prominent action lives in the detail pane only.

  v0.14 — TRANSFORMATIONAL PIVOT (founder feedback). Full rewrite.

  The founder killed the multi-view LMS: "altogether too much going on...
  pipeline, analytics, engine — it's bullshit. a powerpoint, not a useful
  tool. let's focus on one view." v0.14 is ONE focused surface:

    A live speed-to-lead leads list. Thousands of people-before-patients,
    paginated, with the longest-waiting actionable lead loud at the top and
    a clock ticking on every uncontacted row. New leads stream in while you
    watch. Dirty data is shown honestly. Three roles read more/less detail
    off the SAME rows.

  Designed via a 4-lens design panel (urgency / dirty-data / roles / focus)
  + synthesis. Blueprint stored in the workflow transcript.

  KILLED: left rail + 5 views (Overview/Tasks/Pipeline/Engine/Analytics),
  kanban, analytics mockups, KPI deck, today-strip.
  KEPT verbatim: top bar, mobile product-nav, pending-tasks dropdown,
  version-gear toast, inbox.html handoff (?patient=&chan=/&action=log-call).

  CORE MECHANICS
    • Urgency tiers from (now − arrivedAt), uncontacted only:
        Hot 0–5m (--red, ticks m+s) · Cooling 5–60m (--yellow) ·
        Slow 1–24h (--p5) · Stale >24h (--g6, muted) · Contacted (--green, calm)
      Full-saturation colour touches ONLY the 4px gutter edge + timer chip.
    • Sort = most urgent first (tier rank, then longest-waiting within tier).
      Deliberate deviation from the panel's "longest waiting" label: a 3-day
      stale lead is re-engagement, not speed-to-lead. Hottest = row 1.
    • ~2,400 seeded leads (deterministic via mulberry32) + realtime arrivals.
      Only the current page (50/row default) is in the DOM — performance.
    • ~20% dirty data: missing/handle names, partial phones, bounced/missing
      email, dupes, no-SMS-consent (Belcara P0), vague interest, unknown
      source, spam. Shown as quiet --g6 signals; red is reserved for urgency.
    • suggestedAction(lead, role) is a pure function that degrades on dirty
      data (no phone → no "Call now"; no consent → never SMS) and switches
      verbs by role.

  ROLES (JS switch, single file, no routing; preserves scroll/filter/page;
  persisted to localStorage):
    • Patient Coordinator (default, protected, lean) — speed-to-lead cockpit.
    • Onboarding Specialist — +Stage +Setup cells, conversion verbs.
    • Adoreal Support — +Engine cell, delivery log + template-safety flags
      in the drawer ("what went wrong"); read-only.

  REALTIME + TESTS
    • Two intervals: 1s timer tick (updates visible chips only) + jittered
      arrival loop (first ~5s, opening burst, then backs off).
    • window.__lms.freezeForTest() pins the clock + stops both intervals so
      Playwright visual baselines are deterministic. Pure functions exposed
      for unit tests.

/* ══════════════ TOP BAR (verbatim from the canonical shell) ══════════════ */
.aos-topbar{display:flex;align-items:center;gap:32px;padding:0 28px;height:64px;background:var(--white);border-bottom:1px solid var(--p4);flex-shrink:0;position:relative;z-index:50;transition:padding .25s ease,height .25s ease,gap .25s ease}

.aos-search-icon{position:absolute;left:14px;color:var(--g6);pointer-events:none;display:flex}
.aos-search input{width:100%;height:38px;border:1.5px solid var(--p4);border-radius:var(--r20);background:var(--white);padding:0 14px 0 38px;font-size:13px;color:var(--black);font-family:inherit;outline:none;transition:border-color .15s}

@media (hover: hover) { .aos-icon-btn:hover{background:var(--bg);color:var(--black)} }

.leads-wrap{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--white);border:1px solid var(--p4);border-radius:var(--r8);overflow:hidden}
/* Header grid must share the ROW's left origin (padding-left:0) so every column
   header sits directly above its cell; the first label is inset 16px to match
   the timer's gutter inset. (Fixes a whole-header-row rightward drift.) */
/* v0.36: the column-header bar (Stage / Value / Suggested action) is gone —
   the columns read on their own; the space goes to the list. */
/* v0.42 — group heads (adopted from Johan's cockpit): "Needs you now" carries
   the money at stake + oldest wait; "Pipeline" is everyone else. Sticky so the
   red section header holds while you scroll its rows. Sentence case (house style). */
.group-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:7px;padding:9px 16px;background:var(--g2);border-bottom:1px solid var(--g3);font-size:12px;font-weight:700;letter-spacing:.2px;color:var(--g6)}
.group-head svg{width:12px;height:12px;flex-shrink:0}
.group-head .gh-count{font-variant-numeric:tabular-nums;font-weight:600;color:var(--g6)}
.group-head.gh-red{color:var(--red);background:#FBEEEC}
.group-head.gh-red .gh-count{color:var(--red)}
.group-head .gh-hint{margin-left:auto;font-weight:400;letter-spacing:0;font-size:11.5px;color:var(--g6)}
.group-head .gh-hint .ghh-red{color:var(--red);font-weight:700}
.leads-body{flex:1;min-height:0;overflow-y:auto}
.leads-body::-webkit-scrollbar{width:8px}
.leads-body::-webkit-scrollbar-thumb{background:var(--g3);border-radius:4px}

/* row: column set is driven by --cols (fixed coordinator layout in this fork) */
.lead-row{display:grid;grid-template-columns:var(--cols);align-items:center;gap:12px;padding:0 16px 0 0;border-bottom:1px solid var(--g3);background:var(--white);cursor:pointer;position:relative;min-height:54px;transition:background .12s}
.lead-row:hover{background:var(--p2)}
.lead-row:last-child{border-bottom:0}
/* selected row — clearly highlighted; this lead is shown in the detail pane */
/* v0.37 — the red is SPLIT: the far-left vertical bar = urgency (new inquiry /
   complication) and stays as-is; the full-row red wash now means exactly one
   thing — a patient coordinator is on this lead (you, or a colleague). */
.lead-row.selected{background:var(--red-wash)}
.lead-row.selected::after{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--red)}
.lead-row[data-claimed="1"]{background:var(--red-wash)}
.lead-row[data-claimed="1"]:hover{background:rgba(203,65,55,.10)}

/* (1) STATUS column — a left urgency bar + either the live new-inquiry timer,
   a complication flag, or a quiet timer + the patient's current milestone. */
.lead-gutter{align-self:stretch;display:flex;flex-direction:row;align-items:center;gap:7px;padding-left:16px;padding-right:8px;position:relative;min-width:0}
/* first column (no title): who-last-contacted dot + time. green = we messaged
   them last (ball in their court); red = they messaged us last (needs a reply). */
/* who-contacted-last icon: green phone-up + check = we reached out last (good);
   red phone-down + exclamation = the patient reached out last (needs a reply) */
.lc-ico{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.lc-ico svg{display:block}
.lc-ico.lc-us{color:var(--green)}
.lc-ico.lc-them{color:var(--red)}
.lc-time{font-size:12px;color:var(--g7);font-variant-numeric:tabular-nums;white-space:nowrap}
.lc-time.live{color:var(--red);font-weight:600}
.lead-gutter::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
/* the red bar + wash are reserved for the urgent kinds: new inquiries + complications */
.lead-row[data-status="new"] .lead-gutter::before,
.lead-row[data-status="complication"] .lead-gutter::before{background:var(--red)}
/* (urgency is the BAR only — the row wash now belongs to selection/assignment) */
@media (prefers-reduced-motion: no-preference){
  .lead-row[data-status="new"] .lead-gutter::before{animation:gutterpulse 2s ease-in-out infinite}
}
@keyframes gutterpulse{0%,100%{opacity:1}50%{opacity:.55}}
/* new-inquiry timer: the loud red chip with the live ticker (seconds) */
.lead-timer{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--g6);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.lead-timer.new{background:var(--red);color:#fff;font-weight:700;padding:2px 7px;border-radius:var(--r4)}
/* quiet timer for everyone else — to the minute, muted */
.ls-time{font-size:11px;color:var(--g6);font-variant-numeric:tabular-nums;white-space:nowrap}
/* current-milestone status chip */
.status-chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;height:22px;padding:0 9px;border-radius:var(--r20);font-size:11px;font-weight:600;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--p2);color:var(--nude)}
.status-chip svg{flex-shrink:0}
.status-chip.status-todo{background:var(--g2);color:var(--g7)}
.status-chip.complication{background:rgba(203,65,55,.12);color:var(--red);gap:6px}
/* status chip shown beside the name (and reused in the detail pane). Per-status
   colours so New / Book appointment / Appointment booked / Action needed /
   Complication read at a glance. */
.lead-status-tag{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 8px;border-radius:var(--r20);font-size:10.5px;font-weight:600;line-height:1;white-space:nowrap;flex-shrink:0;background:var(--p2);color:var(--nude)}
.lead-status-tag svg{width:11px;height:11px;flex-shrink:0}
.lead-status-tag.status-new{background:#E9DCCB;color:#7A4E1E}
.lead-status-tag.status-todo{background:var(--p2);color:var(--nude)}
.lead-status-tag.status-appointment{background:rgba(122,197,88,.16);color:#3D8B27}
.lead-status-tag.status-action{background:#FBE9CE;color:#8A5A00}
.lead-status-tag.status-complication{background:rgba(203,65,55,.12);color:var(--red)}
/* a colleague is on this lead — compact claim tag beside the status chip */
.claim-tag{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 8px 0 3px;border-radius:var(--r20);font-size:10.5px;font-weight:600;line-height:1;white-space:nowrap;flex-shrink:0;background:rgba(203,65,55,.10);color:var(--red)}
.claim-tag .claim-av{width:14px;height:14px;border-radius:50%;background:var(--red);color:var(--white);font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion: no-preference){
  .lead-timer.new.pop{animation:timerpop-hot 1s ease-out}
}
@keyframes timerpop-hot{0%{}14%{background:#7E1D15;transform:scale(1.14);box-shadow:0 0 0 3px rgba(203,65,55,.32)}100%{}}

/* (2) person */
.lead-person{display:flex;align-items:center;gap:10px;min-width:0}
.lead-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--brown),var(--nude));color:var(--white);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lead-av.dim{background:var(--g4)}
.lead-person-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.lead-name-row{display:flex;align-items:center;gap:7px;min-width:0}
.lead-name{font-size:14px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lead-name.dirty{color:var(--g7);font-style:italic;font-weight:500}
/* clickable phone in the sub-line — underlined, opens the outbound-call modal */
.lead-phone{color:var(--g7);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--g5);cursor:pointer}
.lead-phone:hover{color:var(--nude);text-decoration-color:var(--nude)}
/* v0.42: the row sub-line (phone/email) is gone — the clickable number lives in
   the detail pane's Phone field. Rows are one line; more leads per screen. */
.lead-defect{font-size:11px;color:var(--g6)}

/* (3) source + (4) interest + (5) status tags */
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r4);font-size:11px;font-weight:500;line-height:1;white-space:nowrap}
.tag-source{background:var(--p2);color:var(--nude)}
.tag-source.unknown{background:var(--g2);color:var(--g6)}
.lead-interest{font-size:13px;color:var(--g7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-interest.blank{color:var(--g5)}
.lead-value{font-size:13px;color:var(--text-primary);font-weight:500;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lead-value.none{color:var(--g5);font-weight:400}
.tag-status{background:var(--g2);color:var(--g7);border:1px solid var(--g3)}
/* stage chip — mirrors the inbox stage palette exactly (Discover→Long-term) so a
   lead's stage reads identically here and in inbox.html, which this view links to. */
/* Canonical 7-stage palette — background + text are the EXACT values from the
   stage table (identical to inbox.html's .sp-* pills). No border: matches the
   table + the inbox's borderless Tag Pill spec. All pairs meet WCAG AA. */
.stage-chip{display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:var(--r4);font-size:11px;font-weight:600;line-height:1;white-space:nowrap}
.stage-chip.sp-discover{background:#FEF8E7;color:#7A5C00}
.stage-chip.sp-consult {background:#6CC9D2;color:#0D4A52}
.stage-chip.sp-decide  {background:#C4B6FF;color:#3A2B7A}
.stage-chip.sp-preop   {background:#FFA96C;color:#6E3300}
.stage-chip.sp-surgery {background:#F4A6B0;color:#7A1F2C}
.stage-chip.sp-recover {background:#F8B8D0;color:#7A2244}
.stage-chip.sp-longterm{background:#B8E0C8;color:#22542F}

/* (6) suggested action — v0.15: in the ROW this is now a QUIET hint, not a
   black button on every line (the founder's "too many Call now" note). The
   prominent Send lives in the detail pane for the selected lead only. */
/* v0.43: the row's Suggested-action column is removed (implied; shown in the
   detail pane). .sa-hint styling kept — actionHintHtml still exists for reuse. */
.sa-hint{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--g7);white-space:nowrap}
.sa-hint .sa-ico{color:var(--nude);display:inline-flex}
.sa-hint.call .sa-ico{color:var(--blue)}
.sa-hint.muted{color:var(--g5)}
.sa-hint.muted .sa-ico{color:var(--g5)}
/* .sa-btn is the prominent action — used only in the detail pane composer */
.sa-btn{height:30px;padding:0 13px;border-radius:var(--r20);border:1px solid var(--black);background:var(--black);color:var(--white);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.sa-btn:hover{background:var(--nude);border-color:var(--nude)}
.sa-btn.ghost{background:transparent;color:var(--g7);border-color:var(--p4)}
.sa-btn.ghost:hover{background:var(--p2);color:var(--black)}
.sa-wait{font-size:12px;color:var(--g6);white-space:nowrap}
.sa-disabled{font-size:12px;color:var(--g5);white-space:nowrap;font-style:italic}

/* (right) reply + overflow */
.lead-end{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.lead-reply{font-size:13px;color:var(--black);text-decoration:none;white-space:nowrap}
.lead-reply:hover{color:var(--nude);text-decoration:underline}
.lead-reply.disabled{color:var(--g5);pointer-events:none}
.lead-more{width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--g6);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.lead-more:hover{background:var(--g2);color:var(--black)}

/* Stage now shows in every role (it replaced Source). Setup/engine stay role-only. */
.lead-stage{display:flex;align-items:center}

/* ── infinite scroll (v0.35) — pagination removed; the list grows as you scroll.
   The sentinel is a quiet one-liner at the bottom while more rows remain. */
.list-more{padding:14px 16px;text-align:center;font-size:12px;color:var(--g6);font-variant-numeric:tabular-nums}

/* ── detail pane — v0.15
   Desktop (≥1024px): a static right column inside .work-area, always
   visible, showing the selected lead + the 1-click composer.
   Mobile (<1024px): a slide-over sheet (the old peek-drawer behaviour). */
.detail-scrim{position:fixed;inset:0;background:rgba(52,47,44,.35);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.detail-scrim.open{opacity:1;pointer-events:auto}

/* ── outbound-call modal (placeholder: "initiates outbound phone call") ── */
.call-modal-scrim{position:fixed;inset:0;background:rgba(52,47,44,.4);z-index:300;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s,visibility .18s}
.call-modal-scrim.open{opacity:1;visibility:visible;pointer-events:auto}
.call-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-48%) scale(.97);width:320px;max-width:calc(100vw - 32px);background:var(--white);border:1px solid var(--p4);border-radius:var(--r12);box-shadow:0 12px 40px rgba(52,47,44,.18);z-index:301;padding:24px 22px 20px;text-align:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s,transform .18s,visibility .18s}
.call-modal.open{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.call-modal .cm-icon{width:44px;height:44px;border-radius:50%;background:var(--p2);color:var(--nude);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.call-modal .cm-title{font-size:15px;font-weight:600;color:var(--text-primary)}
.call-modal .cm-number{font-size:14px;color:var(--g7);font-variant-numeric:tabular-nums;margin-top:4px}
.call-modal .cm-note{font-size:12px;color:var(--g6);margin-top:8px}
.call-modal .cm-actions{display:flex;gap:8px;justify-content:center;margin-top:16px}
.call-modal .cm-btn{height:34px;padding:0 18px;border-radius:var(--r20);border:1px solid var(--black);background:var(--black);color:var(--white);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer}
.call-modal .cm-btn:hover{background:var(--nude);border-color:var(--nude)}
.call-modal .cm-btn.ghost{background:transparent;color:var(--g7);border-color:var(--p4)}
.call-modal .cm-btn.ghost:hover{color:var(--black);background:var(--p2)}
.detail-pane{
  flex:0 0 380px; align-self:stretch;
  background:var(--white);border:1px solid var(--p4);border-radius:var(--r8);
  display:flex;flex-direction:column;overflow:hidden;min-height:0;
}
.detail-head{padding:18px 20px;border-bottom:1px solid var(--g3);display:flex;align-items:flex-start;gap:12px;flex-shrink:0}
.drawer-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--brown),var(--nude));color:var(--white);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.drawer-head-main{flex:1;min-width:0}
.drawer-name{font-size:17px;font-weight:700;color:var(--text-primary);line-height:1.2}
.drawer-sub{font-size:13px;color:var(--g7);margin-top:3px}
/* Patient ID chip — the real app's format (PAT 650323), patients only */
.d-patid{margin-top:5px}
.patid-chip{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:var(--r4);background:var(--g2);border:1px solid var(--g3);font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--g7);font-variant-numeric:tabular-nums}
/* AI summary (messy middle only) — a quiet catch-up brief with its timestamp;
   Generate appears when the summary is over a day old */
.ai-sum{border:1px solid var(--p4);border-left:3px solid var(--nude);border-radius:var(--r8);background:var(--p2);padding:12px 14px;margin-bottom:14px}
.ai-sum-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ai-sum-title{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--nude)}
.ai-sum-time{font-size:11px;color:var(--g6);font-variant-numeric:tabular-nums}
.ai-sum-gen{margin-left:auto;height:24px;padding:0 11px;border-radius:var(--r20);border:1px solid var(--nude);background:var(--white);color:var(--nude);font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
.ai-sum-gen:hover{background:var(--nude);color:var(--white)}
.ai-sum-text{font-size:12.5px;color:var(--g7);line-height:1.55}
/* Patient 360 link — appears (right-hand side) only for beyond-Discover patients */
.d-360-slot{flex-shrink:0}
.d-360-btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 13px;border-radius:var(--r20);border:1px solid var(--nude);background:var(--white);color:var(--nude);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.d-360-btn:hover{background:var(--nude);color:var(--white)}
.d-360-btn .d-360-arrow{font-size:13px;line-height:1}
.drawer-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--p4);background:var(--white);cursor:pointer;display:none;align-items:center;justify-content:center;color:var(--g7);flex-shrink:0}
.drawer-close:hover{background:var(--p2);color:var(--black)}
.detail-body{flex:1;overflow-y:auto;padding:18px 20px}
.detail-empty{padding:40px 20px;text-align:center;color:var(--g6);font-size:13px}
@media (max-width:1023px){
  .work-area{display:block}                     /* list goes full width */
  .detail-pane{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);border-radius:0;border:0;border-left:1px solid var(--p4);transform:translateX(100%);transition:transform .25s ease;box-shadow:-8px 0 30px rgba(52,47,44,.10);z-index:201}
  .detail-pane.open{transform:translateX(0)}
  .drawer-close{display:flex}
}
.drawer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

/* ── 1-click composer (the crucial bit) ── */
.composer{border:1px solid var(--p4);border-radius:var(--r8);overflow:visible;margin-bottom:18px;position:relative;background:var(--white)}
.composer > textarea:first-child{border-radius:var(--r8) var(--r8) 0 0}
/* "Replying to …" — the most recent inbound message, so it's clear what we're answering */
.reply-to{font-size:12px;color:var(--g7);padding:9px 12px;background:var(--g2);border-bottom:1px solid var(--g3);border-radius:var(--r8) var(--r8) 0 0;line-height:1.45}
.reply-to strong{color:var(--text-primary);font-weight:600}
.composer textarea{width:100%;border:0;outline:0;resize:none;font-family:inherit;font-size:14px;line-height:1.55;color:var(--text-primary);padding:12px;min-height:96px;background:var(--white)}
.composer-foot{display:flex;align-items:center;flex-wrap:wrap;gap:10px;row-gap:8px;padding:10px 12px;border-top:1px solid var(--g3);border-radius:0 0 var(--r8) var(--r8);background:var(--white)}
/* ── channel selector (pill + caret dropdown) — copied from inbox.html's compose-chan ── */
.chan-selector{position:relative;display:inline-flex;flex-shrink:0}
.compose-chan{display:inline-flex;align-items:center;gap:7px;padding:0 11px;height:34px;border-radius:var(--r20);font-size:13px;cursor:pointer;border:1px solid var(--p4);font-family:inherit;background:var(--white);color:var(--black);transition:background .15s,border-color .15s;user-select:none}
.compose-chan:hover{background:var(--p2);border-color:var(--nude)}
.compose-chan .chevron{transition:transform .15s;display:inline-flex;color:var(--g7)}
.compose-chan.open .chevron{transform:rotate(180deg)}
.chan-dropdown{display:none;position:absolute;bottom:calc(100% + 6px);left:0;min-width:240px;background:var(--white);border:1px solid var(--p4);border-radius:var(--r8);box-shadow:0 -4px 18px rgba(52,47,44,.16);z-index:1000;overflow:hidden}
.chan-dropdown.open{display:block}
.chan-dd-label{padding:9px 12px 4px;font-size:11px;color:var(--g7)}
.chan-dd-item{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;font-size:13px;color:var(--black);transition:background .12s}
.chan-dd-item:hover{background:var(--p2)}
.chan-dd-item.active{background:var(--p2);font-weight:600}
.chan-dd-item .dd-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chan-dd-item .dd-detail{font-size:12px;color:var(--g7);margin-left:auto;white-space:nowrap}
.cdot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.cdot-wa,.cdot-sms{background:var(--nude)} .cdot-em{background:var(--g7)} .cdot-ig{background:var(--brown)} .cdot-fb{background:var(--g6)} .cdot-call{background:var(--blue)}
.composer-send{height:38px;padding:0 20px;border-radius:var(--r20);border:0;background:var(--black);color:var(--white);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.composer-send:hover{background:var(--nude)}
.composer-send:disabled{background:var(--g4);cursor:default}
.composer-regen{font-size:12px;color:var(--nude);background:none;border:0;cursor:pointer;font-family:inherit}
.composer-regen:hover{text-decoration:underline}
.composer-note{font-size:11px;color:var(--g6);margin-left:auto;text-align:right;flex-basis:100%}
.detail-sent{display:flex;align-items:center;gap:8px;padding:12px;border-radius:var(--r8);background:rgba(122,197,88,.12);border:1px solid var(--green-soft);color:#22542F;font-size:13px;font-weight:500;margin-bottom:18px}

/* ── conversation thread — the centrepiece: a tall, scrollable history that
   loads OLDER messages as the coordinator scrolls up (so they rarely need the
   inbox just to read context). Mixes patient/clinic messages with logged calls
   + system touch-points, like the live thread. ── */
.thread{margin-bottom:16px}
.thread-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.thread-head .th-title{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--g6)}
.thread-head .th-meta{font-size:11px;color:var(--g6);margin-left:auto}
.thread-head .th-inbox{font-size:11px;color:var(--nude);font-weight:600;text-decoration:none;white-space:nowrap}
.thread-head .th-inbox:hover{text-decoration:underline}
/* default shows the most recent ~handful; older load on scroll-up or via the button */
.thread-scroll{display:flex;flex-direction:column;gap:7px;padding:12px;background:var(--g2);border:1px solid var(--g3);border-radius:var(--r8);min-height:150px;max-height:clamp(210px,34vh,360px);overflow-y:auto;overscroll-behavior:contain}
.th-loadmore{align-self:center;margin-bottom:2px;font-size:11px;font-weight:600;color:var(--nude);background:var(--white);border:1px solid var(--p4);border-radius:var(--r20);padding:4px 13px;cursor:pointer;font-family:inherit}
.th-loadmore:hover{background:var(--p2)}
.th-msg{display:flex}
.th-msg.out{justify-content:flex-end}
.th-bubble{max-width:82%;padding:8px 11px;border-radius:14px;font-size:12.5px;line-height:1.45}
.th-msg.in  .th-bubble{background:var(--white);border:1px solid var(--p4);color:var(--text-primary);border-bottom-left-radius:4px}
.th-msg.out .th-bubble{background:var(--pink-medium);color:var(--black);border-bottom-right-radius:4px}
/* logged call / note / system touch-point — centred, quiet, no bubble */
.th-msg.log{justify-content:center}
.th-msg.log .th-log{display:inline-flex;align-items:center;gap:6px;max-width:90%;font-size:11px;color:var(--g6);text-align:center;line-height:1.4}
.th-msg.log .th-log .th-logico{color:var(--g5);flex-shrink:0;display:inline-flex}
.th-start{align-self:center;font-size:11px;color:var(--g5);padding:4px 0 8px}
.th-loading{align-self:center;font-size:11px;color:var(--g6);padding:6px 0}
.thread-foot{display:flex;justify-content:flex-end;margin-top:9px}
/* multi-interest "+N" badge in the list's Interest column */
.int-more{display:inline-flex;align-items:center;height:16px;padding:0 5px;margin-left:4px;border-radius:var(--r4);background:var(--p3);color:var(--nude);font-size:10px;font-weight:600;vertical-align:1px}

/* ── recommended patient-journey task (book consult / health declaration /
   Silhouette) — a next action that isn't a message or a call ── */
.task-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--p4);border-radius:var(--r8);background:var(--p2);margin-bottom:14px}
.task-card .tc-ico{width:30px;height:30px;border-radius:var(--r8);background:var(--white);border:1px solid var(--p4);display:flex;align-items:center;justify-content:center;color:var(--nude);flex-shrink:0}
.task-card .tc-body{flex:1;min-width:0}
.task-card .tc-title{font-size:14px;font-weight:600;color:var(--text-primary)}
.task-card .tc-desc{font-size:12.5px;color:var(--g7);line-height:1.45;margin-top:3px}
.task-card .tc-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px}
/* "why this action" — grounded in the person's most recent message */
.tc-why{margin-top:10px;padding-top:9px;border-top:1px dashed var(--p4);font-size:12px;color:var(--g7);line-height:1.45}
.tc-why .tc-why-msg{display:block;color:var(--text-primary);font-style:italic;margin-bottom:3px}
.sa-hint.task .sa-ico{color:var(--nude)}
/* critical (complication) action hint — the loud "a task needs doing" cue in the row */
.sa-hint.critical{color:var(--red);font-weight:600}
.sa-hint.critical .sa-ico{color:var(--red)}
/* the row itself carries a faint critical wash so the assigned task reads at a glance */

/* task-card variants: a critical complication card, the call-logging card, the
   booking mini-scheduler. All share the base .task-card shell. */
/* claim gate — a colleague is on this lead */
.task-card.claim{border-color:rgba(203,65,55,.35);background:rgba(203,65,55,.06)}
.task-card.claim .tc-ico.claim-ico{background:var(--red);border-color:var(--red);color:var(--white);font-size:11px;font-weight:700}
.task-card.critical{border-color:rgba(203,65,55,.35);background:rgba(203,65,55,.06)}
.task-card.critical .tc-ico.crit{color:var(--red);border-color:rgba(203,65,55,.35)}
.task-card.critical .tc-title{color:#9E261C}
.task-card.call .tc-ico{color:var(--blue)}
.slot-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.slot-chip{height:30px;padding:0 12px;border-radius:var(--r20);border:1px solid var(--p4);background:var(--white);color:var(--g7);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.slot-chip:hover{border-color:var(--nude);color:var(--nude)}
.slot-chip.sel{background:var(--nude);border-color:var(--nude);color:var(--white)}

/* contextual "Or …" quick-action bar under the primary card */
.quick-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 18px}
.quick-actions .qa-or{font-size:11.5px;color:var(--g5)}
.qa-btn{height:30px;padding:0 11px;border-radius:var(--r20);border:1px solid var(--p4);background:var(--white);color:var(--g7);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.qa-btn:hover{border-color:var(--nude);color:var(--nude)}
.qa-btn .qa-ico{display:inline-flex;color:var(--nude)}
.sec-title{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:none;color:var(--g6);margin-bottom:10px}
.dq-list{display:flex;flex-direction:column;gap:7px;margin-bottom:22px}
.dq-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--g7);line-height:1.4}
.dq-item .dq-dot{width:6px;height:6px;border-radius:50%;background:var(--g5);margin-top:6px;flex-shrink:0}
.dq-item.clean{color:var(--g6)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;margin-bottom:22px;align-items:center}
.kv-k{font-size:13px;color:var(--g6)}
.kv-v{font-size:13px;color:var(--text-primary)}
/* ── editable Lead details (v0.48) ── */
.ld-head{display:flex;align-items:center;gap:8px}
.ld-missing{font-size:10.5px;font-weight:700;letter-spacing:.2px;color:#8A5A00;background:#FBE9CE;border-radius:var(--r20);padding:2px 8px;text-transform:none;letter-spacing:0}
/* a value that edits on click — reads like text until you hover it */
.kv-edit{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:2px 6px;margin:-2px -6px;border:1px solid transparent;border-radius:var(--r4);background:transparent;font-family:inherit;font-size:13px;color:var(--text-primary);text-align:left;cursor:pointer;line-height:1.35}
.kv-edit:hover{background:var(--p2);border-color:var(--p4)}
.kv-edit .kv-pencil-inline{opacity:0;color:var(--g5);display:inline-flex;transition:opacity .12s}
.kv-edit:hover .kv-pencil-inline{opacity:1}
.kv-edit.missing{background:#FBE9CE;border-color:#F0D5A8;color:#8A5A00;font-weight:600}
.kv-edit.missing:hover{background:#F7E0BC}
.kv-miss-tag{font-size:9.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:#fff;background:#C98A2E;border-radius:var(--r20);padding:1px 6px}
.kv-flag{font-size:10.5px;font-weight:700;color:var(--red)}
.kv-phone-wrap{display:inline-flex;align-items:center;gap:6px}
.kv-pencil{display:inline-flex;padding:2px;border:0;background:transparent;color:var(--g5);cursor:pointer;border-radius:var(--r4)}
.kv-pencil:hover{color:var(--nude);background:var(--p2)}
/* inline editor */
.kv-editing{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kv-input{flex:1;min-width:110px;height:30px;border:1px solid var(--nude);border-radius:var(--r8);background:var(--white);padding:0 9px;font-family:inherit;font-size:13px;color:var(--black);outline:none}
select.kv-input{cursor:pointer}
.kv-save{height:30px;padding:0 12px;border-radius:var(--r20);border:1px solid var(--black);background:var(--black);color:var(--white);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.kv-save:hover{background:var(--nude);border-color:var(--nude)}
.kv-cancel{height:30px;padding:0 10px;border-radius:var(--r20);border:1px solid var(--p4);background:transparent;color:var(--g7);font-family:inherit;font-size:12px;cursor:pointer}
.kv-cancel:hover{background:var(--p2);color:var(--black)}
/* inline validation reason (wraps to its own line under the editor) */
.kv-error{flex-basis:100%;order:9;font-size:11.5px;color:var(--red);margin-top:1px;line-height:1.35}
.kv-input.invalid,.tel-main.invalid{border-color:var(--red)}
.kv-input.invalid:focus,.tel-main.invalid{box-shadow:0 0 0 3px rgba(203,65,55,.12)}
/* international phone input — flag + dial-code country picker + national number */
.tel-field{position:relative;flex:1 1 100%;min-width:150px;display:flex;flex-wrap:wrap}
.tel-main{display:flex;align-items:center;gap:7px;flex:1;min-width:0;height:34px;padding:0 9px;border:1px solid var(--nude);border-radius:var(--r8);background:var(--white)}
.tel-main:focus-within{box-shadow:0 0 0 3px var(--p2)}
.tel-country{display:inline-flex;align-items:center;gap:3px;flex-shrink:0;border:0;background:transparent;padding:2px 3px;margin:0 -1px;border-radius:var(--r4);cursor:pointer;font-family:inherit}
.tel-country:hover{background:var(--p2)}
.tel-flag{font-size:16px;line-height:1}
.tel-caret{color:var(--nude);font-size:9px;line-height:1}
.tel-dial{flex-shrink:0;font-size:13px;font-weight:600;color:var(--black);font-variant-numeric:tabular-nums}
.tel-number{flex:1;min-width:0;border:0;background:transparent;outline:none;font-family:inherit;font-size:13px;color:var(--black);letter-spacing:.3px}
.tel-number::placeholder{color:var(--g5);letter-spacing:.3px}
.tel-menu{position:absolute;top:38px;left:0;z-index:40;width:230px;max-height:232px;overflow-y:auto;background:var(--white);border:1px solid var(--g3);border-radius:var(--r8);box-shadow:0 8px 28px rgba(52,47,44,.16);padding:4px}
.tel-opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border:0;background:transparent;border-radius:var(--r4);cursor:pointer;font-family:inherit;font-size:13px;color:var(--black);text-align:left}
.tel-opt:hover{background:var(--p2)}
.tel-opt.sel{background:var(--p3)}
.tel-optflag{font-size:16px;line-height:1;flex-shrink:0}
.tel-optname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tel-optdial{color:var(--g6);font-variant-numeric:tabular-nums;flex-shrink:0}
.tel-flag-sm{font-size:14px;line-height:1;margin-right:1px;vertical-align:-1px}
.script-box{background:var(--g2);border:1px solid var(--g3);border-radius:var(--r4);padding:12px;font-size:13px;line-height:1.55;color:var(--text-primary);margin-bottom:22px}


/* ── mobile bottom product-nav (verbatim) ── */
.product-nav{position:fixed;bottom:0;left:0;right:0;width:100%;height:64px;background:var(--white);border-top:1px solid var(--p4);display:flex;flex-direction:row;z-index:30;padding:0 4px}
.product-nav-item{flex:1 1 0;min-width:0;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;background:transparent;border:0;font-family:inherit;text-decoration:none;color:var(--g7);cursor:pointer;position:relative;transition:color .12s}
.product-nav-item:hover{color:var(--black)}
.product-nav-item.active{color:var(--black)}
.product-nav-item.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:32px;height:2px;background:var(--black);border-radius:1px}
.product-nav-icon{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.product-nav-label{font-size:9px;line-height:1;letter-spacing:.1px;white-space:nowrap}
.product-nav-item.active .product-nav-label{font-weight:600}
.product-nav-badge{position:absolute;top:6px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--nude);color:var(--white);font-size:9px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.product-nav-badge:empty,.product-nav-badge.zero{display:none}
.product-nav{display:none}
@media (max-width:1024px){ .product-nav{display:flex} .main{padding-bottom:0} .shell{height:calc(100vh - 56px - 64px)} }

/* responsive list: tighten the tracks first, then collapse to compressed rows.
   Cells aren't hidden until ≤820px, so the track count stays 6 here — only
   widths shrink. */
@media (max-width:1100px){
  body[data-role="coordinator"]{--cols:88px 1.5fr 96px 0.9fr 80px 30px}
}
@media (max-width:820px){
  /* Mobile lead row (v0.32): a single compressed line that uses the full width —
     avatar + name at the left, the timer/status centered, the next action at the
     right. The phone/email sub-line is dropped and the urgency bar becomes the
     row's left border, so more leads fit per screen. */
  .lead-row{
    display:flex !important; grid-template-columns:none !important;
    align-items:center; gap:8px; padding:8px 14px; min-height:0;
    border-left:3px solid transparent;
  }
  .lead-row[data-status="new"], .lead-row[data-status="complication"]{border-left-color:var(--red)}
  .lead-gutter::before{display:none}                       /* bar is now the row's left border */
  .lead-person{order:1; flex:1 1 0; min-width:0}
  .lead-gutter{order:2; flex:0 0 auto; padding:0; align-items:center; justify-content:center; gap:3px}
  .lead-interest,.lead-stage,.lead-value,.lead-end{display:none !important}
  /* compress so more rows fit */
  .lead-av{width:30px;height:30px;font-size:10px}
  .lead-name{font-size:13px}
  .sa-hint{font-size:11px}
  .lead-timer.new{padding:2px 6px;font-size:11px}
  .status-chip{height:19px;font-size:10px;padding:0 7px}
  .ls-time{font-size:10px}
}
</style>
</head>
<body data-role="coordinator">

<!-- ══ TOP BAR ══ -->
<div class="aos-topbar" data-testid="topbar">
  <div class="aos-wordmark" data-testid="wordmark">adoreal.</div>
  <div class="aos-search" data-testid="topbar-search">
    <span class="aos-search-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    <input type="text" placeholder="Search Patient" disabled/>
  </div>
  <nav class="aos-nav">
    <span class="aos-nav-item" data-testid="topnav-dashboard">Dashboard</span>
    <span class="aos-nav-item" data-testid="topnav-schedule">Schedule</span>
    <span class="aos-nav-item active" data-testid="topnav-patients">Patients</span>
    <span class="aos-nav-item" data-testid="topnav-financials">Financials</span>
    <a class="aos-nav-item" href="inbox.html" data-testid="topnav-inbox">Inbox</a>
  </nav>
  <div class="aos-right">
    <div class="pending-anchor">
      <button class="aos-icon-btn" title="Pending tasks" aria-label="Pending tasks" id="pending-btn" onclick="togglePendingMenu(event)" data-testid="pending-btn" aria-expanded="false" aria-haspopup="true">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><polyline points="3,8 6.5,11.5 13,4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="pending-dot" id="pending-dot" data-testid="pending-dot"></span>
      </button>
      <div class="pending-menu" id="pending-menu" role="menu" data-testid="pending-menu">
        <div class="pending-menu-head">
          <div class="pending-menu-title">Leads waiting: (<span id="pending-count">—</span>)</div>
          <div class="pending-menu-overdue">(<span id="pending-overdue">—</span> need you now)</div>
        </div>
        <button class="pending-menu-action" onclick="closePendingMenu();filterToHot()" data-testid="pending-view-hot">Show the hot ones →</button>
      </div>
    </div>
    <div class="version-toast-anchor">
      <button class="aos-icon-btn" title="Settings" aria-label="Settings" onclick="showVersion()" id="aos-settings-btn" data-testid="gear-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <div class="version-toast" id="version-toast" role="status" aria-live="polite">
        <span class="version-toast-label">Prototype</span>
        <span class="version-toast-num" id="version-toast-num" data-testid="version-num">v—</span>
      </div>
    </div>
    <div class="aos-user">
      <div class="aos-user-av">AS</div>
      <span class="aos-user-name">Alex Smith</span>
      <span class="aos-user-caret"><svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="M3 6l5 5 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
  </div>
</div>

<!-- ══ SHELL ══ -->
<div class="shell">
  <main class="main" data-testid="main">

    <!-- Context strip -->
    <!-- One combined line (v0.40): counts · search · funnel ····· conn · roles -->
    <div class="context-strip" data-testid="filter-bar">
      <div class="context-summary" id="context-summary" data-testid="context-summary" aria-live="polite">—</div>
      <label class="filter-search">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="text" id="filter-search" data-testid="filter-search" placeholder="Search name, phone, email…" oninput="onSearchInput(this.value)"/>
      </label>
      <!-- Stacked filters (v0.30, matching the unified inbox): a funnel to the
           right of the search opens one popover with Status / Stage / Procedure /
           Sort by — mirroring the list columns. -->
      <div class="filter-icon-anchor">
        <button class="filter-icon-btn" id="filter-icon-btn" data-testid="filter-icon-btn" onclick="toggleFiltersPopover(event)" aria-haspopup="dialog" aria-expanded="false" aria-label="Open filters">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1.5 3.25 H14.5 L9.75 8.75 V12.75 L6.25 14.25 V8.75 L1.5 3.25 Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" fill="none"/></svg>
          <span class="filter-icon-badge" id="filter-icon-badge" data-testid="filter-icon-badge"></span>
        </button>
        <div class="filters-popover" id="filters-popover" data-testid="filters-popover" role="dialog" aria-label="Filters"></div>
      </div>
      <span class="filter-spacer"></span>
      <span class="conn-status" id="realtime-toggle" data-testid="realtime-toggle" data-state="ok" aria-live="polite"></span>
      <!-- lmspc fork: role switcher removed — this file is patient-coordinator only. -->

    </div>

    <!-- realtime new-leads pill (when not at top of page 1) -->

    <!-- v0.15 — master/detail. Left: the list (top ~6 above the fold).
         Right: the auto-selected lead with a 1-click message composer.
         On mobile the detail pane becomes a slide-over sheet. -->
    <div class="work-area">
      <div class="leads-col">
        <div class="leads-wrap">
          <div class="leads-body" id="leads-body" data-testid="leads-list"></div>
        </div>
      </div>

      <aside class="detail-pane" id="detail-pane" data-testid="lead-detail" aria-label="Selected lead">
        <div class="detail-head">
          <div class="drawer-av" id="d-av">—</div>
          <div class="drawer-head-main">
            <div class="drawer-name" id="d-name">—</div>
            <div class="drawer-sub" id="d-sub">—</div>
            <div class="d-patid" id="d-patid" style="display:none"></div>

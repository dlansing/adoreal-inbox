<script>
/* ═══════════════════════════════════════════════════════════════════════════
   v0.14 — Speed-to-lead leads list. See header comment for the blueprint.
   ═══════════════════════════════════════════════════════════════════════════ */

const VERSION = '0.20';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── deterministic PRNG so the 2,400 seed is stable across reloads ── */
function mulberry32(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ── clock: overridable so tests can freeze it ── */
let NOW_OVERRIDE = null;
function clock(){ return NOW_OVERRIDE != null ? NOW_OVERRIDE : Date.now(); }
const BOOT = Date.now();
const MIN = 60*1000, HR = 60*MIN, DAY = 24*HR;

/* ── reference data ── */
const SOURCES = {
  instagram:{label:'Instagram'}, facebook:{label:'Facebook'}, website:{label:'Website form'},
  katie:{label:'Katie'}, phone:{label:'Phone'}, walkin:{label:'Walk-in'},
  referral:{label:'Referral'}, unknown:{label:'Unknown source'},
};
const PROCEDURES = ['Rhinoplasty','Breast augmentation','Breast lift','Tummy tuck','Liposuction','Facelift','Lip filler','Botox','Eyelid surgery','Mummy makeover','Laser hair removal','Skin resurfacing','Brow lift','Gynecomastia','Mole removal'];
/* rough deal size per procedure (GBP) — drives the per-lead estimated value so
   high-value enquiries stand out. Multi-procedure enquiries sum. */
const PROCEDURE_VALUE = {
  'Rhinoplasty':7500,'Breast augmentation':9000,'Breast lift':8500,'Tummy tuck':9500,
  'Liposuction':6000,'Facelift':12000,'Lip filler':350,'Botox':300,'Eyelid surgery':5000,
  'Mummy makeover':15000,'Laser hair removal':900,'Skin resurfacing':1500,'Brow lift':6500,
  'Gynecomastia':7000,'Mole removal':500,
};
function fmtMoney(v){ return v ? '£'+Number(v).toLocaleString('en-GB') : '—'; }
/* Stages mirror inbox.html exactly (Discover→Long-term) — same vocabulary AND
   same chip colours — so a person's stage reads identically across both tools. */
const STAGES = ['discover','consult','decide','preop','surgery','recover','longterm'];
const STAGE_META = {
  discover:{label:'Discover',  cls:'sp-discover'},
  consult: {label:'Consult',   cls:'sp-consult'},
  decide:  {label:'Decide',    cls:'sp-decide'},
  preop:   {label:'Pre-op',    cls:'sp-preop'},
  surgery: {label:'Surgery',   cls:'sp-surgery'},
  recover: {label:'Recover',   cls:'sp-recover'},
  longterm:{label:'Long-term', cls:'sp-longterm'},
};
const STAGE_LABEL = Object.fromEntries(Object.entries(STAGE_META).map(([k,v]) => [k, v.label]));
function stageChip(l){ const s = STAGE_META[l.stage] || STAGE_META.discover; return `<span class="stage-chip ${s.cls}">${esc(s.label)}</span>`; }
const STATUS_LABEL = {uncontacted:'Uncontacted',in_progress:'In progress',replied:'Replied',snoozed:'Snoozed',closed:'Closed'};
const FIRST=['Emma','Sofia','Laura','Priya','Yuki','Mei','Beatrice','Camille','Charlotte','Ava','Mia','Olivia','Isla','Freya','Nadia','Hannah','Zoe','Lucia','Maya','Chloe','Ruby','Grace','Léa','Anna','Sara','Elena','Nora','Ida','清','Aisha','Fatima','Yasmin','Daniela','Marta','Ingrid','Sophie','Jessica','Jennifer','Megan','Holly','Paige','Tara','Vera','Lena','Romy','Bea','Noor','Lily','Eva','Klara'];
const LAST=['Lindqvist','Andersen','Müller','Nair','Tanaka','Kowalski','Johansson','Olsen','Webb','Reeves','Costa','Khan','Brooks','Park','Mehta','Sjöberg','Rossi','Chen','Vance','Holloway','Pearson','Nguyen','Schmidt','Dubois','Romano','Ahmed','Kaur','Walsh','Petrova','Larsen','Bauer','Fischer','Ivanova','Silva','Moreau','Hansen','Berg','Novak','Haas','Vogel'];

/* ── data-quality codes ── */
const DEFECTS = {
  name_handle:'Name is an Instagram handle, not verified',
  name_partial:'Name looks incomplete',
  name_junk:'Name looks like junk input',
  phone_missing:'No phone number on file',
  phone_partial:'Phone number looks incomplete',
  email_bounced:'Email bounced recently',
  email_missing:'No email on file',
  duplicate:'Possible duplicate of another lead',
  no_consent:'No SMS marketing consent on file',
  interest_blank:'No stated interest',
  source_unknown:'Source could not be determined',
  spam:'Looks like spam',
};

/* ── seed ~2,400 leads deterministically ── */
const TOTAL_SEED = 2400;
let LEADS = [];
let NEXT_ID = 1;

function buildSeed(){
  const rnd = mulberry32(20260519);
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  const chance = p => rnd() < p;
  const out = [];

  /* 9 featured leads map to real inbox threads, placed hot/cooling so the
     demo's clickable rows land on actual conversations in inbox.html. */
  const featured = [
    {inboxPatientId:3,  first:'Charlotte', last:'Webb',       source:'phone',     interest:'Facelift',            ageMs:18*DAY, chan:'sms', status:'replied', stage:'recover'},
    {inboxPatientId:0,  first:'Emma',      last:'Lindqvist',  source:'instagram', interest:'Rhinoplasty',         ageMs:4*MIN,  chan:'wa',  stage:'discover'},
    {inboxPatientId:9,  first:'Yuki',      last:'Tanaka',     source:'referral',  interest:'Eyelid surgery',      ageMs:9*MIN,  chan:'em',  stage:'consult'},
    {inboxPatientId:2,  first:'Laura',     last:'Müller',     source:'instagram', interest:'Tummy tuck',          ageMs:26*MIN, chan:'sms', stage:'discover', interests:['Tummy tuck','Breast augmentation']},
    {inboxPatientId:5,  first:'Priya',     last:'Nair',       source:'referral',  interest:'Liposuction',         ageMs:48*MIN, chan:'em',  stage:'consult'},
    {inboxPatientId:1,  first:'Sofie',     last:'Andersen',   source:'referral',  interest:'Breast augmentation', ageMs:3*HR,   chan:'em',  status:'replied',     stage:'preop'},
    {inboxPatientId:12, first:'Mei',       last:'Kowalski',   source:'facebook',  interest:'Laser hair removal',  ageMs:3*DAY,  chan:'em',  status:'in_progress', stage:'decide',   interests:['Laser hair removal','Lip filler']},
    {inboxPatientId:13, first:'Beatrice',  last:'Johansson',  source:'referral',  interest:'Rhinoplasty',         ageMs:5*DAY,  chan:'wa',  status:'replied',     stage:'surgery'},
    {inboxPatientId:14, first:'Camille',   last:'Olsen',      source:'instagram', interest:'Lip filler',          ageMs:30*DAY, chan:'em',  status:'replied',     stage:'longterm'},
  ];
  for (const f of featured){
    out.push(makeLead(rnd, {
      name:`${f.first} ${f.last}`, nameQuality:'ok', source:f.source, interest:f.interest, interests:f.interests||[f.interest],
      arrivedAt: BOOT - f.ageMs, status: f.status || 'uncontacted', stage: f.stage,
      inboxPatientId:f.inboxPatientId, preferredChannel:f.chan,
      phone:'+1 410 555 '+String(1000+Math.floor(rnd()*8999)), phoneValid:true,
      email:`${f.first.toLowerCase()}.${f.last.toLowerCase().replace(/[^a-z]/g,'')}@gmail.com`, emailStatus:'ok',
      smsConsent:true, clean:true,
    }));
  }

  for (let i = out.length; i < TOTAL_SEED; i++){
    /* age distribution: a few hot, some cooling, many slow/stale, lots contacted */
    const r = rnd();
    let ageMs;
    /* Hot is kept RARE and precious — a clinic with a healthy speed-to-lead
       habit should have only a handful of just-arrived uncontacted leads at
       once. Too many red gutters becomes the alarm the founder rejected. */
    if (r < 0.0016) ageMs = rnd()*5*MIN;             // hot     (~4)
    else if (r < 0.007) ageMs = 5*MIN + rnd()*55*MIN; // cooling (~13)
    else if (r < 0.06) ageMs = HR + rnd()*23*HR;      // slow    (~130)
    else if (r < 0.20) ageMs = DAY + rnd()*40*DAY;    // stale-eligible (~335)
    else ageMs = rnd()*45*DAY;                        // contacted-eligible
    out.push(makeLead(rnd, {arrivedAt: BOOT - ageMs}));
  }
  return out;
}

function makeLead(rnd, over){
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  const chance = p => rnd() < p;
  let first = pick(FIRST), last = pick(LAST);
  let name = `${first} ${last}`, nameQuality = 'ok';
  let source = pick(Object.keys(SOURCES).filter(s=>s!=='unknown'));
  let interest = pick(PROCEDURES);
  // ~22% of people enquire about more than one procedure (e.g. a mummy makeover
  // combo). interest stays the PRIMARY; interests carries the full list.
  let interests = [interest];
  if (chance(0.22)){
    const more = PROCEDURES.filter(p => !interests.includes(p));
    interests.push(more[Math.floor(rnd()*more.length)]);
    if (chance(0.22)){ const more2 = PROCEDURES.filter(p => !interests.includes(p)); interests.push(more2[Math.floor(rnd()*more2.length)]); }
  }
  let phone = '+1 '+pick(['410','305','646','312','617'])+' 555 '+String(1000+Math.floor(rnd()*8999));
  let phoneValid = true;
  let email = `${first.toLowerCase()}.${last.toLowerCase().replace(/[^a-z]/g,'')}@`+pick(['gmail.com','outlook.com','yahoo.com','icloud.com']);
  let emailStatus = 'ok';
  let smsConsent = chance(0.85);
  let status = 'uncontacted';
  let stage = 'discover';
  let duplicateOf = null, isSpam = false;
  const defects = [];

  if (!over || !over.clean){
    /* dirty-data injection (~20% defect rate spread across fields) */
    if (chance(0.10)){ // name issues
      if (chance(0.5)){ name = '@'+first.toLowerCase()+(chance(0.5)?'_':'')+Math.floor(rnd()*99); nameQuality='handle'; defects.push('name_handle'); }
      else if (chance(0.5)){ name = first; nameQuality='partial'; defects.push('name_partial'); }
      else { name = pick(['asdf','test test','aaa','...','—']); nameQuality='junk'; defects.push('name_junk'); }
    }
    if (chance(0.15)){ if (chance(0.5)){ phone=null; phoneValid=false; defects.push('phone_missing'); } else { phone=phone.slice(0,10); phoneValid=false; defects.push('phone_partial'); } }
    if (chance(0.10)){ if (chance(0.6)){ emailStatus='bounced'; defects.push('email_bounced'); } else { email=null; emailStatus='missing'; defects.push('email_missing'); } }
    if (chance(0.18)){ interest=''; interests=[]; defects.push('interest_blank'); }
    if (chance(0.05)){ source='unknown'; defects.push('source_unknown'); }
    if (!smsConsent) defects.push('no_consent');
    if (chance(0.015)){ isSpam=true; name=pick(['asdf','Test test','xxxx']); nameQuality='junk'; defects.push('spam'); }
  } else {
    if (!smsConsent) defects.push('no_consent');
  }

  /* status / stage from age, unless overridden */
  const arrivedAt = over && over.arrivedAt != null ? over.arrivedAt : (BOOT - rnd()*45*DAY);
  const age = BOOT - arrivedAt;
  if (over && over.status){ status = over.status; }
  else if (age > 3*DAY && chance(0.7)){ status = pick(['replied','in_progress','closed','snoozed']); }
  else if (age > DAY && chance(0.35)){ status = pick(['in_progress','replied','snoozed']); }
  // pre-patient leads skew early: most are Discover, a contacted few progress.
  if (status === 'replied' || status === 'closed') stage = pick(['consult','consult','decide','decide','preop']);
  else if (status === 'in_progress') stage = pick(['discover','consult','consult','decide']);
  else if (status === 'snoozed') stage = pick(['discover','consult']);
  else if (chance(0.12)) stage = 'consult'; // a few uncontacted have already booked a consult

  const contacted = (status !== 'uncontacted');
  const lead = Object.assign({
    id: NEXT_ID++,
    inboxPatientId: null,
    name, nameQuality,
    arrivedAt,
    status,
    firstOutboundAt: contacted ? arrivedAt + Math.floor(rnd()*6*HR) : null,
    lastTouchAt: contacted ? arrivedAt + Math.floor(rnd()*12*HR) : null,
    source, interest, interests, stage,
    /* preferred channel tracks the source so messaging suggestions read
       naturally (an Instagram lead → Instagram/WhatsApp, a phone lead → call).
       This is what makes most suggested actions messages, not calls. */
    preferredChannel: ({instagram:'wa', facebook:'wa', website:'em', katie:'wa', referral:'wa', walkin:'sms', phone:'sms', unknown:'em'}[source]) || pick(['wa','em']),
    phone, phoneValid,
    email, emailStatus,
    smsConsent,
    duplicateOf, isSpam,
    defects,
    setup: { accountCreated: chance(0.5), formsReturned: chance(0.35), consultBooked: status==='replied'||status==='closed' ? chance(0.6):chance(0.1) },
    automation: buildAutomation(rnd, status, defects),
  }, over || {});
  // recompute defects if overridden cleanly
  if (over && over.clean){ lead.defects = lead.smsConsent ? [] : ['no_consent']; }
  // estimated value from the final interest set (+ deterministic ±10% by id, so
  // we don't perturb the PRNG sequence). Blank-interest leads show no value.
  lead.value = (lead.interests || []).reduce((s,p) => s + (PROCEDURE_VALUE[p] || 0), 0);
  if (lead.value){ const j = 0.9 + ((threadHash(lead.id) % 21) / 21) * 0.2; lead.value = Math.round(lead.value * j / 50) * 50; }
  return lead;
}

function buildAutomation(rnd, status, defects){
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  // most auto-sends succeed; failures correlate with dirty data
  let state = 'done', delivery = [{channel:'em',status:'delivered'}];
  const tflags = [];
  if (defects.includes('email_bounced')){ delivery=[{channel:'em',status:'bounced'}]; state='failed'; }
  if (defects.includes('no_consent')){ tflags.push('no_consent_held'); state = state==='failed'?'failed':'blocked'; delivery.push({channel:'sms',status:'held'}); }
  if (rnd() < 0.04){ tflags.push('placeholder_unresolved'); state='failed'; }
  if (rnd() < 0.03){ tflags.push('link_blocked'); state='failed'; }
  if (status==='uncontacted' && rnd()<0.3) state='queued';
  return { lastEvent: pick(['Enquiry acknowledgement','Welcome email + SMS','Day-3 nudge','Re-engagement touch','Booking reminder']), state, at: Date.now()-Math.floor(rnd()*3*DAY), delivery, templateFlags:tflags };
}

/* ── pure: urgency tier ── */
function urgencyTier(lead, now){
  now = now || clock();
  if (lead.status !== 'uncontacted' || lead.firstOutboundAt) return 'contacted';
  const age = now - lead.arrivedAt;
  if (age <= 5*MIN) return 'hot';
  if (age <= 60*MIN) return 'cooling';
  if (age <= 24*HR) return 'slow';
  return 'stale';
}
const TIER_RANK = { hot:0, cooling:1, slow:2, stale:3, contacted:4 };

/* ── pure: derived defect list (capped display handled in render) ── */
function defectsOf(lead){ return (lead.defects||[]).map(code => ({code, label: DEFECTS[code] || code})); }

/* ── channel verbs/labels. ig/fb are platform DMs (no SMS consent needed);
   wa/sms are SMS-class and gated on marketing consent (Belcara P0). ── */
const CHANNEL_VERB  = { ig:'Reply on Instagram', fb:'Reply on Messenger', wa:'Send WhatsApp', sms:'Send SMS', em:'Send email', call:'Call now' };
const CHANNEL_LABEL = { ig:'Instagram', fb:'Messenger', wa:'WhatsApp', sms:'SMS', em:'Email', call:'phone' };
const MESSAGE_CHANNELS = ['ig','fb','wa','sms','em'];

/* pure: pick the channel a coordinator should contact this lead on. People
   reply where they came from, so source drives the default; we fall back
   through reachable channels and gate SMS-class transports on consent.
   Result is mostly MESSAGES — calls only where messaging isn't viable. */
function suggestedChannel(lead){
  const canCall  = !!(lead.phone && lead.phoneValid);
  const canSms   = canCall && lead.smsConsent;          // SMS + WhatsApp
  const canEmail = !!(lead.email && lead.emailStatus === 'ok');
  const order = {
    instagram: ['ig','em','wa','call'],
    facebook:  ['fb','em','wa','call'],
    website:   ['em','wa','sms','call'],
    katie:     ['wa','em','sms','call'],
    referral:  ['wa','em','call','sms'],
    walkin:    ['sms','call','em'],
    phone:     ['call','sms','em'],
    unknown:   ['em','wa','call'],
  }[lead.source] || ['em','wa','call'];
  const reachable = ch =>
    ch === 'ig'  ? lead.source === 'instagram' :
    ch === 'fb'  ? lead.source === 'facebook'  :
    ch === 'wa'  ? canSms :
    ch === 'sms' ? canSms :
    ch === 'em'  ? canEmail :
    ch === 'call'? canCall : false;
  for (const ch of order){ if (reachable(ch)) return ch; }
  if (canCall) return 'call';
  return null;
}

function firstName(l){ return (l.name||'there').split(/[\s_]/)[0].replace(/^@/,'') || 'there'; }
function interestsOf(l){ return (l.interests && l.interests.length) ? l.interests : (l.interest ? [l.interest] : []); }
/* "tummy tuck and breast augmentation" / "your treatment" — for message + thread copy */
function interestPhrase(l){ const a = interestsOf(l).map(s=>s.toLowerCase()); return a.length===0 ? 'your treatment' : a.length===1 ? a[0] : a.slice(0,-1).join(', ')+' and '+a[a.length-1]; }

/* ── patient-journey TASKS: recommended next steps that are neither a message
   nor a call. They surface once a person is engaged, matched to where they are
   in the journey. Prototype side-effects live in completeTask(). ── */
const TASK_META = {
  consult:    { label:'Book consultation',           desc:'They’re ready to talk to a surgeon — set up a consultation.',                                       verb:'Book consultation' },
  forms:      { label:'Send health declaration',     desc:'Send the health-declaration link so the surgeon can review their history before the consult.',       verb:'Send declaration' },
  silhouette: { label:'Share Silhouette simulation', desc:'Share a personalised 3D Silhouette simulation so they can picture the result and decide.',           verb:'Open Silhouette' },
};
function nextPatientTask(lead){
  if (lead.status === 'uncontacted') return null;   // first contact is a message, not a task
  // Pre-op onward, the consult + paperwork are already behind them (per the stage
  // meanings) — don't suggest booking a consult or sending forms for those people.
  if (['preop','surgery','recover','longterm'].includes(lead.stage)) return null;
  const s = lead.setup || {};
  if (lead.stage === 'decide' && s.consultBooked && !s.silhouetteShared)
    return { kind:'task', task:'silhouette', label:TASK_META.silhouette.label };
  if (!s.consultBooked)
    return { kind:'task', task:'consult', label:TASK_META.consult.label };
  if (!s.formsReturned && !s.declarationSent)
    return { kind:'task', task:'forms', label:TASK_META.forms.label };
  return null;
}

/* ── pure: suggested next action by role, degrading on dirty data ── */
function suggestedAction(lead, role){
  role = role || 'coordinator';

  if (role === 'support'){
    const a = lead.automation || {};
    if (a.state === 'failed')  return {label:'Open delivery log', kind:'diag'};
    if (a.state === 'blocked') return {label:'Re-run audit', kind:'diag'};
    if (a.state === 'queued')  return {label:'Resume sequence', kind:'diag'};
    return {label:'View delivery log', kind:'diag', ghost:true};
  }

  if (lead.isSpam) return {label:'Dismiss', kind:'dismiss', ghost:true};

  if (role === 'onboarding'){
    if (lead.stage === 'preop')    return {label:'Confirm booking', kind:'convert'};
    if (lead.stage === 'decide')   return {label:'Convert to patient', kind:'convert'};
    if (lead.stage === 'surgery' || lead.stage === 'recover' || lead.stage === 'longterm') return {label:'Open record', kind:'convert'};
    if (lead.status === 'uncontacted') return {label:'Send intro', kind:'em', channel:'em'};
    if (!lead.setup || !lead.setup.formsReturned) return {label:'Send forms', kind:'convert'};
    return {label:'Create account', kind:'convert'};
  }

  /* coordinator */
  if (lead.status === 'uncontacted'){
    // speed-to-lead: reach out on the smart channel (mostly messages, few calls)
    if (urgencyTier(lead) === 'stale') return {label:'Auto follow-up active', kind:'wait'};
    const ch = suggestedChannel(lead);
    if (!ch) return {label:'No reachable channel', kind:'disabled'};
    return { label: CHANNEL_VERB[ch], kind: ch, channel: ch };
  }
  // engaged — recommend the real journey step (a task) when there is one
  const task = nextPatientTask(lead);
  if (task) return task;
  if (lead.status === 'replied') return {label:'Reply now', kind:'reply', channel:lead.preferredChannel};
  if (lead.status === 'closed')  return {label:'Reopen', kind:'reply', ghost:true, channel:lead.preferredChannel};
  if (lead.status === 'snoozed') return {label:'Resume', kind:'reply', ghost:true, channel:lead.preferredChannel};
  const fch = suggestedChannel(lead) || 'em';
  return { label:'Follow up', kind:fch, channel:fch };
}

/* pure: a generated, personalized first message for the composer. Tone is
   tuned per channel (DM/SMS short; email a touch fuller). `variant` rotates
   the opener so "Regenerate" visibly changes the draft. Sentence case. */
function genMessage(lead, channel, variant){
  variant = variant || 0;
  const first = firstName(lead);
  const proc = (lead.interest || '').toLowerCase();
  const about = proc ? `about ${proc}` : `about getting started`;
  const isReply = lead.status !== 'uncontacted';   // they're already in conversation
  if (channel === 'em'){
    const emails = isReply ? [
      `Hi ${first},\n\nThanks for getting back to me — lovely to hear from you. I'm happy to help with the next step whenever you're ready; just say the word and I'll take care of it.\n\nWarmly,\nThe Adoreal team`,
      `Hi ${first},\n\nGreat to hear from you again. Let's keep things moving at a pace that suits you — would you like me to line up the next step now?\n\nWarmly,\nThe Adoreal team`,
    ] : [
      `Hi ${first},\n\nThanks so much for reaching out ${about} — I'd love to help you explore it. We can talk you through what's involved, recovery, and pricing with no pressure at all.\n\nWould a quick call this week suit you, or shall I share a few details here first?\n\nWarmly,\nThe Adoreal team`,
      `Hi ${first},\n\nLovely to hear from you ${about}. Every journey starts with a relaxed, no-obligation chat — we'll answer your questions and only move at your pace.\n\nIs there a day this week that works for a short call?\n\nWarmly,\nThe Adoreal team`,
    ];
    return emails[variant % emails.length];
  }
  const dms = isReply ? [
    `Hi ${first}! Thanks for getting back to me 🤍 Happy to help with the next step — shall I set that up for you?`,
    `Hi ${first}! Lovely to hear from you again. Want me to sort the next step now, or is there anything else I can answer first?`,
  ] : [
    `Hi ${first}! Thanks for reaching out ${about} 🤍 I'd love to help. Are you free for a quick chat, or shall I send a couple of times that work for you?`,
    `Hi ${first}! So glad you got in touch ${about}. No pressure at all — would you like me to share a few options, or is now a good moment for a quick call?`,
  ];
  return dms[variant % dms.length];
}

/* pure: the conversation thread. We synthesise a realistic, deterministic
   history — oldest→newest — so the coordinator can scroll back through the whole
   exchange inline (no need to open the inbox just to read context). The most
   recent messages are stage-coherent (they line up with the recommended next
   step); older ones are earlier touch-points mixed with logged calls + system
   sends, like the live thread. Empty for uncontacted people. */
const THREAD_FILL_OUT = [
  `Just following up — are you still keen to explore your options?`,
  `No rush at all, I'm here whenever you're ready 🤍`,
  `Happy to answer any questions in the meantime.`,
  `Wanted to check this didn't get buried — shall we find a time for a quick chat?`,
  `We've got some availability next week if that helps.`,
];
const THREAD_FILL_IN = [
  `Sorry for the slow reply!`,
  `Thanks — still thinking it over.`,
  `Could you remind me roughly on the pricing?`,
  `Yes, still interested 🙂`,
  `It's been a busy few weeks, apologies.`,
];
const THREAD_FILL_LOG = [
  `Auto welcome email + SMS sent`,
  `Day-3 nudge sent automatically`,
  `Called — no answer, left voicemail`,
  `Re-engagement touch-point sent`,
  `Note: asked to be called back after 5pm`,
];
function threadHash(id){ return (Math.imul(id || 1, 2654435761)) >>> 0; }
function threadTotal(lead){ return 16 + (threadHash(lead.id) % 22); }   // 16..37 messages
/* the most recent, stage-coherent messages (newest last) */
function recentTail(lead){
  const s = lead.setup || {};
  const proc = (interestsOf(lead)[0] || 'your treatment').toLowerCase();
  const m = (dir, text) => ({ dir, text });
  if (lead.stage === 'decide' && s.consultBooked && !s.silhouetteShared)
    return [m('in',`Thank you! I had my consultation and I'm seriously considering going ahead.`),m('out',`That's wonderful to hear. How are you feeling about it so far?`),m('in',`Honestly, I'm just trying to picture what the result might actually look like on me.`),m('out',`Completely understandable — that's the biggest question at this stage.`)];
  if (!s.consultBooked)
    return [m('in',`I'd mainly like to understand the cost and how long recovery takes.`),m('out',`Of course. Pricing is tailored in a consultation, and recovery for ${proc} is usually a week or two. The best next step is a relaxed, no-obligation consult with one of our surgeons.`),m('in',`That sounds good — how do I book one?`)];
  if (!s.formsReturned && !s.declarationSent)
    return [m('in',`Thanks so much — I'm all set for my consultation!`),m('out',`Lovely! Before we meet, we just need your health declaration completed so the surgeon can review your history.`),m('in',`Happy to. Where do I find it?`)];
  return [m('in',`Thank you for the info — that's really helpful.`),m('out',`Any time! Is there anything else I can answer for you?`),m('in',`Not for now — I'll have a think and come back to you.`)];
}
function fullThread(lead){
  if (lead.status === 'uncontacted') return [];
  const f = firstName(lead), phrase = interestPhrase(lead);
  const srcLabel = (SOURCES[lead.source] || SOURCES.unknown).label;
  const m = (dir, text) => ({ dir, text });
  const head = [
    m('log', `Enquiry received via ${srcLabel}`),
    m('in',  `Hi, I saw your page and I'm interested in ${phrase}.`),
    m('out', `Hi ${f}! Thanks for reaching out 🤍 I'd love to help — what would you like to know?`),
  ];
  const tail = recentTail(lead);
  const total = Math.max(head.length + tail.length, threadTotal(lead));
  const fillerN = total - head.length - tail.length;
  const h = threadHash(lead.id);
  const filler = [];
  for (let i = 0; i < fillerN; i++){
    if (i % 4 === 3)      filler.push(m('log', THREAD_FILL_LOG[(h + i) % THREAD_FILL_LOG.length]));
    else if (i % 2 === 0) filler.push(m('out', THREAD_FILL_OUT[(h + i * 3) % THREAD_FILL_OUT.length]));
    else                  filler.push(m('in',  THREAD_FILL_IN[(h + i * 5) % THREAD_FILL_IN.length]));
  }
  return [...head, ...filler, ...tail];
}
function buildThread(lead){ return fullThread(lead); }   // alias for the test surface

/* ── inbox deep-link ── */
function inboxHref(lead, chan){
  if (lead.inboxPatientId == null) return 'inbox.html';
  const c = chan || lead.preferredChannel || 'wa';
  return `inbox.html?patient=${lead.inboxPatientId}&chan=${c}`;
}
function actionHref(lead, act){
  if (act.kind === 'call') return lead.inboxPatientId!=null ? `inbox.html?patient=${lead.inboxPatientId}&action=log-call` : 'inbox.html';
  // message channels (ig/fb/wa/sms/em) — open the inbox on that channel
  if (MESSAGE_CHANNELS.includes(act.kind)) return inboxHref(lead, act.kind);
  if (act.kind === 'reply') return inboxHref(lead, act.channel);
  // Onboarding conversion verbs + Support diagnostic verbs both hand off to
  // the inbox (Support read-only). Without this they rendered dead buttons.
  if (act.kind === 'convert') return inboxHref(lead);
  if (act.kind === 'diag') return lead.inboxPatientId!=null ? `inbox.html?patient=${lead.inboxPatientId}&chan=${lead.preferredChannel||'em'}` : 'inbox.html';
  return null;
}

/* ── formatting ── */
function fmtTimer(lead, now){
  now = now || clock();
  if (lead.status !== 'uncontacted' || lead.firstOutboundAt){
    const t = lead.lastTouchAt || lead.firstOutboundAt || lead.arrivedAt;
    // Only say "replied" when they actually replied; otherwise "contacted".
    const verb = lead.status === 'replied' ? 'replied ' : 'contacted ';
    return { contacted:true, text: verb + fmtShort(now - t) };
  }
  const age = now - lead.arrivedAt;
  if (age <= 5*MIN){ const m=Math.floor(age/MIN), s=Math.floor((age%MIN)/1000); return {contacted:false, text:`${m}m ${String(s).padStart(2,'0')}s`}; }
  return { contacted:false, text: fmtShort(age) };
}
function fmtShort(ms){
  if (ms < MIN) return '<1m';
  if (ms < HR) return Math.floor(ms/MIN)+'m';
  if (ms < DAY) { const h=Math.floor(ms/HR), m=Math.floor((ms%HR)/MIN); return m?`${h}h ${m}m`:`${h}h`; }
  return Math.floor(ms/DAY)+'d';
}
function maskPhone(p){ if(!p) return null; const d=p.replace(/[^\d]/g,''); return p.length>9 ? p.slice(0,9)+' ··· '+d.slice(-2) : p+' …'; }
function initialsOf(lead){ const n=(lead.name||'').replace(/^@/,''); const parts=n.split(/[\s_.]+/).filter(Boolean); if(!parts.length) return '?'; return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase(); }

/* ── state ── */
let role = localStorage.getItem('adoreal_lms_role') || 'coordinator';
let filters = { search:'', urgency:'all', status:'all', source:'all', procedure:'all' };
let page = 1, pageSize = 50;
let realtimeOn = true;
let pendingNew = 0;     // count for the "N new" pill when not at top of page 1
let LEAD_INDEX = new Map();  // id → lead, for O(1) lookups in the 1s tick

/* ── column templates per role (grid-template-columns) ── */
/* One source of truth for each role's grid tracks. Track count MUST equal
   the number of grid children rowHtml emits for that role:
     coordinator (7): gutter person source interest status action end
     onboarding  (9): gutter person source interest status stage setup action end
     support     (6): gutter person source engine action end */
const COLS = {
  // gutter · person · stage · interest · value · [setup] · action · ›
  coordinator: '92px 1.6fr 110px 1.1fr 96px 150px 34px',
  onboarding:  '92px 1.45fr 108px 0.9fr 92px 64px 144px 34px',
  support:     '92px 1.6fr 110px 1.2fr 150px 34px',
};

/* ── filtering + sorting (operates on full LEADS) ── */
function passesFilters(lead){
  const f = filters;
  if (f.urgency !== 'all' && urgencyTier(lead) !== f.urgency) return false;
  if (f.status !== 'all' && lead.status !== f.status) return false;
  if (f.source !== 'all' && lead.source !== f.source) return false;
  if (f.procedure !== 'all' && !interestsOf(lead).includes(f.procedure)) return false;
  if (f.search){
    const q = f.search.toLowerCase();
    const hay = [lead.name, lead.phone, lead.email, lead.interest].map(x=>String(x||'').toLowerCase()).join(' ');
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortedFiltered(){
  const now = clock();
  return LEADS.filter(passesFilters).sort((a,b)=>{
    const ra = TIER_RANK[urgencyTier(a,now)], rb = TIER_RANK[urgencyTier(b,now)];
    if (ra !== rb) return ra - rb;                 // hottest tier first
    return a.arrivedAt - b.arrivedAt;              // within tier: longest-waiting first
  });
}

/* ── render: the whole view ── */
function render(){
  document.body.dataset.role = role;
  document.documentElement.style.setProperty('--cols', COLS[role]);
  renderRoleSwitcher();
  renderHead();
  renderContext();
  renderList();
  syncSelection();   // keep/establish the auto-selected lead in the detail pane
}

function renderRoleSwitcher(){
  document.querySelectorAll('.role-option').forEach(b => b.classList.toggle('active', b.dataset.role === role));
}

function renderHead(){
  let cells;
  if (role === 'onboarding') cells = ['Waiting','','Stage','Interest','<span class="lh-right">Value</span>','Setup','Suggested action',''];
  else if (role === 'support') cells = ['Waiting','','Stage','Last automation','Suggested action',''];
  else cells = ['Waiting','','Stage','Interest','<span class="lh-right">Value</span>','Suggested action',''];
  // --cols is set once in render() from the single COLS source of truth — no override here.
  $('leads-head').innerHTML = cells.map(c => `<span>${c}</span>`).join('');
}

function renderContext(){
  const now = clock();
  const total = LEADS.length;
  const uncontacted = LEADS.filter(l => l.status==='uncontacted' && !l.firstOutboundAt).length;
  const needNow = LEADS.filter(l => urgencyTier(l,now)==='hot').length;
  const fmtN = n => n.toLocaleString('en-US');
  $('context-summary').innerHTML =
    `<span class="cs-strong">${fmtN(total)}</span> people` +
    `<span class="cs-sep">·</span>${fmtN(uncontacted)} uncontacted` +
    `<span class="cs-sep">·</span><span class="cs-now">${needNow} need you now</span>`;
  // pending dropdown mirrors the same source of truth
  $('pending-count').textContent = fmtN(uncontacted);
  $('pending-overdue').textContent = needNow;
  $('pending-dot').classList.toggle('has-pending', needNow > 0);
  $('filter-clear').style.display = (filters.search||filters.urgency!=='all'||filters.status!=='all'||filters.source!=='all'||filters.procedure!=='all') ? '' : 'none';
}

function renderList(){
  const rows = sortedFiltered();
  const totalRows = rows.length;
  const pages = Math.max(1, Math.ceil(totalRows / pageSize));
  if (page > pages) page = pages;
  const start = (page-1)*pageSize;
  const slice = rows.slice(start, start+pageSize);
  const now = clock();

  $('leads-body').innerHTML = slice.length ? slice.map(l => rowHtml(l, now)).join('')
    : `<div style="padding:40px;text-align:center;color:var(--g6)">No leads match these filters.</div>`;
  $('leads-body').querySelectorAll('.lead-row').forEach(r => {
    r.addEventListener('click', e => {
      if (e.target.closest('a,button,select')) return;
      selectLead(parseInt(r.dataset.leadId,10));
    });
  });

  // pagination
  const from = totalRows ? start+1 : 0, to = Math.min(start+pageSize, totalRows);
  $('pagination-summary').textContent = `Showing ${from.toLocaleString('en-US')}–${to.toLocaleString('en-US')} of ${totalRows.toLocaleString('en-US')} people`;
  renderPager(pages);
}

function rowHtml(l, now){
  const tier = urgencyTier(l, now);
  const tm = fmtTimer(l, now);
  const act = suggestedAction(l, role);
  const defs = defectsOf(l);

  // timer cell
  const timerCell = tm.contacted
    ? `<span class="lead-timer contacted" data-testid="lead-urgency-timer"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><polyline points="3,8 6.5,11.5 13,4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>${esc(tm.text)}</span>`
    : `<span class="lead-timer" data-testid="lead-urgency-timer">${esc(tm.text)}</span>`;

  // person sub-line: channel · source · masked contact + at most ONE inline defect chip
  const chips = [];
  if (l.defects.includes('no_consent')) chips.push('<span class="lead-defect-chip consent">no SMS consent</span>');
  else if (l.phone===null) chips.push('<span class="lead-defect-chip">no phone</span>');
  else if (l.duplicateOf || l.defects.includes('duplicate')) chips.push('<span class="lead-defect-chip dupe">possible duplicate</span>');
  const extraDefects = defs.length - (chips.length?1:0);
  const moreChip = extraDefects > 0 && chips.length ? `<span class="lead-defect-chip">${extraDefects} more</span>` : (defs.length>1 && !chips.length ? `<span class="lead-defect-chip">${defs.length} issues</span>` : '');
  const bounce = l.emailStatus==='bounced' ? '<span class="bounce-dot" title="Email bounced"></span>' : '';
  const contact = l.phone ? maskPhone(l.phone) : (l.email && l.emailStatus==='ok' ? l.email : 'no contact');
  // source lives in the detail pane now (founder: "it shows on the right which is
  // enough"); the sub-line keeps just how to reach them.
  const sub = `${bounce}${esc(contact)}`;

  const ints = interestsOf(l);
  const interestCell = role==='support'
    ? `<span class="lead-engine">${engineHtml(l)}</span>`
    : `<span class="lead-interest${ints.length?'':' blank'}" data-testid="lead-interest" title="${esc(ints.join(', '))}">${ints.length ? esc(ints[0]) + (ints.length>1?`<span class="int-more">+${ints.length-1}</span>`:'') : '—'}</span>`;

  // suggested action — QUIET hint in the row (the prominent Send is in the
  // detail pane for the selected lead). Most are messages, few are calls.
  const actEl = actionHintHtml(act);

  // estimated deal size — sales roles (coordinator/onboarding) prioritise by it
  const valueCell = `<span class="lead-value${l.value?'':' none'}" data-testid="lead-value">${fmtMoney(l.value)}</span>`;

  // role-specific middle cells (Status + per-row Reply dropped — both repeated
  // identically and added no signal; the row click opens the reply pane)
  const stageCell = `<span class="lead-stage" data-testid="stage-cell">${stageChip(l)}</span>`;
  let midCells;
  if (role==='onboarding'){
    const setupDots = ['accountCreated','formsReturned','consultBooked'].map(k => `<span class="setup-dot${l.setup&&l.setup[k]?' on':''}"></span>`).join('');
    midCells = stageCell + interestCell + valueCell + `<span class="lead-setup" data-testid="setup-cell">${setupDots}</span>`;
  } else if (role==='support'){
    midCells = stageCell + interestCell;
  } else {
    midCells = stageCell + interestCell + valueCell;
  }

  return `
  <div class="lead-row${l.id===selectedId?' selected':''}" data-lead-id="${l.id}" data-testid="lead-row" data-urgency="${tier}" data-dirty="${l.defects.length?'1':'0'}">
    <span class="lead-gutter">${timerCell}</span>
    <span class="lead-person">
      <span class="lead-av${l.nameQuality==='junk'?' dim':''}">${esc(initialsOf(l))}</span>
      <span class="lead-person-main">
        <span class="lead-name${l.nameQuality!=='ok'?' dirty':''}" data-testid="lead-name">${esc(l.name||'Unknown')}</span>
        <span class="lead-sub">${sub} ${chips.join('')} ${moreChip}</span>
      </span>
    </span>
    ${midCells}
    <span class="lead-action">${actEl}</span>
    <span class="lead-end"><button class="lead-more" onclick="event.stopPropagation();selectLead(${l.id})" aria-label="Open conversation">›</button></span>
  </div>`;
}

/* Quiet per-row action hint (icon + channel/verb). Calls are blue, messages
   nude, wait/disabled muted grey. Non-interactive — the row click selects. */
const TASK_ICON = {
  consult:    '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 6.5h11M5.5 2v2M10.5 2v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
  forms:      '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M4 2.5h5l3 3V13a.5.5 0 0 1-.5.5h-7A.5.5 0 0 1 4 13V3a.5.5 0 0 1 .5-.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 2.5v3h3M6 9h4M6 11h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
  silhouette: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 2.3l1.25 2.95L12.2 6.5 9.25 7.75 8 10.7 6.75 7.75 3.8 6.5l2.95-1.25L8 2.3z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>',
};
function actionHintHtml(act){
  const chat = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 11V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H6l-3 2v-2.5A2 2 0 0 1 3 11z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  const phone = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 3l2 3-1.5 1 4 4 1-1.5L12 12s.5-1 0-1.5L10.5 9l-1.5 1-3-3 1-1.5L5.5 4 4 2.5 3 3z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  if (act.kind==='wait')     return `<span class="sa-hint muted" data-testid="lead-suggested-action">${esc(act.label)}</span>`;
  if (act.kind==='disabled') return `<span class="sa-hint muted" data-testid="lead-suggested-action">${esc(act.label)}</span>`;
  if (act.kind==='call')     return `<span class="sa-hint call" data-testid="lead-suggested-action"><span class="sa-ico">${phone}</span>Call</span>`;
  if (act.kind==='task')     return `<span class="sa-hint task" data-testid="lead-suggested-action"><span class="sa-ico">${TASK_ICON[act.task]||TASK_ICON.consult}</span>${esc(act.label)}</span>`;
  if (MESSAGE_CHANNELS.includes(act.kind)) return `<span class="sa-hint" data-testid="lead-suggested-action"><span class="sa-ico">${chat}</span>${esc(CHANNEL_LABEL[act.kind])}</span>`;
  return `<span class="sa-hint" data-testid="lead-suggested-action">${esc(act.label)}</span>`;
}

function engineHtml(l){
  const a = l.automation || {};
  const cls = a.state==='failed'?'failed':a.state==='blocked'?'blocked':a.state==='firing'?'firing':a.state==='done'?'done':'';
  const label = a.state==='failed'?'Failed':a.state==='blocked'?'Blocked — held':a.state==='queued'?'Queued':a.state==='firing'?'Firing':'Delivered';
  return `<span class="engine-state ${cls}" data-testid="engine-cell"><span class="es-dot"></span><span class="es-txt">${esc(a.lastEvent||'—')} · ${esc(label)}</span></span>`;
}

function renderPager(pages){
  const c = $('pagination-controls');
  const btn = (label, p, opts={}) => `<button class="pg-btn${opts.active?' active':''}" ${opts.disabled?'disabled':''} ${opts.testid?`data-testid="${opts.testid}"`:''} onclick="gotoPage(${p})">${label}</button>`;
  let html = btn('‹ Prev', page-1, {disabled:page<=1});
  const nums = [];
  const add = p => nums.push(btn(String(p), p, {active:p===page}));
  if (pages <= 7){ for(let p=1;p<=pages;p++) add(p); }
  else {
    add(1);
    if (page > 3) nums.push('<span class="pg-ellipsis">…</span>');
    for (let p=Math.max(2,page-1); p<=Math.min(pages-1,page+1); p++) add(p);
    if (page < pages-2) nums.push('<span class="pg-ellipsis">…</span>');
    add(pages);
  }
  html += nums.join('');
  html += btn('Next ›', page+1, {disabled:page>=pages, testid:'pagination-next'});
  html += `<select class="pg-size" data-testid="pagination-page-size" onchange="setPageSize(this.value)">
    ${[25,50,100].map(s=>`<option value="${s}" ${s===pageSize?'selected':''}>${s} / page</option>`).join('')}</select>`;
  c.innerHTML = html;
}

/* ── interactions ── */
function gotoPage(p){ page = p; pendingNew = 0; updateNewPill(); renderList(); $('leads-body').scrollTop = 0; }
function setPageSize(v){ pageSize = parseInt(v,10); page = 1; renderList(); }
function onSearchInput(v){ filters.search = v.trim(); page = 1; render(); }
function onFilterChange(key, v){ filters[key] = v; page = 1; document.getElementById('filter-'+key+'-pill').classList.toggle('active', v!=='all'); render(); }
function clearFilters(){ filters = {search:'',urgency:'all',status:'all',source:'all',procedure:'all'}; $('filter-search').value=''; ['urgency','status','source','procedure'].forEach(k=>{$('filter-'+k).value='all'; document.getElementById('filter-'+k+'-pill').classList.remove('active');}); page=1; render(); }
function filterToHot(){ filters.urgency='hot'; $('filter-urgency').value='hot'; document.getElementById('filter-urgency-pill').classList.add('active'); page=1; render(); }

function setRole(r){
  role = r;
  localStorage.setItem('adoreal_lms_role', r);
  /* Reset filters on role change so a filter set in one role never silently
     persists (hidden state) into another — keeps the "one honest list" promise. */
  filters = { search:'', urgency:'all', status:'all', source:'all', procedure:'all' };
  const s = $('filter-search'); if (s) s.value = '';
  ['urgency','status','source','procedure'].forEach(k => { const el=$('filter-'+k); if(el) el.value='all'; const pill=document.getElementById('filter-'+k+'-pill'); if(pill) pill.classList.remove('active'); });
  page = 1;
  render();
}

/* ── realtime ── */
function toggleRealtime(){
  realtimeOn = !realtimeOn;
  const t = $('realtime-toggle');
  t.classList.toggle('live', realtimeOn);
  t.classList.toggle('paused', !realtimeOn);
  $('realtime-label').textContent = realtimeOn ? 'Live' : 'Paused';
  if (realtimeOn) scheduleArrival();
}
let arrivalTimer = null, arrivalsSoFar = 0;
function scheduleArrival(){
  clearTimeout(arrivalTimer);
  if (!realtimeOn || NOW_OVERRIDE != null) return;
  // first arrival ~5s; opening burst 12–20s for the first ~2min; then back off ~45s
  let delay;
  if (arrivalsSoFar === 0) delay = 5000;
  else if (arrivalsSoFar < 8) delay = 12000 + Math.random()*8000;
  else delay = 40000 + Math.random()*15000;
  arrivalTimer = setTimeout(() => { spawnArrival(); arrivalsSoFar++; scheduleArrival(); }, delay);
}
function spawnArrival(){
  const rnd = Math.random;
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  const dirty = rnd() < 0.2;  // match the ~20% seed defect rate — quality shouldn't appear to decay live
  const first = pick(FIRST), last = pick(LAST);
  const lead = makeLead(mulberry32(Math.floor(rnd()*1e9)), {
    arrivedAt: Date.now(), status:'uncontacted', clean: !dirty,
    name: dirty && rnd()<0.5 ? '@'+first.toLowerCase()+Math.floor(rnd()*99) : `${first} ${last}`,
    nameQuality: dirty && rnd()<0.5 ? 'handle':'ok',
    source: pick(['instagram','facebook','website','katie','phone','referral']),
  });
  LEADS.unshift(lead);
  LEAD_INDEX.set(lead.id, lead);
  const onTopP1 = (page === 1);
  // toast
  showToast(`New lead — ${lead.name} via ${(SOURCES[lead.source]||{}).label} · just now`, lead.id);
  if (onTopP1 && passesFilters(lead)){
    renderList();
    const el = $('leads-body').querySelector(`.lead-row[data-lead-id="${lead.id}"]`);
    if (el){ el.style.animation = 'none'; el.style.background = 'var(--p2)'; setTimeout(()=>{ el.style.transition='background 2.5s ease'; el.style.background=''; }, 30); }
  } else {
    pendingNew++; updateNewPill();
  }
  renderContext();
}
function updateNewPill(){ const p=$('new-leads-pill'); $('new-leads-count').textContent=pendingNew; p.classList.toggle('show', pendingNew>0); }
function showNewLeads(){ page=1; pendingNew=0; updateNewPill(); render(); $('leads-body').scrollTop=0; }

/* ── lightweight toast ── */
let toastTimer2=null;
function showToast(msg, leadId){
  let t = $('lms-toast');
  if (!t){ t=document.createElement('div'); t.id='lms-toast'; t.setAttribute('data-testid','lms-toast');
    t.style.cssText='position:fixed;left:20px;bottom:20px;background:var(--white);border:1px solid var(--p4);border-radius:var(--r8);box-shadow:0 6px 24px rgba(52,47,44,.14);padding:12px 16px;font-size:13px;color:var(--text-primary);z-index:400;max-width:320px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s';
    document.body.appendChild(t); }
  t.innerHTML = esc(msg);
  requestAnimationFrame(()=>{ t.style.opacity='1'; t.style.transform='translateY(0)'; });
  clearTimeout(toastTimer2);
  toastTimer2 = setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(8px)'; }, 6000);
}

/* ── live timer tick ── */
let tickTimer = null;
function startTick(){ clearInterval(tickTimer); if (NOW_OVERRIDE != null) return; tickTimer = setInterval(tick, 1000); }
function tick(){
  const now = clock();
  // update only rendered rows' timers + tier (cheap: <= pageSize nodes).
  // O(1) id lookup via LEAD_INDEX so the per-second tick stays flat as the
  // dataset grows past 2,400 with realtime arrivals.
  $('leads-body').querySelectorAll('.lead-row').forEach(r => {
    const l = LEAD_INDEX.get(parseInt(r.dataset.leadId,10));
    if (!l) return;
    const tier = urgencyTier(l, now);
    if (r.dataset.urgency !== tier) r.dataset.urgency = tier;
    const chip = r.querySelector('.lead-timer');
    if (chip && !chip.classList.contains('contacted')){
      chip.textContent = fmtTimer(l, now).text;
      // per-minute "pop": when the displayed minute ticks over on a lead that's
      // still racing the clock (hot/cooling), flash the timer darker-red for ~1s
      // so it catches the eye (founder request). Skipped on first sight of a row
      // so a fresh page load doesn't burst-pop every timer at once.
      const min = Math.floor((now - l.arrivedAt) / 60000);
      const prev = chip.dataset.min;
      if (prev !== undefined && prev !== String(min) && (tier === 'hot' || tier === 'cooling')){
        chip.classList.remove('pop');
        void chip.offsetWidth;          // restart the animation if mid-flight
        chip.classList.add('pop');
        setTimeout(() => { chip.classList.remove('pop'); }, 1000);
      }
      chip.dataset.min = String(min);
    }
  });
  renderContext();
}

/* ── drawer ── */
/* ── selection + detail pane (v0.15) ── */
let selectedId = null;
let composerChan = null;   // channel the composer is currently sending on
let composerDraft = '';    // current (possibly edited) draft text
let regenCount = 0;
let threadShown = 0;       // how many of the thread's messages are rendered (grows on scroll-up)
let threadLeadId = null;   // which lead the thread is currently showing
const TIER_LABEL = { hot:'Needs you now', cooling:'Cooling', slow:'Waiting', stale:'Stale lead', contacted:'Contacted' };

/* Reachable channels for the channel switcher in the composer. */
function reachableChannels(l){
  const out = [];
  if (l.source==='instagram') out.push('ig');
  if (l.source==='facebook')  out.push('fb');
  if (l.phone && l.phoneValid && l.smsConsent){ out.push('wa'); out.push('sms'); }
  if (l.email && l.emailStatus==='ok') out.push('em');
  if (l.phone && l.phoneValid) out.push('call');
  return [...new Set(out)];
}

/* reset the composer to the lead's suggested channel + a fresh draft */
function initComposer(l){
  const act = suggestedAction(l, role);
  // tasks / wait / disabled have no composer — the detail pane shows a task card or note
  if (act.kind === 'task' || act.kind === 'wait' || act.kind === 'disabled' || act.kind === 'dismiss'){
    composerChan = null; composerDraft = ''; regenCount = 0; return;
  }
  let want = act.channel || (act.kind === 'call' ? 'call' : (MESSAGE_CHANNELS.includes(act.kind) ? act.kind : 'em'));
  if (want !== 'call'){
    // never open the composer on an unreachable channel (e.g. a WhatsApp
    // preferred-channel for someone with no SMS consent) — clamp to a reachable one
    const reach = reachableChannels(l).filter(c => c !== 'call');
    if (!reach.includes(want)) want = (reach.includes(suggestedChannel(l)) ? suggestedChannel(l) : reach[0]) || 'call';
  }
  composerChan = want;
  regenCount = 0;
  composerDraft = composerChan === 'call' ? '' : genMessage(l, composerChan, regenCount);
}
function highlightSelected(){
  document.querySelectorAll('.lead-row').forEach(r => r.classList.toggle('selected', parseInt(r.dataset.leadId,10) === selectedId));
}

function selectLead(id){
  const l = LEADS.find(x => x.id === id);
  if (!l) return;
  selectedId = id;
  highlightSelected();
  initComposer(l);
  renderDetail(l);
  if (window.innerWidth < 1024){ $('detail-pane').classList.add('open'); $('detail-scrim').classList.add('open'); }
}

/* keep a selection in sync after list re-renders; auto-select the top lead
   (hottest, longest-waiting) if none selected or it scrolled out of view */
function syncSelection(){
  const rows = sortedFiltered();
  if (!rows.length){ selectedId = null; renderDetailEmpty(); return; }
  if (selectedId == null || !rows.some(l => l.id === selectedId)) selectedId = rows[0].id;
  const l = LEADS.find(x => x.id === selectedId);
  highlightSelected();
  if (l){ initComposer(l); renderDetail(l); }
}

function renderDetailEmpty(){
  $('d-av').textContent = '—'; $('d-name').textContent = 'No lead selected'; $('d-sub').textContent = '';
  $('detail-body').innerHTML = `<div class="detail-empty">Select a lead to see details and reply in one click.</div>`;
}

function closeDetail(){ $('detail-pane').classList.remove('open'); $('detail-scrim').classList.remove('open'); }

/* subtle inbox hand-off (header link) — the in-pane scroll is the primary way to
   read history now, so this is a convenience, not the way to "see more". */
function openThreadLink(l, chan){
  return `<a class="th-inbox" href="${inboxHref(l, chan)}" data-testid="detail-open-thread">Open in inbox ↗</a>`;
}
/* most recent inbound message — what the person last said (drives the reply
   header + the "why this action" rationale) */
function lastInboundText(l){
  const all = fullThread(l);
  for (let i = all.length - 1; i >= 0; i--){ if (all[i].dir === 'in') return all[i].text; }
  return '';
}
/* one message → HTML. Patient/clinic are bubbles; logged calls + system touch-
   points are quiet centred lines. */
const THREAD_LOG_ICO = '<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.6" fill="currentColor"/></svg>';
function threadMsgHtml(x){
  if (x.dir === 'log') return `<div class="th-msg log"><span class="th-log"><span class="th-logico">${THREAD_LOG_ICO}</span>${esc(x.text)}</span></div>`;
  return `<div class="th-msg ${x.dir}"><div class="th-bubble">${esc(x.text)}</div></div>`;
}
/* render the last `shown` messages (oldest→newest); a top control loads more */
function threadBubbles(l, shown){
  const all = fullThread(l);
  const start = Math.max(0, all.length - shown);
  const top = start === 0 ? `<div class="th-start">Start of conversation</div>`
                          : `<button type="button" class="th-loadmore" onclick="loadEarlierThread()">Load earlier messages</button>`;
  return top + all.slice(start).map(threadMsgHtml).join('');
}
/* load an older page of messages (button or scroll-up), keeping the view anchored */
function loadEarlierThread(){
  const l = LEADS.find(x => x.id === selectedId); if (!l) return;
  const sc = document.getElementById('thread-scroll'); if (!sc) return;
  const all = fullThread(l);
  if (threadShown >= all.length) return;
  const prevH = sc.scrollHeight;
  threadShown = Math.min(all.length, threadShown + 8);
  sc.innerHTML = threadBubbles(l, threadShown);
  sc.scrollTop = sc.scrollHeight - prevH;
}
/* the conversation thread — shows the most recent messages; older load by
   scrolling up or via the button (no "open full conversation" required) */
function threadHtml(l){
  const all = fullThread(l);
  if (!all.length) return '';
  if (threadLeadId !== l.id || !threadShown){ threadLeadId = l.id; threadShown = Math.min(all.length, 8); }
  const chan = CHANNEL_LABEL[l.preferredChannel] || 'message';
  return `<div class="thread" data-testid="thread">
    <div class="thread-head">
      <span class="th-title">Conversation</span>
      <span class="th-meta">via ${esc(chan)} · ${all.length} messages</span>
      ${openThreadLink(l, l.preferredChannel)}
    </div>
    <div class="thread-scroll" id="thread-scroll" data-testid="thread-scroll">${threadBubbles(l, threadShown)}</div>
  </div>`;
}
/* after the detail pane renders, pin the thread to the newest message and lazy-
   load older ones as the coordinator scrolls up */
function wireThreadScroll(l){
  const sc = document.getElementById('thread-scroll');
  if (!sc) return;
  sc.scrollTop = sc.scrollHeight;          // newest message in view
  sc.addEventListener('scroll', () => {
    if (sc.scrollTop <= 40) loadEarlierThread();
  });
}
/* channel selector — pill + caret dropdown, copied from inbox.html's compose-chan */
function chanDetail(l, c){
  if (c === 'em') return (l.email && l.emailStatus === 'ok') ? l.email : 'no email';
  if (c === 'wa' || c === 'sms') return l.phone ? maskPhone(l.phone) : 'no phone';
  if (c === 'ig') return 'Instagram DM';
  if (c === 'fb') return 'Messenger';
  return '';
}
function chanSelectorHtml(l){
  const chans = reachableChannels(l).filter(c => c !== 'call');
  const cur = composerChan;
  const items = chans.map(c =>
    `<div class="chan-dd-item${c===cur?' active':''}" onclick="event.stopPropagation();setComposerChan('${c}')">
       <span class="dd-dot cdot-${c}"></span><span class="dd-label">${esc(CHANNEL_LABEL[c])}</span><span class="dd-detail">${esc(chanDetail(l,c))}</span>
     </div>`).join('');
  return `<div class="chan-selector">
    <button type="button" class="compose-chan" id="chan-pill" onclick="event.stopPropagation();toggleChanMenu()">
      <span class="cdot cdot-${cur}"></span>
      <span data-testid="composer-channel">${esc(CHANNEL_LABEL[cur])}</span>
      <span class="chevron"><svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
    <div class="chan-dropdown" id="chan-menu" data-testid="chan-menu">
      <div class="chan-dd-label">Send via</div>
      ${items}
    </div>
  </div>`;
}
function toggleChanMenu(){
  const dd = document.getElementById('chan-menu'), pill = document.getElementById('chan-pill');
  if (!dd) return;
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open); pill.classList.toggle('open', open);
}
function closeChanMenu(){ const dd=document.getElementById('chan-menu'), pill=document.getElementById('chan-pill'); if(dd)dd.classList.remove('open'); if(pill)pill.classList.remove('open'); }
document.addEventListener('click', e => { if (!e.target.closest('.chan-selector')) closeChanMenu(); });

/* the 1-click message composer (first outreach OR reply). The "Sending via X"
   label is gone — the channel is an inbox-style pill+caret in the foot. */
function composerHtml(l, verb){
  const note = l.defects.includes('no_consent') ? 'SMS held — no consent on file' : (l.emailStatus==='bounced' ? 'Email bounced — using another channel' : '');
  const replyTo = l.status !== 'uncontacted'
    ? `<div class="reply-to" data-testid="reply-to">Replying to <strong>${esc(firstName(l))}</strong>: “${esc(lastInboundText(l))}”</div>` : '';
  return `<div class="composer" data-testid="composer">
    ${replyTo}
    <textarea id="composer-text" data-testid="composer-text" oninput="composerDraft=this.value">${esc(composerDraft)}</textarea>
    <div class="composer-foot">
      ${chanSelectorHtml(l)}
      <button class="composer-send" data-testid="composer-send" onclick="sendGenerated()">${esc(verb||'Send')}</button>
      <button class="composer-regen" onclick="regenMessage()">Regenerate</button>
      ${note?`<span class="composer-note">${esc(note)}</span>`:''}
    </div>
  </div>`;
}
function callCardHtml(l){
  return `<div class="sec-title">Call this lead</div>
    <div class="kv"><span class="kv-k">Number</span><span class="kv-v">${esc(l.phone||'—')}</span></div>
    <div class="drawer-actions">
      <a class="sa-btn" href="${actionHref(l,{kind:'call'})}" data-testid="composer-send">Call now</a>
      ${l.email&&l.emailStatus==='ok'?`<button class="sa-btn ghost" onclick="setComposerChan('em')">Send a message instead</button>`:''}
    </div>`;
}
/* why we're recommending this task — grounded in the person's most recent message */
function taskReason(task, l){
  const f = firstName(l);
  if (task === 'consult')    return `${f} is asking how to get started — set up the consultation now.`;
  if (task === 'forms')      return `Their consult is lined up — send the health declaration so the surgeon can review it first.`;
  if (task === 'silhouette') return `${f} wants to picture the result before committing — a 3D simulation is the unblocker.`;
  return '';
}
/* a recommended patient-journey task (book consult / health declaration / Silhouette) */
function taskCardHtml(l, act){
  const meta = TASK_META[act.task] || {};
  const q = lastInboundText(l);
  const why = `<div class="tc-why" data-testid="task-why">${q?`<span class="tc-why-msg">“${esc(q)}”</span>`:''}${esc(taskReason(act.task, l))}</div>`;
  return `<div class="task-card" data-testid="task-card">
    <span class="tc-ico">${TASK_ICON[act.task]||TASK_ICON.consult}</span>
    <div class="tc-body">
      <div class="tc-title">${esc(meta.label||act.label)}</div>
      <div class="tc-desc">${esc(meta.desc||'')}</div>
      <div class="tc-actions">
        <button class="sa-btn" data-testid="task-do" onclick="completeTask('${act.task}')">${esc(meta.verb||act.label)}</button>
        <a class="sa-btn ghost" href="${inboxHref(l, l.preferredChannel)}" data-testid="task-message">Message ${esc(firstName(l))}</a>
      </div>
      ${why}
    </div>
  </div>`;
}
/* prototype side-effect of acting on a task: confirm + advance the journey one
   step, then re-render the same lead so the NEXT step surfaces. */
function completeTask(task){
  const l = LEADS.find(x => x.id === selectedId); if (!l) return;
  const f = firstName(l);
  const chan = CHANNEL_LABEL[l.preferredChannel] || 'message';
  l.setup = l.setup || {};
  if (task === 'consult'){ l.setup.consultBooked = true; showToast(`Consultation booked for ${f} · invite sent`); }
  else if (task === 'forms'){ l.setup.declarationSent = true; showToast(`Health declaration sent to ${f} via ${chan}`); }
  else if (task === 'silhouette'){ l.setup.silhouetteShared = true; showToast(`Silhouette simulation shared with ${f}`); }
  l.lastTouchAt = clock();
  renderList(); renderContext();
  initComposer(l); renderDetail(l);   // stay on this lead; surface the next step
}

function renderDetail(l){
  const src = SOURCES[l.source] || SOURCES.unknown;
  const tier = urgencyTier(l);
  const tm = fmtTimer(l);
  $('d-av').textContent = initialsOf(l);
  $('d-name').textContent = l.name || 'Unknown';
  $('d-sub').textContent = `${TIER_LABEL[tier]} · ${tm.contacted ? tm.text : 'waiting ' + tm.text} · ${src.label}`;
  const defs = defectsOf(l);
  let body = '';

  if (role === 'coordinator'){
    const act = suggestedAction(l, role);
    if (l.status === 'uncontacted'){
      // speed-to-lead: the 1-click composer (or a call card / quiet note). No
      // conversation yet, so no thread / inbox link.
      if (composerChan === 'call') body += callCardHtml(l);
      else if (composerChan)       body += composerHtml(l, 'Send');
      else                         body += `<div class="detail-sent">${esc(act.label)}</div>`;
    } else {
      // engaged: show the recent conversation for context, THEN the next step
      body += threadHtml(l);                          // carries the Open-full-conversation link
      if (act.kind === 'task')          body += taskCardHtml(l, act);
      else if (composerChan === 'call') body += callCardHtml(l);
      else if (composerChan)            body += composerHtml(l, 'Send reply');
    }
  } else {
    // onboarding / support primary action
    const act = suggestedAction(l, role);
    const aHref = actionHref(l, act);
    body += `<div class="drawer-actions">`;
    if (act.kind!=='wait' && act.kind!=='disabled' && act.kind!=='dismiss')
      body += aHref ? `<a class="sa-btn" href="${aHref}" data-testid="detail-primary">${esc(act.label)}</a>` : `<span class="sa-disabled">${esc(act.label)}</span>`;
    body += `<a class="sa-btn ghost" href="${inboxHref(l)}" data-testid="detail-open-thread">Open conversation →</a></div>`;
  }

  // shared: key facts
  body += `<div class="sec-title">Lead details</div><div class="kv">
    <span class="kv-k">Waiting</span><span class="kv-v">${esc(tm.contacted ? tm.text : tm.text)}</span>
    <span class="kv-k">Stage</span><span class="kv-v">${stageChip(l)}</span>
    <span class="kv-k">Source</span><span class="kv-v">${esc(src.label)}</span>
    <span class="kv-k">Interest</span><span class="kv-v">${esc(interestsOf(l).join(', ')||'—')}</span>
    <span class="kv-k">Est. value</span><span class="kv-v">${fmtMoney(l.value)}</span>
    <span class="kv-k">Phone</span><span class="kv-v">${esc(l.phone||'—')}</span>
    <span class="kv-k">Email</span><span class="kv-v">${esc(l.email||'—')}${l.emailStatus==='bounced'?' (bounced)':''}</span>
    <span class="kv-k">SMS consent</span><span class="kv-v">${l.smsConsent?'On file':'Not captured'}</span>
  </div>`;

  // shared: data quality
  body += `<div class="sec-title">Data quality</div><div class="dq-list" data-testid="dq-list">`;
  body += defs.length ? defs.map(d => `<div class="dq-item"><span class="dq-dot"></span>${esc(d.label)}</div>`).join('')
                      : `<div class="dq-item clean">No issues detected on this lead.</div>`;
  body += `</div>`;

  // support extras
  if (role === 'support'){
    const a = l.automation || {};
    body += `<div class="sec-title">Delivery log</div><div class="dlog" data-testid="delivery-log">`;
    body += `<div class="dlog-row ${a.state==='failed'?'fail':'ok'}"><span>${esc(a.lastEvent||'—')}</span><span class="dl-state">${esc(a.state||'—')}</span></div>`;
    const CHAN = {em:'Email', wa:'WhatsApp', sms:'SMS', ig:'Instagram', fb:'Messenger'};
    (a.delivery||[]).forEach(d => { body += `<div class="dlog-row ${d.status==='delivered'?'ok':d.status==='bounced'?'fail':''}"><span>${esc(CHAN[d.channel]||d.channel)}</span><span class="dl-state">${esc(d.status)}</span></div>`; });
    body += `</div>`;
    if ((a.templateFlags||[]).length){
      const fl = {placeholder_unresolved:'Placeholder unresolved', link_blocked:'Non-whitelisted link blocked', no_consent_held:'No SMS consent — outbound held'};
      body += `<div class="sec-title">Template safety</div><div style="margin-bottom:18px">${a.templateFlags.map(f=>`<span class="tflag">${esc(fl[f]||f)}</span>`).join('')}</div>`;
    }
  }

  $('detail-body').innerHTML = body;
  wireThreadScroll(l);   // pin thread to newest + enable scroll-up lazy load
}

function setComposerChan(ch){
  const l = LEADS.find(x => x.id === selectedId); if (!l) return;
  composerChan = ch;
  regenCount = 0;
  composerDraft = ch === 'call' ? '' : genMessage(l, ch, regenCount);
  renderDetail(l);
}
function regenMessage(){
  const l = LEADS.find(x => x.id === selectedId); if (!l) return;
  regenCount++;
  composerDraft = genMessage(l, composerChan, regenCount);
  const ta = $('composer-text'); if (ta) ta.value = composerDraft;
}
function sendGenerated(){
  const l = LEADS.find(x => x.id === selectedId); if (!l) return;
  const label = CHANNEL_LABEL[composerChan] || 'message';
  const first = firstName(l);
  const wasUncontacted = l.status === 'uncontacted';
  // simulate the send: the lead is now in conversation and drops out of "hot"
  l.status = 'in_progress'; if (!l.firstOutboundAt) l.firstOutboundAt = clock(); l.lastTouchAt = clock();
  showToast(`${wasUncontacted ? 'Sent' : 'Reply sent'} via ${label} to ${first} · in conversation`);
  renderList(); renderContext();
  if (window.innerWidth < 1024){ closeDetail(); selectedId = null; return; }
  // desktop: advance to the next lead that still needs a human — the speed loop
  const rows = sortedFiltered();
  const next = rows.find(x => x.status === 'uncontacted') || rows[0];
  if (next) selectLead(next.id); else { selectedId = null; renderDetailEmpty(); }
}

/* ── pending dropdown / version / nav stubs (chrome) ── */
function togglePendingMenu(e){ e&&e.stopPropagation(); const m=$('pending-menu'),b=$('pending-btn'); const o=m.classList.toggle('open'); b.setAttribute('aria-expanded',o?'true':'false'); }
function closePendingMenu(){ $('pending-menu').classList.remove('open'); $('pending-btn').setAttribute('aria-expanded','false'); }
document.addEventListener('click', e => { const m=$('pending-menu'); if(m&&m.classList.contains('open')&&!e.target.closest('.pending-anchor')) closePendingMenu(); });
let toastTimer=null;
function showVersion(){ $('version-toast-num').textContent='v'+VERSION; $('version-toast').classList.add('visible'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('version-toast').classList.remove('visible'),2400); }
function stubNav(name){ alert(`${name} — lives in the broader Adoreal product. Stubbed in the LMS prototype.`); }

/* ── boot ── */
LEADS = buildSeed();
LEAD_INDEX = new Map(LEADS.map(l => [l.id, l]));
document.addEventListener('DOMContentLoaded', () => {
  $('version-toast-num').textContent = 'v'+VERSION;
  // populate the Procedure filter from the canonical procedure list
  const pf = $('filter-procedure');
  if (pf) PROCEDURES.slice().sort().forEach(p => { const o=document.createElement('option'); o.value=p; o.textContent=p; pf.appendChild(o); });
  render();
  startTick();
  scheduleArrival();
  document.addEventListener('keydown', e => { if (e.key==='Escape'){ closeDetail(); closePendingMenu(); } });
});

/* ── test surface ── */
window.__lms = {
  VERSION,
  SOURCES, PROCEDURES, STAGES, DEFECTS,
  urgencyTier, suggestedAction, suggestedChannel, nextPatientTask, buildThread, genMessage, defectsOf, fmtTimer,
  get role(){ return role; }, setRole,
  get leads(){ return LEADS; },
  get selectedId(){ return selectedId; }, selectLead, sendGenerated, setComposerChan,
  get page(){ return page; }, get pageSize(){ return pageSize; },
  gotoPage, setPageSize, sortedFiltered,
  /* freeze the clock + stop intervals + arrivals for deterministic tests */
  freezeForTest(fixedNow){
    NOW_OVERRIDE = fixedNow != null ? fixedNow : BOOT;
    realtimeOn = false; clearTimeout(arrivalTimer); clearInterval(tickTimer);
    const t=$('realtime-toggle'); if(t){ t.classList.remove('live'); t.classList.add('paused'); $('realtime-label').textContent='Paused'; }
    render();
  },
  spawnArrival,   // tests can trigger a deterministic-ish arrival
  tick,                          // run one realtime tick against the current rows
  get now(){ return clock(); },  // current (frozen) clock value
  setNow(t){ NOW_OVERRIDE = t; },// advance the (frozen) clock WITHOUT re-rendering rows — for pop tests
};
</script>
</body>
</html>

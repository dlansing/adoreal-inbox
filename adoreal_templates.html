/* ---------- tokens (measured off the live app) ---------- */
:root{
  --black:#342F2C;
  --white:#FFFFFF;
  --bg:#FEF7F5;
  --brown:#965E47;
  --nude:#E1A991;
  --pink:#F4E7E3;
  --hue3:#E7CDC6;
  --grey:#6D635D;
  --g3:#EBEAEA;
  --g6:#787878;
  --green:#7AC558;
  --green-soft:#E4F2DA;
  --green-ink:#3D6B29;
  --yellow:#F4C569;
  --red:#CB4137;
  --r4:4px;
  --r8:8px;
  --r20:20px;
  --shadow:0 2px 2px rgba(0,0,0,.09);
  --font:'Proxima Nova','Mulish','Nunito Sans','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--black);
  font-family:var(--font); font-size:16px; line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer; border:0; background:none; color:inherit}
input,textarea,select{font-family:inherit; color:inherit}
a{color:var(--brown); text-decoration:none}

/* ---------- top bar ---------- */
.topbar{
  height:64px; background:var(--white); display:flex; align-items:center;
  gap:24px; padding:0 36px; position:sticky; top:0; z-index:40;
  box-shadow:0 1px 0 rgba(52,47,44,.07);
}
.wordmark{
  font-family:'DM Serif Display',Georgia,serif; font-size:28px;
  color:var(--black); letter-spacing:-.01em; user-select:none;
}
.topsearch{
  display:flex; align-items:center; gap:10px; height:40px; flex:0 1 405px; min-width:150px;
  border:1px solid var(--hue3); border-radius:var(--r20); padding:0 18px;
  background:var(--white); color:var(--grey);
}
.topsearch .icon-search-md{font-size:18px; color:var(--nude)}
.topsearch input{border:0; outline:0; flex:1; font-size:16px; background:transparent}
.topsearch input::placeholder{color:var(--grey)}
.topnav{display:flex; align-items:center; gap:34px; margin-left:auto; white-space:nowrap}
.topnav a,.topnav span{font-size:16px; color:var(--grey)}
.topnav a{cursor:pointer}
.topnav a:hover{color:var(--black)}
.topnav span{cursor:default}
.topnav a.is-active{color:var(--brown); font-weight:600}
.topicons{display:flex; align-items:center; gap:18px}
.topicons button{font-size:22px; color:var(--grey); display:grid; place-items:center; width:28px; height:28px}
.topicons button:hover{color:var(--black)}
.topicons button.is-active{color:var(--brown)}
.userchip{
  display:flex; align-items:center; gap:10px; font-size:16px; color:var(--black);
  white-space:nowrap; flex:none; cursor:pointer; padding:4px 10px 4px 4px;
  border-radius:var(--r20); transition:background .15s;
}
.userchip:hover{background:var(--bg)}
.avatar{
  width:32px; height:32px; border-radius:50%;
  background:linear-gradient(135deg,var(--brown),var(--nude));
  display:grid; place-items:center; color:var(--white);
  font-size:12px; font-weight:700; letter-spacing:.02em;
}
.userchip .icon-chevron-down{font-size:14px; color:var(--grey)}

/* Version toast — anchored to the user chip. The settings gear used to own
   this, but the gear is now a real destination (this prototype IS settings),
   so the build stamp moved to the chip to match index.html / lms.html. */
.version-anchor{position:relative; display:flex; align-items:center}
.version-toast{
  position:absolute; top:calc(100% + 8px); right:0; background:var(--white);
  border:1px solid var(--hue3); border-radius:var(--r8); padding:8px 14px;
  box-shadow:0 6px 20px rgba(52,47,44,.12); display:flex; align-items:center;
  gap:8px; font-size:12px; white-space:nowrap; opacity:0;
  transform:translateY(-4px); pointer-events:none;
  transition:opacity .15s, transform .15s; z-index:1000;
}
.version-toast.visible{opacity:1; transform:translateY(0); pointer-events:auto}
.version-toast-label{color:var(--grey); font-weight:500}
.version-toast-num{color:var(--brown); font-weight:600; font-variant-numeric:tabular-nums}
@media (max-width:1024px){ .version-toast{display:none} }

/* ---------- page shell ---------- */
.page{max-width:1456px; margin:0 auto; padding:24px 36px 80px}
.crumbs{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--grey)}
.crumbs a{color:var(--brown)}
.crumbs a:hover{text-decoration:underline}
.crumbs span.sep{color:var(--grey); opacity:.7}
.pagehead{display:flex; align-items:center; gap:16px; margin:18px 0 24px}
.backbtn{
  width:36px; height:36px; border-radius:50%; background:var(--white);
  box-shadow:var(--shadow); display:grid; place-items:center;
  font-size:16px; color:var(--black); flex:none;
}
.backbtn:hover{background:var(--pink)}
h1{font-size:28px; font-weight:500; margin:0; letter-spacing:normal}
.h2{font-size:28px; font-weight:500; margin:0}
.sub{font-size:16px; line-height:24px; color:var(--black); margin:8px 0 0}

/* ---------- cards ---------- */
.card{background:var(--white); border-radius:var(--r8); box-shadow:var(--shadow)}
.layout{display:flex; align-items:flex-start; gap:24px}
.menucard{width:280px; flex:none; padding:16px}
.contentcard{flex:1; min-width:0; padding:48px}

/* ---------- left menu ---------- */
.menuitem{
  display:flex; align-items:center; justify-content:space-between;
  width:100%; min-height:40px; padding:8px 16px; border-radius:var(--r8);
  font-size:14px; color:var(--black); text-align:left;
}
.menuitem + .menuitem{margin-top:8px}
.menuitem:hover{background:rgba(244,231,227,.5)}
.menuitem.is-active{background:var(--pink)}
.menuitem .icon-plus{font-size:15px; color:var(--black); opacity:.85}
.menuitem .plus{
  width:24px; height:24px; display:grid; place-items:center;
  border-radius:50%; flex:none; margin-left:10px;
}
.menuitem .plus:hover{background:rgba(52,47,44,.08)}
.menuitem .lbl{display:flex; align-items:center; gap:9px; min-width:0; white-space:nowrap}
.menuitem .lbl .badge-new{
  font-size:11px; line-height:1; padding:3px 6px; border-radius:var(--r4);
  background:var(--pink); color:var(--brown); flex:none;
}
.menugroup{
  font-size:12px; color:var(--g6); padding:10px 16px 6px;
  letter-spacing:.02em;
}
.menusplit{height:1px; background:var(--g3); margin:10px 16px 0}

/* ---------- toolbar ---------- */
.toolbar{display:flex; align-items:center; gap:16px; margin:24px 0 0; flex-wrap:wrap}
.searchbox{
  display:flex; align-items:center; gap:10px; height:40px; flex:1; min-width:240px; max-width:560px;
  border:1px solid var(--hue3); border-radius:var(--r20); padding:0 18px; background:var(--white);
}
.searchbox .icon-search-md{font-size:18px; color:var(--nude)}
.searchbox input{border:0; outline:0; flex:1; font-size:16px; background:transparent}
.searchbox input::placeholder{color:var(--grey)}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:40px; padding:0 16px; border-radius:var(--r20);
  font-size:14px; font-weight:400; letter-spacing:.5px; white-space:nowrap;
}
.btn-primary{background:var(--black); color:var(--white)}
.btn-primary:hover{background:#231F1D}
.btn-ghost{border:1px solid var(--hue3); color:var(--black); background:var(--white)}
.btn-ghost:hover{background:var(--pink)}
.btn-quiet{color:var(--grey); padding:0 12px}
.btn-quiet:hover{color:var(--black)}
.btn-danger{color:var(--red); border:1px solid rgba(203,65,55,.35); background:var(--white)}
.btn-danger:hover{background:rgba(203,65,55,.06)}
.btn .icon-plus{font-size:15px}
.btn[disabled]{opacity:.45; cursor:not-allowed}

/* ---------- table ---------- */
.tbl{width:100%; border-collapse:collapse; margin-top:28px; table-layout:fixed}
.tbl th{
  text-align:left; font-size:16px; font-weight:400; color:var(--black);
  padding:0 12px 16px; border-bottom:1px solid var(--g3); white-space:nowrap;
}
.tbl td{padding:14px 12px; font-size:14px; vertical-align:middle; border-bottom:1px solid rgba(0,0,0,.12); overflow-wrap:break-word}
.tbl tbody tr:nth-child(even){background:#F9F9F9}
.tbl tbody tr:hover{background:var(--pink)}
.tbl td.tname{font-size:14px; color:var(--black)}
.tbl td.tname .st{display:block; font-size:13px; color:var(--grey); margin-top:3px; line-height:1.35}
.tbl td.tdate{color:var(--black); white-space:nowrap}
.tbl td.tright{text-align:right; width:1%; white-space:nowrap}
.tbl td.tmuted{color:var(--grey); font-size:13px}
.gobtn{
  width:58px; height:30px; border-radius:var(--r20); border:1px solid var(--brown);
  color:var(--brown); display:inline-grid; place-items:center; font-size:15px; background:transparent;
}
.gobtn:hover{background:var(--brown); color:var(--white)}

/* ---------- pills / tags ---------- */
.pill{
  display:inline-flex; align-items:center; gap:6px;
  font-size:14px; padding:5px 8px; border-radius:var(--r4); white-space:nowrap;
}
.pill-created{background:rgba(122,197,88,.6); border:1px solid var(--green); color:var(--black)}
.pill-active{background:rgba(122,197,88,.6); border:1px solid var(--green); color:var(--black)}
.pill-paused{background:rgba(52,47,44,.05); border:1px solid var(--hue3); color:var(--grey)}
.pill-draft{background:rgba(244,197,105,.22); border:1px solid var(--yellow); color:#7A5A16}
.tag{
  display:inline-flex; align-items:center; gap:6px;
  font-size:14px; padding:3px 9px; border-radius:var(--r4);
  background:rgba(66,66,66,.08); border:1px solid rgba(66,66,66,.28); color:#424242;
  white-space:nowrap;
}
.tag.is-care{background:rgba(225,169,145,.16); border-color:var(--nude); color:var(--brown)}
.tag.is-empty{opacity:.5}
.tagrow{display:flex; flex-wrap:wrap; gap:6px}
.tagmore{font-size:14px; color:var(--grey)}
.locflags{display:flex; flex-wrap:wrap; gap:4px 5px; font-size:15px; line-height:1.2; max-width:96px}

/* ---------- toggle ---------- */
.switch{width:42px; height:24px; border-radius:12px; background:var(--hue3); position:relative; flex:none; transition:background .15s}
.switch:after{
  content:''; position:absolute; top:3px; left:3px; width:18px; height:18px;
  border-radius:50%; background:var(--white); transition:transform .15s;
  box-shadow:0 1px 2px rgba(0,0,0,.2);
}
.switch.is-on{background:var(--black)}
.switch.is-on:after{transform:translateX(18px)}
.switchrow{display:flex; align-items:center; gap:10px}
.switchrow .lbl{font-size:14px; color:var(--grey)}

/* ---------- detail / editor ---------- */
.detailhead{display:flex; align-items:flex-start; gap:16px; margin-bottom:8px}
.detailhead .grow{flex:1; min-width:0}
.detailactions{display:flex; align-items:center; gap:10px; flex:none}
.field{margin-top:24px}
.field > label{display:block; font-size:14px; color:var(--grey); margin-bottom:8px}
.field .hint{font-size:13px; color:var(--g6); margin-top:7px; line-height:1.45}
.inp{
  width:100%; height:44px; border:1px solid var(--hue3); border-radius:var(--r8);
  padding:0 14px; font-size:16px; background:var(--white); outline:0;
}
.inp:focus{border-color:var(--brown)}
textarea.inp{height:auto; min-height:132px; padding:12px 14px; line-height:1.5; resize:vertical}
select.inp{appearance:none; background-image:none; padding-right:38px}
.selwrap{position:relative}
.selwrap .icon-chevron-down{position:absolute; right:14px; top:15px; font-size:14px; color:var(--grey); pointer-events:none}
.row2{display:flex; gap:16px; flex-wrap:wrap}
.row2 > *{flex:1; min-width:200px}
/* the trigger row is four unequal controls; keep them on one line */
.row2-trigger > *:nth-child(1){flex:2 1 230px; min-width:230px}
.row2-trigger > *:nth-child(2){flex:0 1 100px; min-width:90px}
.row2-trigger > *:nth-child(3){flex:0 1 130px; min-width:120px}
.row2-trigger > *:nth-child(4){flex:0 1 130px; min-width:120px}

.tokenbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px}
.tokenbar .lbl{font-size:13px; color:var(--g6)}
.token{
  font-size:13px; padding:3px 9px; border-radius:var(--r4);
  background:var(--pink); color:var(--brown); border:1px solid var(--hue3);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.token:hover{background:var(--hue3)}

.tpick{display:flex; flex-wrap:wrap; gap:8px}
.tpick .opt{
  font-size:14px; padding:6px 12px; border-radius:var(--r20);
  border:1px solid var(--hue3); background:var(--white); color:var(--black);
}
.tpick .opt:hover{background:var(--pink)}
.tpick .opt.is-on{background:var(--black); color:var(--white); border-color:var(--black)}
.tpick .opt.is-on.is-care{background:var(--brown); border-color:var(--brown)}
.tpick .grouplbl{
  width:100%; font-size:12px; color:var(--g6); margin:12px 0 -2px;
}
.tpick .grouplbl:first-child{margin-top:0}

/* locale tabs */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--g3); margin-top:8px; flex-wrap:wrap}
.tabs .tab{
  display:flex; align-items:center; gap:7px; padding:10px 14px;
  font-size:14px; color:var(--grey); border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tabs .tab:hover{color:var(--black)}
.tabs .tab.is-on{color:var(--black); border-bottom-color:var(--brown); font-weight:600}
.tabs .tab .dot{width:6px; height:6px; border-radius:50%; background:var(--yellow)}

/* preview bubble */
.previewwrap{
  margin-top:16px; background:rgba(52,47,44,.028); border-radius:var(--r8);
  padding:20px; border:1px solid var(--g3);
}
.previewwrap .plbl{font-size:13px; color:var(--g6); margin-bottom:12px; display:flex; align-items:center; gap:7px}
.bubble{
  background:var(--white); border-radius:14px; padding:14px 16px; max-width:420px;
  font-size:15px; line-height:1.5; box-shadow:0 1px 2px rgba(0,0,0,.07);
  white-space:pre-wrap; word-break:break-word;
}
.bubble .tk{color:var(--brown); background:var(--pink); border-radius:3px; padding:0 3px}
.bubble .lk{color:var(--brown); text-decoration:underline}
.charcount{font-size:13px; color:var(--g6); margin-top:10px}
.charcount b{font-weight:600; color:var(--black)}
.charcount .warn{color:var(--red)}
.charcount code{background:rgba(203,65,55,.1); border-radius:3px; padding:0 4px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px}

/* context preview panel */
.ctxpanel{margin-top:40px; border-top:1px solid var(--g3); padding-top:32px}
.ctxpanel h3{font-size:20px; font-weight:500; margin:0}
.ctxgrid{display:flex; gap:24px; margin-top:20px; align-items:flex-start}
.ctxleft{width:230px; flex:none}
.ctxleft .opt{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  width:100%; padding:9px 12px; border-radius:var(--r8); font-size:14px;
  color:var(--black); text-align:left;
}
.ctxleft .opt:hover{background:var(--pink)}
.ctxleft .opt.is-on{background:var(--pink)}
.ctxleft .opt .n{font-size:13px; color:var(--grey)}
.ctxleft .opt.is-zero .n{color:var(--red)}
.ctxright{flex:1; min-width:0; background:rgba(52,47,44,.028); border:1px solid var(--g3); border-radius:var(--r8); padding:20px}
.ctxright .ctxhead{font-size:16px; margin-bottom:4px}
.ctxright .ctxsub{font-size:13px; color:var(--g6); margin-bottom:16px}
.ctxitem{background:var(--white); border-radius:var(--r8); padding:14px 16px; margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ctxitem .t{font-size:15px; margin-bottom:5px}
.ctxitem .b{font-size:14px; color:var(--grey); line-height:1.5}
.ctxempty{
  background:rgba(203,65,55,.05); border:1px dashed rgba(203,65,55,.4);
  border-radius:var(--r8); padding:20px; font-size:14px; color:var(--black);
}

/* empty state */
.empty{padding:48px 0; text-align:center; color:var(--grey); font-size:16px}

/* trigger summary line */
.trigline{display:flex; align-items:flex-start; gap:8px; font-size:14px; color:var(--black); line-height:1.35}
.trigline .icon{margin-top:1px}
.trigline .icon{font-size:16px; color:var(--brown)}
.trigline .off{color:var(--grey)}

/* ---------- modal ---------- */
.scrim{
  position:fixed; inset:0; background:rgba(52,47,44,.4); z-index:60;
  display:grid; place-items:center; padding:24px;
}
.modal{
  background:var(--white); border-radius:var(--r8); box-shadow:0 12px 40px rgba(0,0,0,.22);
  width:100%; max-width:460px; padding:32px;
}
.modal h3{margin:0 0 10px; font-size:22px; font-weight:500}
.modal p{margin:0; font-size:15px; line-height:1.55; color:var(--grey)}
.modal .acts{display:flex; justify-content:flex-end; gap:10px; margin-top:28px}
.modal .confirmbox{margin-top:20px}

/* overflow menu */
.omenu{position:relative}
.omenu .obtn{
  width:36px; height:36px; border-radius:50%; display:grid; place-items:center;
  font-size:18px; color:var(--grey);
}
.omenu .obtn:hover{background:rgba(52,47,44,.07); color:var(--black)}
.omenu .olist{
  position:absolute; right:0; top:42px; background:var(--white); border-radius:var(--r8);
  box-shadow:0 8px 24px rgba(0,0,0,.16); padding:6px; min-width:190px; z-index:20;
}
.omenu .olist button{
  display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px;
  border-radius:6px; font-size:14px; text-align:left; color:var(--black);
}
.omenu .olist button:hover{background:var(--pink)}
.omenu .olist button.danger{color:var(--red)}
.omenu .olist button.danger:hover{background:rgba(203,65,55,.07)}

/* settings landing */
.setgrid{display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap}
.setcol{flex:1; min-width:320px; padding:48px}
.setcol h2{font-size:24px; font-weight:500; margin:0 0 28px}
.setlink{display:block; margin-bottom:22px}
.setlink .t{display:block; font-size:16px; color:var(--brown)}
.setlink .d{display:block; font-size:14px; color:var(--grey); margin-top:2px; line-height:1.4}
.setlink:hover .t{text-decoration:underline}
.sethead{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px}
.setdiv{height:1px; background:var(--g3); margin:0 0 22px}

/* ---------- prototype notes ---------- */
.notesbtn{
  position:fixed; right:24px; bottom:24px; z-index:50;
  display:flex; align-items:center; gap:9px; height:44px; padding:0 20px;
  border-radius:var(--r20); background:var(--black); color:var(--white);
  font-size:14px; letter-spacing:.5px; box-shadow:0 6px 20px rgba(0,0,0,.24);
}
.notesbtn .cnt{
  background:var(--nude); color:var(--black); border-radius:10px;
  font-size:12px; padding:1px 7px; font-weight:600;
}
.notespanel{
  position:fixed; right:24px; bottom:80px; z-index:55; width:430px; max-width:calc(100vw - 48px);
  max-height:70vh; overflow:auto; background:var(--white); border-radius:var(--r8);
  box-shadow:0 12px 40px rgba(0,0,0,.22); padding:24px;
}
.notespanel h3{margin:0 0 4px; font-size:20px; font-weight:500}
.notespanel .nsub{font-size:13px; color:var(--g6); margin-bottom:18px}
.note{border-top:1px solid var(--g3); padding:14px 0}
.note:last-child{padding-bottom:0}
.note .nt{font-size:14px; font-weight:600; display:flex; gap:8px; align-items:flex-start}
.note .nb{font-size:14px; color:var(--grey); line-height:1.55; margin-top:5px}
.note .k{
  font-size:11px; padding:2px 6px; border-radius:var(--r4); flex:none; margin-top:1px;
  letter-spacing:.02em;
}
.k-q{background:rgba(244,197,105,.28); color:#7A5A16}
.k-a{background:var(--pink); color:var(--brown)}
.k-g{background:rgba(203,65,55,.1); color:var(--red)}

@media (max-width:1400px){
  .topbar{gap:18px}
  .topnav{gap:24px}
}
@media (max-width:1180px){
  .topnav{gap:18px}
  .topsearch{flex:0 1 240px}
}
@media (max-width:960px){
  .layout{flex-direction:column}
  .menucard{width:100%}
  .contentcard{padding:28px; width:100%}
  .ctxgrid{flex-direction:column}
  .ctxleft{width:100%}
  .topsearch,.topnav{display:none}
}
</style>

<div id="app"></div>

<script>
/* ============================================================
   1. DATA
   ============================================================ */

/* Touch-points are the tag axis for message templates.

   The opportunity-side touch-points come from the canonical
   Journeys-Workflows cadence (Vanessa Castro). The care-side ones are
   marked `proposed` — the cadence document only covers lead nurture, but
   20 of the 35 seeded templates are post-booking and would otherwise have
   nowhere to hang. Care-side names need sign-off. */
const TOUCHPOINTS = [
  {id:'enquiry',        label:'Enquiry received', group:'Opportunity', detail:'Touch 1 — instant welcome, T+10 min, system'},
  {id:'followup-1',     label:'Follow-up 1',      group:'Opportunity', detail:'Touches 1b–3a — T+24h through T+5d'},
  {id:'followup-2',     label:'Follow-up 2',      group:'Opportunity', detail:'Touches 4a–5b — adds educational content'},
  {id:'followup-3',     label:'Follow-up 3',      group:'Opportunity', detail:'Touches 6–7 — repeats the contact-5 pattern'},
  {id:'in-conversation',label:'In conversation',  group:'Opportunity', detail:'Person has replied — automation pauses here'},
  {id:'last-attempt',   label:'Last attempt',     group:'Opportunity', detail:'Touch 8 — T+7d final task'},
  {id:'gone-cold',      label:'Gone cold',        group:'Opportunity', detail:'Touch 9 + 24h — reached automatically'},
  {id:'consultation',   label:'Consultation',     group:'Care', proposed:true, detail:'Consultation booked through post-consult'},
  {id:'pre-op',         label:'Pre-op',           group:'Care', proposed:true, detail:'Deposit paid through 48h before surgery'},
  {id:'surgery',        label:'Surgery',          group:'Care', proposed:true, detail:'Day of procedure'},
  {id:'recovery',       label:'Recovery',         group:'Care', proposed:true, detail:'Day 1 through post-op review'},
  {id:'long-term',      label:'Long-term',        group:'Care', proposed:true, detail:'6 months onward, referrals, reviews'},
];
const TP = {}; TOUCHPOINTS.forEach(t => TP[t.id] = t);

/* Message templates — seeded from STAGE_TEMPLATES in
   adoreal_unified_inbox_v0_43.html, with the tokens migrated from that
   prototype's single-brace style to the {{PascalCase}} syntax the Figma
   SMS copy already uses. One syntax across both surfaces. */
const MSG_TEMPLATES = [
  {id:'m01', title:'Welcome — first reply', subtitle:'Warm acknowledgement of a brand-new enquiry', tags:['enquiry'], updated:'2026-07-28',
   body:"Hi {{FirstName}}, lovely to hear from you! Thanks so much for reaching out about {{Procedure}}. {{Provider}} would be delighted to chat with you. Do you have any questions I can help with right away, or would you like to book a free consultation?"},
  {id:'m02', title:'Free consultation offer', subtitle:'Leads with the no-obligation consult', tags:['enquiry','followup-1'], updated:'2026-07-28',
   body:"Hi {{FirstName}}, our initial consultations are completely free and no-obligation. You'd meet with {{Provider}} for around 45 minutes — plenty of time to talk through your goals and any questions. Would a weekday morning or afternoon suit you better?"},
  {id:'m03', title:'Procedure overview', subtitle:'Answers "tell me more" without over-promising', tags:['followup-1','in-conversation'], updated:'2026-07-24',
   body:"Hi {{FirstName}}, happy to share more about {{Procedure}}. {{Provider}} performs this regularly with excellent results. The best place to start is a free consultation where we can talk through what's involved and tailor it to you. Want me to send some availability?"},
  {id:'m04', title:'Recovery time question', subtitle:'Ballpark timeline, defers specifics to the consult', tags:['in-conversation'], updated:'2026-07-24',
   body:"Hi {{FirstName}}, recovery for {{Procedure}} is typically 1–2 weeks for light activity and 4–6 weeks before full exertion. {{Provider}} will give you a precise timeline based on your specific situation during your consultation."},
  {id:'m05', title:'Pricing inquiry — general range', subtitle:'Handles price questions without quoting a number', tags:['followup-1','in-conversation'], updated:'2026-07-22',
   body:"Hi {{FirstName}}, pricing for {{Procedure}} varies depending on the specifics of your case. {{Provider}} will give you an exact quote at your consultation. We also have interest-free financing partners if that would help — happy to share more."},

  {id:'m06', title:'Confirm consultation', subtitle:'Confirmation plus pre-consult form nudge', tags:['consultation'], updated:'2026-07-30',
   body:"Hi {{FirstName}}, just confirming your consultation with {{Provider}} — we're really looking forward to meeting you. Please remember to complete your pre-consultation form beforehand if you haven't already."},
  {id:'m07', title:'Pre-consultation form reminder', subtitle:'Chase an outstanding pre-consult form', tags:['consultation'], updated:'2026-07-30',
   body:"Hi {{FirstName}}, a quick reminder to fill out your pre-consultation form before your appointment with {{Provider}}. It only takes 5 minutes and helps us prepare. Let me know if you can't find the link!"},
  {id:'m08', title:'Bring a partner / family', subtitle:'Reassurance that guests are welcome', tags:['consultation','in-conversation'], updated:'2026-07-18',
   body:"Hi {{FirstName}}, of course — partners or family are absolutely welcome to join your consultation. {{Provider}} finds it really helpful when patients have someone with them to talk things through afterwards."},
  {id:'m09', title:'Day-of logistics', subtitle:'Arrival time, what to bring, how long', tags:['consultation'], updated:'2026-07-18',
   body:"Hi {{FirstName}}, for your visit: please arrive 10 minutes early, bring a list of any current medications, and allow about 90 minutes total. We'll have everything else ready. See you soon!"},
  {id:'m10', title:'Post-consultation thank-you', subtitle:'No-pressure close after the consult', tags:['consultation','followup-2'], updated:'2026-07-16',
   body:"Hi {{FirstName}}, thank you so much for coming in. {{Provider}} really enjoyed meeting you. There's no rush at all — take whatever time you need to think things through. We're here whenever you're ready with questions or to take the next step."},

  {id:'m11', title:'Gentle decision check-in', subtitle:'Low-pressure nudge after the consult', tags:['followup-2'], updated:'2026-07-14',
   body:"Hi {{FirstName}}, hope you've been well! Just a friendly check-in after your consultation with {{Provider}} — no pressure at all. If anything has come up or you'd like to talk through anything further, I'm here."},

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* dd.mm.yyyy — matches the Service forms "Last updated" column */
function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

/* Highlight {{Token}} merge fields and bare links inside a preview bubble. */
function renderBody(text){
  let out = esc(text);
  out = out.replace(/\{\{[A-Za-z]+\}\}/g, m => `<span class="tk">${m}</span>`);
  out = out.replace(/(https?:\/\/[^\s<]+|\bmy\.adoreal\.com\b)/g, m => `<span class="lk">${m}</span>`);
  return out;
}

/* SMS segment maths — 160 GSM-7 chars, 70 if any non-GSM character.
   Merge tokens are counted at their literal length, which understates the
   real send; flagged as an open question in the notes panel. */
function smsInfo(text){
  const GSM = /[\x20-\x7E\n\r@£$¥èéùìòÇØøÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ¤¡ÄÖÑÜ§¿äöñüà]/;
  const offenders = [...new Set([...text].filter(ch => !GSM.test(ch)))];
  const unicode = offenders.length > 0;
  const per = unicode ? 70 : 160;
  const len = text.length;
  return {len, per, unicode, offenders, segments: Math.max(1, Math.ceil(len / per))};
}

function offsetLabel(a){
  if (!a.offsetValue) return 'Immediately';
  return `${a.offsetValue} ${a.offsetUnit} ${a.offsetDir}`;
}

function tagChips(tags, max){
  const shown = max ? tags.slice(0, max) : tags;
  const rest = max ? tags.length - shown.length : 0;
  let h = `<div class="tagrow">` + shown.map(id => {
    const t = TP[id];
    if (!t) return '';
    return `<span class="tag${t.group === 'Care' ? ' is-care' : ''}">${esc(t.label)}</span>`;
  }).join('');
  if (rest > 0) h += `<span class="tagmore">+${rest}</span>`;
  if (!tags.length) h += `<span class="tag is-empty">Untagged</span>`;
  return h + `</div>`;
}

/* Prototype build stamp. Lives on the user chip rather than the settings gear,
   because in this prototype the gear is a real destination. Reads the meta tag
   so the version has exactly one home in the file. */
function toggleVersion(){
  const toast = document.getElementById('version-toast');
  const num   = document.getElementById('version-toast-num');
  if (!toast || !num) return;
  if (!toast.dataset.rendered) {
    const meta = document.querySelector('meta[name="adoreal-prototype-version"]');
    num.textContent = 'v' + ((meta && meta.content) || '?');
    toast.dataset.rendered = '1';
  }
  toast.classList.toggle('visible');
}

function toast(msg){
  state.toast = msg;
  render();
  setTimeout(() => { state.toast = null; render(); }, 2200);
}

    <div class="menusplit"></div>
    <div class="menugroup">New in this prototype</div>
    ${added.map(item).join('')}

}

/* The payoff of tagging: what the inbox composer would offer. */

  const cur = TP[state.ctxTouchpoint];
  const matching = msgs.filter(m => m.tags.includes(state.ctxTouchpoint));

  const opt = t => `
    <button class="opt${t.id === state.ctxTouchpoint ? ' is-on' : ''}${counts[t.id] === 0 ? ' is-zero' : ''}"
            onclick="state.ctxTouchpoint='${t.id}'; render()">

    <p class="sub" style="font-size:14px; color:var(--g6)">

function countLine(text){
  const s = smsInfo(text);
  const over = s.segments > 1;
  let line = `<b>${s.len}</b> characters ·
    <span class="${over ? 'warn' : ''}">${s.segments} SMS segment${s.segments > 1 ? 's' : ''}</span>
    · ${s.per}-char limit`;
  if (s.unicode) {
    line += ` <span class="warn">— dropped to unicode by
      ${s.offenders.map(c => `<code>${esc(c)}</code>`).join(' ')}</span>`;
  }
  return line;
}

        <div class="nt">
          <span class="k k-${n.k}">${n.k === 'q' ? 'question' : n.k === 'a' ? 'assumption' : 'gap'}</span>
          <span>${esc(n.t)}</span>
        </div>
        <div class="nb">${esc(n.b)}</div>
      </div>`).join('')}
  </div>` : ''}
  <button class="notesbtn" onclick="state.notesOpen=!state.notesOpen; render()">
    <i class="icon-${state.notesOpen ? 'x-close' : 'info-circle'}"></i>
    Prototype notes <span class="cnt">${q} open</span>
  </button>`;
}

function toastUI(){
  if (!state.toast) return '';
  return `<div style="position:fixed; left:50%; transform:translateX(-50%); bottom:32px; z-index:70;
    background:var(--black); color:var(--white); padding:12px 22px; border-radius:var(--r20);
    font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.28)">${esc(state.toast)}</div>`;
}

/* ============================================================
   6. ACTIONS
   ============================================================ */
function toggleTag(mid, tid){
  const m = findMsg(mid);
  const i = m.tags.indexOf(tid);
  if (i >= 0) m.tags.splice(i, 1); else m.tags.push(tid);
  render();
}
function insertToken(fieldId, token, mid){
  const el = document.getElementById(fieldId);
  const s = el.selectionStart, e = el.selectionEnd;
  el.value = el.value.slice(0, s) + token + el.value.slice(e);
  findMsg(mid).body = el.value;
  el.focus();
  el.setSelectionRange(s + token.length, s + token.length);
  refreshPreview(mid);
}
function refreshPreview(mid){
  const m = findMsg(mid);
  const p = document.getElementById('msg-preview');
  const c = document.getElementById('msg-count');
  if (p) p.innerHTML = renderBody(m.body);
  if (c) c.innerHTML = countLine(m.body);
}
function saveMsg(id){
  findMsg(id).updated = new Date().toISOString().slice(0, 10);
  toast('Template saved');
  go('#/templates/message-template-list');
}
function createMsg(){
  const id = 'm' + (msgs.length + 1).toString().padStart(2, '0');
  msgs.unshift({id, title:'Untitled template', subtitle:'', tags:[], body:'',
                updated:new Date().toISOString().slice(0, 10)});
  go('#/templates/message-template/' + id);
}
function duplicateMsg(id){
  const m = findMsg(id);
  const nid = 'm' + Date.now().toString().slice(-5);
  msgs.unshift({...m, id:nid, title:m.title + ' (copy)', tags:[...m.tags],
                updated:new Date().toISOString().slice(0, 10)});
  state.openMenu = null;
  toast('Duplicated');
  go('#/templates/message-template/' + nid);
}
function doDeleteMsg(id){
  const i = msgs.findIndex(m => m.id === id);
  if (i >= 0) msgs.splice(i, 1);
  state.confirmDelete = null;
  toast('Template deleted');
  go('#/templates/message-template-list');
}
function toggleAuto(id){
  const a = findAuto(id);
  a.on = !a.on;
  render();
}
function setAutoEvent(id, ev){
  const a = findAuto(id);
  a.event = ev;
  if (!EV[ev].beforeOk) a.offsetDir = 'after';
  render();
}
function setAutoOffset(id, key, val){
  const a = findAuto(id);
  a[key] = (key === 'offsetValue') ? Math.max(0, parseInt(val, 10) || 0) : val;
  render();
}
function setAutoBody(id, loc, val){
  findAuto(id).body[loc] = val;
  // Preview updates on the next render; avoid re-rendering per keystroke.
  const w = document.querySelectorAll('.previewwrap .bubble');
  if (w.length) w[w.length - 1].innerHTML = renderBody(val);
  const c = document.querySelectorAll('.charcount');
  if (c.length) c[c.length - 1].innerHTML = countLine(val);
}
function saveAuto(id){
  findAuto(id).updated = new Date().toISOString().slice(0, 10);
  toast('Automated message saved');
  go('#/templates/automated-message-list');
}
function addFromMenu(secId){
  if (secId === 'message-templates') { go('#/templates/message-template-list'); createMsg(); return; }
  const sec = SECTIONS.find(s => s.id === secId);
  if (secId === 'automated-messages') { go(sec.route); toast('Automated messages are system defaults — nothing to add'); return; }
  go(sec.route);
}
/* Keep the caret in the search field across re-render. */
function focusSearch(which){
  const el = document.querySelector('.searchbox input');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

/* ============================================================
   7. ROUTER
   ============================================================ */
function render(){
  const h = state.route;
  let view;

  const mDetail = h.match(/^#\/templates\/message-template\/(.+)$/);
  const aDetail = h.match(/^#\/templates\/automated-message\/(.+)$/);

  if (h === '#/settings')                                  view = viewSettings();
  else if (h === '#/na')                                   view = viewNotModelled();
  else if (h === '#/templates/message-template-list')      view = viewMsgList();
  else if (h === '#/templates/automated-message-list')     view = viewAutoList();
  else if (mDetail)                                        view = viewMsgDetail(mDetail[1]);
  else if (aDetail)                                        view = viewAutoDetail(aDetail[1]);
  else {
    const sec = SECTIONS.find(s => s.route === h);
    view = sec ? viewStub(sec) : viewMsgList();
  }

  document.getElementById('app').innerHTML =
    view + deleteModal() + notesUI() + toastUI();
}

window.addEventListener('hashchange', () => {
  state.route = location.hash;
  state.openMenu = null;
  window.scrollTo(0, 0);
  render();
});
document.addEventListener('click', e => {
  if (state.openMenu && !e.target.closest('.omenu')) { state.openMenu = null; render(); }
}, true);
document.addEventListener('click', e => {
  // The chip's own click is handled by toggleVersion, which fires first.
  if (e.target.closest('#user-chip') || e.target.closest('#version-toast')) return;
  const toast = document.getElementById('version-toast');
  if (toast) toast.classList.remove('visible');
});

if (!location.hash) location.hash = '#/templates/message-template-list';
state.route = location.hash;
render();
</script>
</body>
</html>

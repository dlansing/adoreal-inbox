<!DOCTYPE html>
<html lang="en">
<!--
  ═══════════════════════════════════════════════════════════════════════════
  adoreal. — prototype ecosystem entry point
  ═══════════════════════════════════════════════════════════════════════════

  WHAT HAPPENED TO THIS FILE
  Until 2026-08-22 index.html was a near-duplicate of inbox.html, forked before
  the v0.26 "Contact Center -> Patients" rename. It had drifted badly: its nav
  still said "Contact Center", it was stamped v0.42, and it carried none of the
  v0.43-v0.45 work (the Needs you now band, embed mode, the ?patient= id-vs-
  index bugfix, the Messaging nav). Anyone who opened the folder landed on the
  default index and saw a stale product. That is worse than no file at all.

  It is now a redirect to lms.html, for two reasons:
    1. index.html is what a static file server serves by default, so the
       ecosystem needs it to exist and to land somewhere sensible.
    2. Patients is the entry point under the current IA. There are two
       destinations, Patients and Messaging, and the patient inbox is reached
       by expanding it from a person's row on the queue.

  The real inbox lives in inbox.html and is not orphaned: lms.html expands it,
  and the overlay's "Open in new tab" links straight to it.

  A copy of the old stale file was kept outside the folder when this was
  replaced, and the whole v0.1-v0.42 inbox lineage still exists as
  ~/Downloads/adoreal_unified_inbox_v0_*.html.
-->
